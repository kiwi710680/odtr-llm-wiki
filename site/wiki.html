t-heterogeneity, identification-assumptions, regret-and-decision-accuracy, interpretability, q-learning-dwols-g-estimation), syntheses/overview-for-beginners (new) + method-comparison + dtr-clinical-applications, sources/williams2024 + sources/renson2025 + sources/bluemlein2022 + sources/hong2021 (relations section only), glossary, index | lint PASS after 3 run(s)\n"}, "bluemlein2022": {"title": "Blümlein 等人：用因果樹方法學習最佳動態治療規則", "type": "source", "sources": "[bluemlein2022]", "group": "sources", "md": "\n# Blümlein 等人：用因果樹方法學習最佳動態治療規則\n\n## 一句話\n\n這是一篇方法論文：提出兩個學習最佳動態治療策略（optimal dynamic treatment regime, DTR）的新方法，DTR 因果樹（DTR causal trees, DTR-CT）與 DTR 因果森林（DTR causal forest, DTR-CF），並用模擬資料與加護病房（ICU）真實資料示範。[bluemlein2022, p.1]\n\n出處：Proceedings of Machine Learning Research 182:1–25，2022 年，論文首頁標示為 Machine Learning for Healthcare。[bluemlein2022, p.1]\n\n核心想法：把「依時間倒著往前推的遞迴估計」與「用因果樹或因果森林估計每個時間點的異質處理效應」合在一起。[bluemlein2022, p.6]\n\n生活比喻：想像急診室貼著一張分診流程圖，護理師照著問「血壓高不高？心跳快不快？」一路走到某個終點，就知道這位病人該不該用某項處置。因果樹學出來的規則就像這張流程圖，而且每個終點是「處置有幫助的一群人」。這個比喻是本 wiki 的說明，不是論文的話。\n\n## 研究問題\n\n- 古典 DTR 方法多靠線性迴歸，好解釋，但結構簡單；現代電子病歷資料通常異質、含未知的非線性關係，所以古典方法的用途有限。[bluemlein2022, p.2]\n- 另一條來自機器學習的路線多為黑箱，一般不適合個人化醫療。[bluemlein2022, p.2]\n- 論文因此要找「可解釋、又能處理複雜關係」的最佳 DTR 學習方法。[bluemlein2022, p.2]\n- 論文指出常見方法的兩個缺點：以結局預測而不是處理效應估計為基礎，或使用對病人資料而言過於受限的線性模型。[bluemlein2022, p.1]\n- 研究缺口：論文說就作者所知，沒有先前研究用因果樹或因果森林這類因果方法學習最佳 DTR。[bluemlein2022, p.4]\n- 作者宣稱他們的方法能學非線性關係、控制時間變動的干擾、具倍增穩健性，而且可解釋。[bluemlein2022, p.1]\n\n## 資料與情境\n\n- 符號設定：有 N 位病人、時間步 t = 1 到 T；每位病人有基線共變數（如年齡、性別）與時間變動共變數（如血壓、血氧）；治療是二元的（治療或不治療）；結局 Y 在時間 T + 1 觀察到，且（不失一般性）越大越好。[bluemlein2022, p.4]\n- 病史 Ht 由基線共變數、到前一步為止的治療、到時間 t 為止的時間變動共變數組成。[bluemlein2022, p.4]\n- 模擬資料：5, 000 位病人、病史長度為 3，含兩個基線共變數、五個連續與兩個類別型時間變動共變數。[bluemlein2022, p.11]\n- 模擬有兩個情境：交互作用為線性、交互作用為非線性；真實處理效應被設計成「最佳治療的比例」與「實際治療的比例」不同，以模擬有改善空間的現實情況。[bluemlein2022, p.11]\n- 評估設定：75 % 的資料訓練、25 % 測試，重複 100 次，每次重新模擬資料。[bluemlein2022, p.13]\n- 真實資料：MIMIC-III 的加護病房觀察資料；目標是依序決定要不要使用機械通氣（mechanical ventilation）或血管加壓素（vasopressin），使住院時間（length of stay）縮短。[bluemlein2022, p.14]\n- 以加護病房停留時間越短代表健康越好，作為要最大化的代理指標。[bluemlein2022, p.15]\n- 納入條件：至少被治療過十次的病人，得到 8, 059 位病人、前 10 小時的病史。[bluemlein2022, p.15]\n- 控制的變數：七個時間變動共變數（生命徵象，含三種血壓、心率、血氧、呼吸速率、體溫）與基線共變數（年齡、族裔、性別、種族、保險、入院類型、首次照護單位）。論文文字寫六個基線共變數，但列出的名稱有七個，原因來源未提及。[bluemlein2022, p.15]\n- 缺失值處理（作者做的資料操作）：除體溫外，時間變動共變數的缺失值以中位數補；體溫以其他時間變動共變數的線性模型補。[bluemlein2022, p.15]\n- DTR-CT 與 DTR-CF 以三個時間步的病史估計，目的是偵測最多延遲三個時間步的治療效果。[bluemlein2022, p.15]\n\n## 方法（直覺版）\n\n先講直覺：連續決策要從最後一步往前推，因為前面的最佳決定要看後面會怎麼決定；每一步都在問「這位病人用治療比不用好多少？」，答案為正就給治療。這個問答用因果樹或因果森林來回答。\n\n- 倒推遞迴：從最後一個時間步開始，每一步先估傾向分數，再估處理效應，依正負號決定要不要給治療，然後更新「偽結局」交給前一步。詳見 [[backward-recursion]]。[bluemlein2022, p.6-8]\n- 傾向分數用邏輯斯迴歸估計，原則上任何機率分類器都可以用。[bluemlein2022, p.7]\n- 處理效應（異質處理效應，HTE，即 [[blip-function]]）由因果樹（DTR-CT）或因果森林（DTR-CF）估計，並沿用 DWOLS 的做法，用逆傾向分數加權結局。[bluemlein2022, p.7]\n- DTR-CT：用誠實分割把資料分成訓練集與估計集；訓練集決定怎麼分群，估計集計算每個葉子的處理效應，也就是葉內治療組與未治療組平均結局的差。詳見 [[causal-tree-and-forest]]。[bluemlein2022, p.8-9]\n- DTR-CF：因果森林是許多棵因果樹的集成，像一個自適應的最近鄰估計式，對每位病人以局部鄰域的加權平均估計處理效應。[bluemlein2022, p.9]\n- 倍增穩健：論文說這種加權做法類比 DWOLS（Wallace 等人 2017 年指出加權帶來倍增穩健），所以每個時間步只要傾向分數模型或處理效應模型有一個設定正確，就能得到無偏的處理效應估計與最佳決定。詳見 [[doubly-robust-learner]]。[bluemlein2022, p.10]\n- 可解釋：DTR-CT 可以畫出每個時間步的決策樹；DTR-CF 可以看變數重要性。詳見 [[interpretability]]。[bluemlein2022, p.10-11]\n- 比較對象：五個基準方法，Q 學習、DWOLS、G 估計、CART、k-NN 迴歸。詳見 [[q-learning-dwols-g-estimation]]。[bluemlein2022, p.12]\n- 評估：模擬資料有真值，用累積後悔值與決策準確度；真實資料沒有真值，改用期望增益。詳見 [[regret-and-decision-accuracy]]。[bluemlein2022, p.13]\n- 實作細節：DTR-CT 以 50 % 訓練、50 % 估計；每片葉子的治療與對照病人合計至少 20 位（各 10 位）；分裂用的桶最多 20 個；以 5 折交叉驗證決定剪枝。DTR-CF 每個時間步用 500 棵因果樹。[bluemlein2022, p.24]\n\n## 主要結果\n\n模擬資料（有真正最佳規則可比較）：\n\n- 摘要說，兩個方法在累積後悔值與最佳決策的百分比上，以相當大的差距勝過最新基準方法。[bluemlein2022, p.1]\n- 引言說，與表現最好的基準相比，累積後悔值降低超過 20 %。[bluemlein2022, p.2]\n- 情境一（線性交互作用）：DTR-CT 與 DTR-CF 的累積後悔值分別降低 23.0 % 與 27.1 %。[bluemlein2022, p.13]\n- 情境二（非線性交互作用）：分別降低 25.1 % 與 48.2 %。[bluemlein2022, p.13]\n- 情境二：兩個方法產生真正最佳決策的案例，分別多 7.2 % 與 14.4 %。[bluemlein2022, p.13]\n- 本 wiki 的核對（不是論文的話）：情境二測試集的決策準確度，DTR-CT 為 65.6、DTR-CF 為 72.8、準確度最高的基準 CART 為 58.4；差距正好是 7.2 與 14.4 個百分點，所以上一條的「%」看起來是百分點。[bluemlein2022, p.13-14]\n- 下表為測試集的平均值（標準差）；後悔值越小越好，準確度（%）越大越好。\n\n| 方法 | 線性：後悔值 | 非線性：後悔值 | 線性：準確度 | 非線性：準確度 | 出處 |\n|---|---|---|---|---|---|\n| Q 學習 | 23.730（0.739） | 41.487（3.805） | 69.5（0.7） | 55.9（0.8） | [bluemlein2022, p.14] |\n| DWOLS | 23.566（0.821） | 40.705（1.990） | 69.8（0.7） | 56.2（1.0） | [bluemlein2022, p.14] |\n| G 估計 | 55.807（2.462） | 20.434（2.068） | 34.8（2.7） | 56.0（1.4） | [bluemlein2022, p.14] |\n| CART | 4.188（0.956） | 28.338（26.967） | 82.5（2.1） | 58.4（3.4） | [bluemlein2022, p.14] |\n| k-NN 迴歸 | 26.005（1.149） | 31.750（26.032） | 69.3（1.2） | 49.5（1.7） | [bluemlein2022, p.14] |\n| DTR-CT（本文） | 3.223（1.131） | 15.309（8.471） | 83.9（2.6） | 65.6（5.4） | [bluemlein2022, p.14] |\n| DTR-CF（本文） | 3.052（0.197） | 10.582（1.817） | 82.6（1.6） | 72.8（1.0） | [bluemlein2022, p.14] |\n\n- 本 wiki 對表格的觀察（不是論文的話）：線性情境的決策準確度，DTR-CT 為 83.9、DTR-CF 為 82.6、CART 為 82.5，三者差距很小；非線性情境的後悔值，DTR-CF 的標準差為 1.817，而 DTR-CT 為 8.471、CART 為 26.967，DTR-CF 較穩定。[bluemlein2022, p.14]\n- 超參數敏感度：把每片葉子最少的治療與未治療病人數在 10 到 70 之間變動，累積後悔值與決策準確度變化很小，整體上 DTR-CF 優於 DTR-CT。[bluemlein2022, p.14]\n- 作者因此說幾乎不需要調超參數；本 wiki 補充：論文只變動了「葉子最小人數」這一個超參數。[bluemlein2022, p.14] [bluemlein2022, p.17]\n\n真實資料（MIMIC-III，沒有真值）：\n\n- 沒有真正的最佳決策可比，所以改看「依估計的最佳 DTR 治療，相比實際做法」的期望增益。[bluemlein2022, p.15-16]\n- 兩個方法的累積期望報酬都不為負；論文據此說兩者的估計結局優於實際治療做法。[bluemlein2022, p.16]\n- 下表為論文 Table 3：累積期望報酬，對病人取平均。[bluemlein2022, p.16] 表格由文字萃取，兩欄的對應依閱讀順序判斷。\n\n| 方法 | 機械通氣 | 血管加壓素 | 出處 |\n|---|---|---|---|\n| DTR-CT | 2.176 | 2.097 | [bluemlein2022, p.16] |\n| DTR-CF | 0.233 | 0.203 | [bluemlein2022, p.16] |\n\n- 論文明說不與其他 DTR 基準比較，因為估計的處理效應是尺度隨方法而異（scale-variant）且各方法專屬的；依這句話，上表兩列數字不應直接比大小。[bluemlein2022, p.16]\n- 解釋性展示：DTR-CT 的樹與 DTR-CF 的變數重要性，見 [[interpretability]]。[bluemlein2022, p.16-17]\n- 因果敏感度分析（附錄，Blackwell 2014 的方法）：多數時間步的平均處理效應估計不隨潛在未測量干擾而改變，只有第一個時間步似乎有些敏感；作者結論是真實資料應用沒有令人擔心的未測量干擾。[bluemlein2022, p.25]\n\n## 限制\n\n- 論文限制段落寫「評估兩個時間步」，與模擬的 3 個時間步、真實資料的 10 小時並不一致，原因來源未說明。[bluemlein2022, p.11] [bluemlein2022, p.15] [bluemlein2022, p.18]\n- 基準方法只選可解釋者，或前人研究用過者；作者承認這是限制之一。[bluemlein2022, p.18]\n- 效果主要靠模擬研究展示；在醫療機構實際決策中導入並驗證，留作未來工作。[bluemlein2022, p.18]\n- 真實資料沒有真值，只能看估計的期望增益，且沒有和其他基準比較；這個增益是由方法自己估計的處理效應算出的。[bluemlein2022, p.16]\n- Table 3 的報酬單位，以及住院時間的單位：來源未提及。[bluemlein2022, p.16]\n- 因果敏感度分析只能對線性、逆傾向分數加權的結局模型做，不是對 DTR-CT 或 DTR-CF 本身做；而且估計的是治療者的平均處理效應，不是個人層級的 HTE。作者推測樹與森林可能比較不受未測量干擾影響，這是推測，不是結果。[bluemlein2022, p.25]\n- 論文只處理二元治療；多類別治療與連續劑量：來源未提及。[bluemlein2022, p.4]\n- 學出規則的信賴區間或統計推論：來源未提及。\n- 演算法第二步的文字寫「對觀察到的結局 Y 擬合」，偽結局如何進入下一步的擬合，正文沒有再說明（本 wiki 的觀察）。[bluemlein2022, p.7-8]\n- 圖二、圖五、圖六只有座標標籤被萃取成文字，圖中的數值無法由文字讀出，本 wiki 沒有使用。[bluemlein2022, p.15]\n\n## 和其他頁的關係\n\n- 核心概念頁：[[backward-recursion]]、[[causal-tree-and-forest]]、[[interpretability]]、[[regret-and-decision-accuracy]]、[[q-learning-dwols-g-estimation]]。\n- 延伸的既有概念頁：[[dynamic-treatment-regime]]、[[decision-points-and-history]]、[[optimal-dynamic-treatment-rule]]、[[treatment-effect-heterogeneity]]、[[blip-function]]、[[doubly-robust-learner]]、[[identification-assumptions]]、[[nuisance-functions]]、[[cross-fitting]]、[[rate-double-robustness]]。\n- 與 [[williams2024]] 的對照：兩篇都從最後一個時間點往前估計，但每一步估處理效應的工具不同；與 [[renson2025]] 的對照：倍增穩健的說法。整理在 [[method-comparison]]。\n- 與 [[hong2021]] 的對照：兩篇都用加護病房資料（bluemlein2022 為 MIMIC-III，hong2021 為 MIMIC-IV），也都是估計時間變動的個人化規則；bluemlein2022 的治療是二元，hong2021 的是連續的機械功率劑量，並先用有限混合模型分類。見 [[dtr-clinical-applications]]、[[finite-mixture-subphenotypes]]、[[method-comparison]]。\n- 名詞速查見 [[glossary]]。\n- 與 [[desman2025]] 的對照：bluemlein2022 說強化學習多以深度學習為基礎、不易解釋；desman2025 走的正是這條路線，並用 SHAP 事後說明。見 [[interpretability]]、[[reinforcement-learning-mdp]]、[[method-comparison]]。\n"}, "desman2025": {"title": "Desman 等人：以分布式離線強化學習建議心臟手術後的胰島素劑量", "type": "source", "sources": "[desman2025]", "group": "sources", "md": "\n# Desman 等人：以分布式離線強化學習建議心臟手術後的胰島素劑量\n\n## 一句話\n\n這是一篇臨床應用研究：作者提出名為 GLUCOSE 的演算法，用分布式（distributional）離線（offline）強化學習（reinforcement learning, RL），建議心臟手術後第一天、每小時要給多少常規胰島素（regular insulin），目標是讓血糖落在適當範圍。[desman2025, p.1] [desman2025, p.7]\n\n出處：npj Digital Medicine（2025）第 8 卷文章 313；收稿日期 2024 年 12 月 10 日，接受日期 2025 年 5 月 8 日。[desman2025, p.1] [desman2025, p.10]\n\n核心想法：把「每小時調一次胰島素」當成一連串決策；每小時看病人當下的狀態、決定劑量，並用一個依血糖是否在範圍內而定的「獎勵」來打分，學出能讓累積獎勵最大的做法。不只看平均獎勵，也看獎勵的整個分布，以便照顧罕見但嚴重的低血糖。[desman2025, p.2] [desman2025, p.9]\n\n生活比喻：想像一位新手護理師學習調整點滴速度。她不能在病人身上亂試，只能翻閱許多前輩留下的紀錄：當時血糖多少、調了多少、之後血糖怎麼變。她從紀錄裡學出「遇到這種情況就調這麼多」的習慣，而且特別留意「偶爾會出大事」的情況，例如血糖掉太低。最後再請資深醫師盲評她的建議。這個比喻是本 wiki 的說明，不是論文的話。\n\n讀法提醒：這是回溯性（retrospective）研究，核心的「估計報酬」是演算法對自己建議的離線估計，不是觀察到的病人結局；論文自己說發現需要前瞻性研究與臨床試驗驗證，並建議先靜默部署、再做前瞻性試驗。[desman2025, p.2] [desman2025, p.7]\n\n## 研究問題\n\n- 心臟手術引起代謝壓力反應，術後高血糖很常見：糖尿病病人為 60 至 80%，非糖尿病病人超過 50%。[desman2025, p.1]\n- 高血糖與術後感染、急性腎損傷、心律不整、住院較久與較高死亡率有關；胸腔外科醫學會（Society of Thoracic Surgeons, STS）建議術後血糖維持在 180 mg/dL 以下。[desman2025, p.1]\n- 論文引用的一項研究：術後第一天只有 15% 的病人血糖落在 70 至 180 mg/dL。[desman2025, p.1]\n- 現行做法是依各醫院的流程與醫師經驗調整常規胰島素；常見的階梯式（sliding scale）劑量是反應式、非個人化的，同一個血糖給同一個劑量，不看病人個別條件，論文說這可能無效甚至危險。[desman2025, p.1] [desman2025, p.2]\n- 論文回顧的既有演算法多為階梯式劑量、血糖預測、或靜態的每日劑量估計；它說血糖預測模型預測的是趨勢，不是建議一連串的胰島素劑量。[desman2025, p.2]\n- 因此論文主張從「預測」轉到「決策」：用強化學習學出依病人個別血糖波動調整的最佳胰島素劑量策略。[desman2025, p.2]\n- 胰島素的治療窗口很窄：低血糖（小於 70 mg/dL）在心臟手術後的發生率為 5 至 21%，促使醫師保守給藥，卻可能造成持續高血糖。[desman2025, p.7]\n\n## 資料與情境\n\n- 開發資料：MIMIC-IV，單一中心（Beth Israel Deaconess Medical Center），去識別化的加護病房（ICU）資料，2008 年至 2019 年。[desman2025, p.8]\n- 外部驗證資料：eICU-CRD，來自 208 家美國醫院、超過 200,000 筆去識別化入院，2014 年至 2015 年。[desman2025, p.8]\n- 病人數：開發資料集 6,148 位、外部驗證 649 位；摘要寫訓練 5228 位、內部測試 920 位、外部驗證 649 位。[desman2025, p.1] [desman2025, p.2]\n- 本 wiki 的核對（不是論文的話）：5228 加 920 等於 6148，和開發資料集的人數一致。[desman2025, p.1] [desman2025, p.2]\n- 基本特徵：開發資料集平均年齡 67.8 ± 11.6 歲、男性 71.1%；外部驗證為 67.0 ± 11.3 歲、男性 67.2%。[desman2025, p.2]\n- 事件比例：至少發生一次低血糖（小於 70 mg/dL）的病人，開發資料集 7.6%、外部驗證 7.2%；至少發生一次高血糖（大於 180 mg/dL）的病人，開發資料集 47.8%、外部驗證 47.3%。[desman2025, p.2]\n- 納入條件：成人（18 歲以上）心臟手術後入住 ICU；MIMIC-IV 以手術編碼辨識，eICU-CRD 沒有這類編碼，改用入院診斷表。[desman2025, p.8]\n- 排除條件：入 ICU 後 24 小時內死亡、給藥紀錄含糊以致無法算出劑量、入 ICU 後頭三小時內沒有血糖值；另外因為目標是個人化「常規」胰島素，也排除用過其他短效胰島素的病人。[desman2025, p.8]\n- 排除的人數：eICU-CRD 因給藥紀錄含糊排除了 4,838 位；MIMIC-IV 不需要因此排除任何人。[desman2025, p.8]\n- 資料操作（作者做的）：以 1 小時為間隔整理成時間序列；缺失超過 30% 的特徵剔除；其餘缺失先以前一個值往後填，再用 k 近鄰法（k = 5）補；只用每位病人的前 24 小時；所有特徵依訓練集正規化到 0 到 1；離群值以直方圖與描述統計檢查並修正明顯錯誤（例如溫度單位轉換）。[desman2025, p.8]\n- 結局定義：「適當的血糖控制」是第一天內每小時血糖落在 70 至 180 mg/dL；時間步從 ICU 入院後第一次血糖測量開始記。[desman2025, p.8]\n\n## 方法（直覺版）\n\n先講直覺：把每小時視為一個決策點。演算法看病人當下的狀態（血糖與最近的血糖變化、生命徵象、實驗室值、用藥、是否使用呼吸器、SOFA 分數等），輸出這一小時的胰島素劑量；血糖在好的範圍就得到正的獎勵，落到太低或太高就被扣分。它從歷史紀錄學習，不會真的在病人身上試。強化學習的基本詞彙見 [[reinforcement-learning-mdp]]。\n\n- 狀態：人口學、共病、實驗室值、生命徵象、用藥、機械通氣與 SOFA 分數，整理成每小時一筆；另外放入前四小時的血糖、這段期間的血糖變化，以及每小時血糖變化與胰島素劑量的比值（算比值時劑量下限設為 0.1）。[desman2025, p.9]\n- 行動：每小時給的常規胰島素量，是連續的；建議劑量四捨五入到整數，並把建議與觀察到的劑量上限設在每小時 10 單位。論文說依據是資料與臨床安全：MIMIC-IV 平均每小時 2.2 ± 3.0 單位，超過 10 單位的只占 2.29%；上限也強調需要醫師在迴路中（physician-in-the-loop）。[desman2025, p.9]\n- 獎勵：血糖在 140 至 180 mg/dL 時最高為 +0.2，離開這個範圍後罰則越來越重，最低到 −1；論文說選較小的獎勵量級是為了訓練穩定、選偏負的獎勵是為了不鼓勵範圍外的數值。再加上一項隨劑量增大的懲罰，以勸阻過度矯正。[desman2025, p.9]\n- 折扣因子（discount factor）設為 0.67，相當於約 3 小時的有效視野；論文說血糖變化快，太高的折扣因子會讓模型過度看重遠期、或對眼前的差狀態不敏感。[desman2025, p.9]\n- 演算法：保守 Q 學習（conservative Q learning, CQL）加上隱含分位數網路（Implicit Quantile Networks, IQN），網路為三層隱藏層的多層感知器；詳見 [[offline-reinforcement-learning]] 與 [[distributional-reinforcement-learning]]。[desman2025, p.8] [desman2025, p.9]\n- 訓練與挑選：開發資料先分成 85% 訓練與 15% 內部測試；在訓練集的 80% 子樣本上訓練多個模型，每次用不同隨機種子；共訓練 200 個獨立模型，挑出在內部測試集上、估計報酬 95% 信賴區間下界最高的那一個，就是 GLUCOSE。[desman2025, p.2] [desman2025, p.9]\n- 其他設定：批次大小 256、dropout 為 0.1、使用 Python 3.8.2 與 d3rlpy 套件。[desman2025, p.9]\n- 評估一：以擬合 Q 評估（fitted Q evaluation, FQE）做離線策略評估，並以重抽樣 10,000 次取得 95% 信賴區間；詳見 [[off-policy-evaluation]]。[desman2025, p.9]\n- 評估二：把「模型建議的劑量減掉醫師實際給的劑量」在前 24 小時加總，檢視血糖在範圍內的時間比例（time in range, TIR）如何隨差距變化。[desman2025, p.9] [desman2025, p.10]\n- 評估三：用排列式 SHAP（Permutation SHAP）看各特徵的貢獻。[desman2025, p.10]\n- 評估四：三階段的人類評估，見下一節。[desman2025, p.10]\n- 統計檢定：類別變數用卡方檢定，連續變數用 t 檢定與 Kruskal-Wallis 檢定，劑量比較用 Mann-Whitney U 檢定，顯著水準 0.05；Python 與 SciPy。[desman2025, p.10]\n\n## 主要結果\n\n離線評估的估計報酬（GLUCOSE 的數字以 FQE 估計；論文說的「顯著改善」，是拿 GLUCOSE 信賴區間的下界去和醫師信賴區間的上界比，不是觀察到的病人結局）：[desman2025, p.2]\n\n| 資料集 | GLUCOSE 估計報酬（信賴區間） | 臨床醫師報酬（信賴區間） | 出處 |\n|---|---|---|---|\n| 內部測試 | 0.0（−0.07 至 0.06） | −1.29（−1.37 至 −1.20） | [desman2025, p.2] |\n| 外部驗證 | −0.63（−0.74 至 −0.52） | −1.02（−1.16 至 −0.89） | [desman2025, p.2] |\n\n- 論文說明圖中的實線是 GLUCOSE 經離線評估得到的估計表現，虛線是觀察到的醫師行為的表現；也就是說兩邊的算法不同，一邊是估計、一邊是觀察。[desman2025, p.2] [desman2025, p.4]\n- 本 wiki 的讀法（不是論文的話）：報酬是作者自訂的尺度（最高 +0.2、最低 −1），所以 0.0 與 −1.29 這類數字只能在這個尺度下比較，不是血糖或臨床單位；內部測試集也被用來挑模型，外部驗證的 −0.63 才是沒參與挑選的估計；兩個資料集的數值落差論文沒有解釋：來源未提及。[desman2025, p.2] [desman2025, p.9]\n\n血糖在範圍內的時間（TIR）與劑量差距：\n\n- 醫師實際給的劑量與 GLUCOSE 建議完全相同的時間，內部測試集占 27.3%，外部驗證占 20.3%。[desman2025, p.2]\n- 醫師的劑量與模型建議相近時，平均 TIR 最高；兩者差距越大，TIR 越低。論文的解讀是模型「找出了胰島素管理可改進之處」。[desman2025, p.2]\n- 依性別、種族、糖尿病狀態分層後，各亞群都是同樣的型態：建議與實際給藥相符時 TIR 最高。論文據此說模型在這些亞群表現一致。[desman2025, p.3]\n- 本 wiki 的觀察（不是論文的話）：這是觀察性的關聯；「醫師剛好給得和模型一樣」的時段，病人的狀況是否本來就比較好控制，論文沒有討論：來源未提及。[desman2025, p.2]\n- 劑量分布：在血糖低於 180 mg/dL 的各區間，GLUCOSE 建議的平均劑量一律比醫師少；血糖高於 200 mg/dL 時，建議劑量超過醫師。論文說這符合指引、也避開低血糖。[desman2025, p.3]\n- 差異最大的案例：模型與醫師分歧最大的情況集中在血糖約 140 mg/dL；內部測試集醫師平均給 5.9 單位、模型 1.8 單位，平均血糖 142 mg/dL；外部驗證集醫師給 6.7 單位、模型 1.6 單位，平均血糖 139.5 mg/dL。[desman2025, p.3]\n- SHAP 的結果：最重要的特徵是近期與歷史血糖，其次是反映病人嚴重度的指標，包括是否使用及使用多久的機械通氣、SOFA 分數、Elixhauser 共病指數與手術類型；論文說這與臨床直覺相符。[desman2025, p.3]\n\n三階段人類評估（論文說這是研究的一大優點）：[desman2025, p.7]\n\n- 第一階段：兩位有十年以上經驗的資深內分泌科醫師，對內部測試與外部驗證各 10 位病人，給出第一天每小時的胰島素建議。他們看得到整段時間序列，包含醫師實際給的劑量與之後的血糖；GLUCOSE 只能看到目前的狀態。以兩位內分泌科醫師建議的平均為參照，比較 GLUCOSE 與實際給藥的平均絕對誤差（mean absolute error, MAE）。[desman2025, p.3] [desman2025, p.5]\n- 第二階段：兩位資深心臟加護醫師（經驗超過 5 年）、兩位資淺的心臟加護醫師（經驗少於 5 年）與兩位心臟加護病房專科護理師，對同一批病人給建議，一樣以內分泌科醫師的平均為參照。[desman2025, p.5]\n- 第三階段：另外兩位資深加護醫師對 GLUCOSE 與全部 8 組人類建議做盲評，對同一批 20 位病人，用 5 分的 Likert 量表評安全性（低血糖風險）、有效性（是否把血糖帶進可接受範圍）與可接受度。[desman2025, p.5] [desman2025, p.6]\n\n| 比較 | 內部測試 MAE（單位） | 外部驗證 MAE（單位） | 出處 |\n|---|---|---|---|\n| 第一階段：GLUCOSE 對實際給藥 | 0.9 對 1.97（p < 0.001） | 1.90 對 2.24（p = 0.003） | [desman2025, p.5] |\n| 第二階段：GLUCOSE 對資深加護醫師 | 0.90 對 0.82（p = 0.57） | 1.90 對 1.58（p = 0.32） | [desman2025, p.5] |\n| 第二階段：GLUCOSE 對較資淺加護醫師 | 0.90 對 1.15（p = 0.25） | 1.90 對 2.15（p = 0.53） | [desman2025, p.5] |\n| 第二階段：GLUCOSE 對專科護理師 | 0.90 對 1.23（p = 0.21） | 1.90 對 2.28（p = 0.38） | [desman2025, p.5] |\n\n- 第一階段 GLUCOSE 的 MAE 顯著較低，論文解讀為它的劑量更接近內分泌科醫師的建議。[desman2025, p.5]\n- 第二階段的差異都沒有達到統計顯著；論文只說 GLUCOSE 對較資淺醫師與護理師有較低 MAE 的「趨勢」。本 wiki 的觀察：資深加護醫師的 MAE 在兩個資料集的數值上都比 GLUCOSE 低。[desman2025, p.5]\n- 第三階段：在內部測試與外部驗證，GLUCOSE 的安全性、有效性與可接受度評分和所有人類建議相當，或顯著較高；論文說它在所有面向都不低於資深心臟外科加護醫師。各組的平均評分只出現在圖中：來源未提及文字數值。[desman2025, p.6]\n- 案例圖（隨機挑選的內部測試與外部驗證病人）：論文說 GLUCOSE 會隨血糖走勢調整劑量，常常為了避免超過目標而降低劑量。這是質性展示。[desman2025, p.6]\n- 被排除的 eICU-CRD 病人：只有胰島素紀錄含糊的 3,001 位、胰島素與升壓劑／強心劑紀錄都含糊的 1,804 位，另有 33 位因為人數太少而不分析；由於沒有準確的胰島素紀錄，無法做離線策略評估或直接比較，只比較建議劑量的分布，論文說各血糖區間的平均建議劑量差都小於半個單位，不具臨床意義。[desman2025, p.6]\n- 本 wiki 的核對（不是論文的話）：3,001、1,804 與 33 相加是 4,838，與 eICU-CRD 排除人數一致。[desman2025, p.6] [desman2025, p.8]\n\n## 限制\n\n- 論文自述：這是回溯性研究，需要大型、多樣病人群的前瞻性研究與臨床試驗來驗證；未來要做隨機對照試驗；實際導入要先靜默部署，再做前瞻性臨床試驗。[desman2025, p.7] [desman2025, p.8]\n- 論文自述：模型只在手術後第一天訓練與驗證；沒有納入飲食資料（論文說第一個 24 小時病人多半幾乎沒有經口進食，且逐時飲食紀錄很少見）；導入可能需要依院區調整。[desman2025, p.7] [desman2025, p.8]\n- 論文自述：為了確保訓練正確，只納入給藥紀錄準確的病人，所以 eICU-CRD 排除了很多人；作者以被排除病人的建議分布來說明模型應可推廣，但沒有結局可比較。[desman2025, p.6] [desman2025, p.8]\n- 論文自述：還需處理法規與營運問題，例如病人隱私法規與電子病歷整合。[desman2025, p.7]\n- 程式碼因專有原因不公開，只可向通訊作者合理請求；GLUCOSE 是一項暫時性專利申請的標的，三位作者是發明人。[desman2025, p.10] [desman2025, p.12]\n- 本 wiki 的觀察（不是論文的話）：人類評估的參照是兩位內分泌科醫師的平均，MAE 衡量的是「與他們的建議有多接近」，不是病人的結局；而且參與評估的醫師看得到整段時間序列，論文稱這使他們的做法近乎最佳；每個資料集只有 10 位病人。[desman2025, p.3] [desman2025, p.5] [desman2025, p.7]\n- 本 wiki 的觀察：論文說明選 CQL 的理由，但沒有在正文報告它與其他離線 RL 方法的比較結果，也沒有報告拿掉分布式部分的對照實驗，所以無法把表現歸因於分布式的設計：來源未提及。[desman2025, p.8] [desman2025, p.9]\n- 論文沒有討論因果識別的前提（一致性、可交換性、正值性）或未測量干擾：來源未提及。見 [[identification-assumptions]]。\n- 論文內部的數字或用語不一致，本 wiki 都照原文記錄、不修正：（一）男性比例，文字寫開發資料集 71.1%，Table 1 寫 4402（71.6）。[desman2025, p.2] [desman2025, p.3]（二）OPE 的全名，正文寫 off-policy evaluation，方法段寫 offline policy estimation。[desman2025, p.2] [desman2025, p.9]（三）劑量懲罰項，論文文字稱為「指數式增加」，而萃取到的式子是劑量的平方項，本 wiki 不判斷哪一個為準：來源未提及。[desman2025, p.9]\n- 圖與補充材料（Fig. 2 至 Fig. 4、補充圖表）的數值不在文字中，本 wiki 沒有使用。[desman2025, p.4]\n\n## 和其他頁的關係\n\n- 新的概念頁：[[reinforcement-learning-mdp]]、[[offline-reinforcement-learning]]、[[distributional-reinforcement-learning]]、[[off-policy-evaluation]]；整體導覽見 [[overview-for-beginners]]。\n- 延伸的既有概念頁：[[dynamic-treatment-regime]]、[[decision-points-and-history]]、[[optimal-dynamic-treatment-rule]]、[[treatment-effect-heterogeneity]]、[[identification-assumptions]]、[[regret-and-decision-accuracy]]、[[interpretability]]、[[q-learning-dwols-g-estimation]]。\n- 與 [[hong2021]] 的對照：兩篇都用加護病房資料學時間變動的連續劑量，也都用「實際用量離建議多遠」檢查結果；差別在 desman2025 用強化學習、有外部驗證資料與人類評估。整理在 [[dtr-clinical-applications]] 與 [[method-comparison]]。\n- 與 [[bluemlein2022]] 的對照：bluemlein2022 說強化學習多以深度學習為基礎、不易解釋；desman2025 走的正是這條路線，並用 SHAP 事後說明。見 [[interpretability]]。\n- 與 [[williams2024]]、[[renson2025]] 的關係：desman2025 沒有使用動態治療策略、blip 函數、倍增穩健或有效影響函數這些語彙：來源未提及。\n- 名詞速查見 [[glossary]]。\n"}, "hong2021": {"title": "Hong 等人：以有限混合模型與動態治療策略建立個人化機械功率通氣策略", "type": "source", "sources": "[hong2021]", "group": "sources", "md": "\n# Hong 等人：以有限混合模型與動態治療策略建立個人化機械功率通氣策略\n\n## 一句話\n\n這是一篇臨床應用研究：用加護病房（ICU）的觀察資料，先以有限混合模型（finite mixture modeling, FMM）把急性呼吸衰竭（acute respiratory failure, ARF）病人分成三類，再以動態治療策略（dynamic treatment regime, DTR）估計「機械功率」（mechanical power, MP）的個人化最佳值，目的是把「個人化機械通氣策略」形式化。[hong2021, p.1]\n\n出處：EClinicalMedicine 第 36 卷（2021）文章編號 100898，線上發表日期為 2021 年 5 月 24 日。[hong2021, p.1]\n\n核心想法：先把病人依病況分成幾種「類型」，再為每個時間點、每位病人估一個最佳的機械功率，最後用「實際用的功率離最佳值多遠」與死亡的關係來檢查估出來的最佳值有沒有道理。[hong2021, p.2]\n\n生活比喻：想像一位體育老師要為全校學生安排每天的跑步量。他先不看病歷，只看體能與身體狀況，把學生自動分成幾種體質類型；接著每次上課前，依學生當天的狀況與前一次的反應，決定這次跑多少。最後他回頭看：實際跑的量離他建議的量越遠的學生，是不是越常出狀況。這個比喻是本 wiki 的說明，不是論文的話。\n\n讀法提醒：這是單一資料庫的回溯性觀察分析，結果以風險比與勝算比這類關聯估計呈現；論文自己也說，依 DTR 調整通氣是否改善死亡，還需要前瞻性試驗來檢驗。[hong2021, p.2] [hong2021, p.8]\n\n## 研究問題\n\n- ARF 是需要立即處置的急症；重症常需要侵入性機械通氣（mechanical ventilation, MV）來維持氣體交換，但通氣本身也可能造成肺損傷。[hong2021, p.1]\n- 保護性通氣（限制潮氣量、平台壓與驅動壓）被建議用來減少損傷；較新的研究指出機械功率可能提供較好的肺損傷預測。詳見 [[mechanical-power]]。[hong2021, p.1]\n- 指引常見的單一數值建議是 ARDS 病人潮氣量小於 6 ml/kg、平台壓小於 30 cmH2O；論文說這樣的單一值未必對所有 ARF 病人都有益，因為族群有異質性。[hong2021, p.1]\n- 論文舉的例子：有些病人在低潮氣量下會發生嚴重的二氧化碳滯留，有些人因為循環衰竭無法耐受高 PEEP。[hong2021, p.1]\n- 因此論文主張通氣策略必須個人化，要同時考慮目前的生理狀況與先前對治療的反應；它認為這可以用 DTR 形式化。[hong2021, p.1-2]\n- 具體目標：找出 ARF 的表型（phenotypes），再用 DTR 估計一串以 MP 為基礎的最佳通氣策略，並用「實際 MP 與最佳 MP 的差（ΔMP）」對死亡做迴歸來驗證。[hong2021, p.2]\n\n## 資料與情境\n\n- 資料庫：MIMIC-IV，來自美國波士頓 Beth Israel Deaconess Medical Center 2008 年至 2019 年的去識別化資料，涵蓋超過 50,000 位有詳細 ICU 資料的成人病人。[hong2021, p.2]\n- ARF 的定義：在室內空氣下，動脈血氧分壓（PaO2）小於 8 kPa（小於 60 mmHg）與／或動脈二氧化碳分壓（PaCO2）大於 6.5 kPa（大於 50 mmHg）。[hong2021, p.2]\n- 排除條件：未滿 18 歲、接受體外膜氧合（ECMO）、通氣時間少於 48 小時；多次入住 ICU 者取第一次。[hong2021, p.2]\n- 病人數：先找到 69,619 次 ICU 入院，納入 8768 位接受機械通氣超過 48 小時的 ARF 病人。[hong2021, p.3]\n- 基本特徵：年齡中位數 64 歲（IQR 53 至 75）；ARDS 117 位（1%）、sepsis 2379 位（27%）、COPD 741 位（8%）、心衰竭 2448 位（28%）；全體死亡率 27%（2365/8768）。[hong2021, p.3]\n- 變數：人口學與臨床變數（年齡、性別、身高、診斷、收縮壓、心率）、通氣參數（潮氣量、呼吸速率、FiO2、平台壓、PEEP、峰值壓）、實驗室變數（PaO2、PaCO2、base excess、HCO3、pH、lactate、hematocrit、creatinine、total bilirubin）。[hong2021, p.2]\n- 時間點：從開始通氣起每 8 小時蒐集一次時間變動變數，共 48 小時，所以有 7 個時間點（0 到 48 小時）；同一個 8 小時窗內有多次測量時取平均。[hong2021, p.2]\n- 缺失值（作者做的資料操作）：以末次觀察值延續（last observation carried forward, LOCF）補；作者說另以 hot deck 法做了敏感度分析以確認結果穩定，但結果未顯示。[hong2021, p.2]\n- 結局：死亡（存活）。DTR 的結局模型把死亡結局當作被最佳化的結局；MP 與存活的關聯用含時間變動共變數的 Cox 迴歸，ΔMP 與住院死亡的關聯用邏輯斯迴歸。[hong2021, p.3] [hong2021, p.4]\n\n## 方法（直覺版）\n\n先講直覺：兩段式。第一段不事先給標籤，讓模型把病人依病況自動分成幾類；第二段把機械功率當成一個可連續調整的「劑量」，估計在每個時間點、對每位病人最好的劑量是多少，再拿實際用的劑量去和它比。\n\n- 第一段：有限混合模型（又稱潛在剖面分析，latent profile analysis, LPA），詳見 [[finite-mixture-subphenotypes]]。類別數由模型適配統計與臨床意義共同決定：AIC 與 SABIC 越低、entropy 越高越好；最小類別的比例須大於 10%；歸入某一類的最小機率須大於 0.85；並用 k-means 分群確認類別數。[hong2021, p.2]\n- 類別間的比較用卡方檢定或 Fisher 精確檢定、Kruskal-Wallis 檢定或變異數分析；類別與 MP 的交互作用以含時間變動共變數的多變量 Cox 迴歸探討，並報告每增加 5 Joules/min 的風險比。[hong2021, p.2]\n- 第二段：用 DTR 估計前 48 小時、每 8 小時的最佳 MP，使最終臨床結局最佳。因為 MP_static 與存活的關聯比 MP_dynamic 強（風險比一貫較高），論文只最佳化 MP_static。[hong2021, p.2-3]\n- 結局模型把死亡結局的期望值拆成「沒有治療的模型」加上「blip 函數」，見 [[blip-function]]；MP 劑量的分布假設為 Gamma 分布，連結函數取對數；blip 中同時有 MP 的一次項與二次項，一次項與年齡、呼吸速率、收縮壓、心率、類別、血氣與實驗室指標交互，二次項只與類別和 P/F 比值交互。[hong2021, p.3]\n- 估計方法是動態加權普通最小平方法（dWOLS），見 [[q-learning-dwols-g-estimation]]；輸出是 0 到 48 小時的個人化最佳 MP 劑量策略。[hong2021, p.3]\n- 檢查方式：把實際 MP 減最佳 MP 記為 ΔMP，比較不同 ΔMP 的病人的死亡結局；另用含二次項的邏輯斯迴歸看最低死亡風險是否落在 ΔMP 約為零處；並用邏輯斯迴歸探索哪些因子與 ΔMP 大於 5 Joules/min 有關。[hong2021, p.3]\n\n## 主要結果\n\n類別（FMM）：\n\n- AIC 與 SABIC 從 2 類模型一路下降到 10 類模型，但 4 類到 10 類模型中最小的類別都不到 5% 的病人；entropy 指向 3 類模型；k-means 分群也確認 3 類。[hong2021, p.3-4]\n- 三個類別在前三個主成分上可以分開（解釋總變異的 18%、13.8% 與 8.9%）。[hong2021, p.4]\n- 論文的描述：Class 1 是最大的一類，各變數接近平均（Baseline Class）；Class 2 以代謝性酸中毒（最低 pH 7.29；IQR 7.23 至 7.33）與組織灌流差（lactate 2.77；IQR 1.67 至 4.50 mmol/L）為特徵，稱為 Critical Class；Class 3 的特徵是即使在通氣下仍有高 PaCO2 與低 PF，稱為 Refractory Respiratory Failure Class。[hong2021, p.4]\n- 下表為論文 Table 1（開始通氣的第 0 小時）：[hong2021, p.4] 表格由文字萃取，欄位依閱讀順序判斷。\n\n| 類別 | 人數 | 死亡 n（%） | 靜態 MP 中位數（Joules/min） | 出處 |\n|---|---|---|---|---|\n| Class 1 | 4372 | 964（22） | 13.84 | [hong2021, p.4] |\n| Class 2 | 3637 | 1215（33） | 16.13 | [hong2021, p.4] |\n| Class 3 | 759 | 186（25） | 15.84 | [hong2021, p.4] |\n| 全體 | 8768 | 2365（27） | 14.80 | [hong2021, p.4] |\n\n- 本 wiki 對欄位的核對（不是論文的話）：三個類別人數 4372、3637、759 加起來是 8768，死亡數 964、1215、186 加起來是 2365；Class 2 的 pH 7.29 與 lactate 2.77 也和論文文字相同，所以欄位順序是全體、Class 1、Class 2、Class 3。[hong2021, p.4]\n- Table 1 的其他對照：Class 3 的 PaCO2 中位數為 64.00 mmHg，Class 1 與 Class 2 都是 41.00；PF 中位數 Class 1 為 173.00、Class 2 為 136.00、Class 3 為 125.00；Class 3 中 COPD 為 144（19）、心衰竭為 326（43），Class 2 中 sepsis 為 1448（40）。[hong2021, p.4]\n- 類別會隨時間改變：從 Class 2 轉到 Class 1 的病人較可能存活到出院；Class 3 在通氣期間維持不變。[hong2021, p.4] [hong2021, p.5]\n- 論文討論處說，這些類別無法完全由 COPD、ARDS、心衰竭或 sepsis 等傳統原因解釋。[hong2021, p.5-6]\n\nMP 與死亡的關聯（含時間變動共變數的 Cox 迴歸）：\n\n- 類別與 MP 有顯著交互作用。MP_static 每增加 5 Joules/min 的死亡風險比，在 Class 1 最小（1.29；95% CI 1.15 至 1.45；p < 0.001），在 Class 3 最大（1.83；95% CI 1.52 至 2.20；p < 0.001）；MP_dynamic 的結果相同方向。Class 2 的風險比：正文未列，來源未提及（可能只在圖中）。[hong2021, p.4]\n- 生存機率：Class 2 隨時間最低，Class 1 在 30 天內最高。[hong2021, p.4]\n- 肺損傷嚴重度：以 P/F 比值小於 100 mmHg 為參照，P/F 100 至 200 mmHg 與 MP 的交互作用項風險比為 0.98（0.96 至 0.99），200 至 300 mmHg 為 0.96（0.95 至 0.98），大於 300 mmHg 為 0.94（0.92 至 0.96），三者 p 皆小於 0.001。[hong2021, p.4] [hong2021, p.7]\n- 肺順應性：以小於 15 ml/cmH2O 為參照，15 至 30 ml/cmH2O 的交互作用項風險比為 0.98（0.95 至 1.00；p = 0.057），大於 30 ml/cmH2O 為 0.96（0.94 至 0.98；p = 0.001）。[hong2021, p.4] [hong2021, p.7]\n- 本 wiki 的讀法（不是論文的話）：這些交互作用項都小於 1，方向與「P/F 比值或順應性越好，MP 增加的不良關聯越小」一致；論文討論處則說，P/F 比值較差的病人較可能有 MP 引起的肺損傷。[hong2021, p.4] [hong2021, p.8]\n\nDTR 與 ΔMP：\n\n- 估出的最佳 MP_static 在三個類別不同：Class 1 為 14.6 ± 9.1，Class 2 為 17.2 ± 8.9，Class 3 為 13.0 ± 8.2。論文印的單位是 ml/cmH2O，與 MP 的單位 Joules/min 不一致，原因來源未提及；± 後的數字是不是標準差，來源未提及。[hong2021, p.4]\n- ΔMP 分成五類（very low、low、optimal、high、very high），切點為 10、5、5、10 Joules/min，切點取在分位數並取整數；萃取文字中負號遺失，依 ΔMP 的定義與類別名稱，本 wiki 讀成 low 與 very low 為負值。[hong2021, p.4] [hong2021, p.8]\n- ARDS 病人比 COPD 或心衰竭病人更常以高於最佳的 MP 通氣；Class 3 病人也較常高於最佳。[hong2021, p.4]\n- 以 optimal 的 ΔMP 為參照，ΔMP 偏低（OR 1.08；95% CI 1.02 至 1.15；p = 0.01）或偏高（OR 1.07；95% CI 1.00 至 1.14；p = 0.043）都與住院死亡風險增加有關；含二次項的邏輯斯迴歸得到相同結論。[hong2021, p.4]\n- 與 ΔMP 大於 5 Joules/min（論文稱為 hyperventilation）有關的因子：Class 2 與較低風險有關（OR 0.56；95% CI 0.53 至 0.60），Class 3 與較高風險有關（OR 1.24；95% CI 1.14 至 1.35）；P/F 比值每增加 10 mmHg 的 OR 為 0.75（95% CI 0.70 至 0.82）。[hong2021, p.5] [hong2021, p.8]\n- 論文的臨床詮釋：Class 3 的 MP 可以再降低；COPD 病人較常以低於最佳的 MP 通氣，較高的 MP 可用來確保氧氣供應與二氧化碳排除。這是作者的詮釋，不是試驗結果。[hong2021, p.7]\n\n## 限制\n\n- 論文自述：估出的最佳 MP 是「最佳化通氣的目標」；實務上重度肺損傷病人為了氣體交換，未必能降低 MP；把 MP 調到模型選出的水準是否改善結局，仍待驗證。[hong2021, p.8]\n- 論文自述：需要前瞻性試驗來檢驗 DTR 引導的通氣策略能否改善死亡。[hong2021, p.2] [hong2021, p.8]\n- 論文自述的另一個限制：沒有納入身體質量指數，改以固定的身高進入模型，理由是重症病人的體重會因輸入輸出不平衡而變動。[hong2021, p.8]\n- 論文討論處用「證明」「支持有效性」等字眼，但呈現的是勝算比與風險比這類關聯估計；本 wiki 不把它們升級為因果結論。[hong2021, p.7] [hong2021, p.8]\n- 驗證用的外部資料：來源未提及；最佳 MP 與驗證用的 ΔMP 迴歸是否取自同一批資料、有沒有分成估計與驗證兩份：來源未提及（本 wiki 的觀察：若沒有分開，這個驗證是在估出最佳值的同一批資料上做的）。[hong2021, p.3]\n- 識別假設（一致性、可交換性、正值性）的討論與檢驗：來源未提及；除 hot deck 對補值的敏感度分析外，沒有看到對未測量干擾的敏感度分析。[hong2021, p.2]\n- 估出的最佳規則的係數、實際 MP 為何因人而異、要調哪個呼吸器參數才能改變 MP：來源未提及。[hong2021, p.3]\n- 納入條件要求通氣超過 48 小時；論文沒有討論這個條件對結論的影響：來源未提及。[hong2021, p.2]\n- 論文內部的數字不一致，本 wiki 都照原文記錄、不修正：（一）男性比例，文字寫 5025/8768 與 63%，Table 1 寫 5025（57）。[hong2021, p.3] [hong2021, p.4]（二）顯著性，文字說順應性 15 至 30 ml/cmH2O 的交互作用項「顯著」，但 p = 0.057，而論文自訂雙尾 p 小於 0.05 才算顯著。[hong2021, p.3] [hong2021, p.4]（三）最佳 MP 的單位，見上。[hong2021, p.4]\n- 類別比例：方法段要求最小類別的比例大於 10%，而 Table 1 的 Class 3 在第 0 小時是 759 位、占 8768 位的比例不到十分之一（本 wiki 的計算）；類別是否在每個時間點分別歸類、比例用哪個分母計算：來源未提及，本 wiki 不下結論。[hong2021, p.2] [hong2021, p.4]\n- 圖（Fig. 2 至 Fig. 5）的數值只在圖中，文字萃取讀不出來，本 wiki 沒有使用。[hong2021, p.5]\n- 引用文獻 [24] 的標題是 MIMIC-III，而內文寫使用 MIMIC-IV，原因來源未說明（本 wiki 的觀察）。[hong2021, p.2] [hong2021, p.9]\n\n## 和其他頁的關係\n\n- 新的概念頁：[[mechanical-power]]、[[finite-mixture-subphenotypes]]。\n- 延伸的既有概念頁：[[dynamic-treatment-regime]]、[[decision-points-and-history]]、[[optimal-dynamic-treatment-rule]]、[[treatment-effect-heterogeneity]]、[[blip-function]]、[[q-learning-dwols-g-estimation]]、[[identification-assumptions]]、[[regret-and-decision-accuracy]]。\n- 與 [[williams2024]]、[[bluemlein2022]] 的對照：三篇都是從多個時間點的觀察資料學個人化規則；差別在 hong2021 的治療是連續劑量、前面多了一步分類、而且驗證用的是關聯而不是規則價值或期望增益。整理在 [[method-comparison]] 與 [[dtr-clinical-applications]]。\n- 與 [[renson2025]] 的關係：hong2021 是否使用交叉擬合、有效影響函數或速率倍增穩健等工具：來源未提及。\n- 名詞速查見 [[glossary]]。\n- 與 [[desman2025]] 的對照：兩篇都用加護病房資料學時間變動的連續劑量，也都看實際用量離建議多遠；desman2025 用強化學習，有外部驗證資料與人類評估。整理在 [[dtr-clinical-applications]] 與 [[method-comparison]]。\n"}, "renson2025": {"title": "Renson 等人：從統計估計目標到機器學習估計式", "type": "source", "sources": "[renson2025]", "group": "sources", "md": "\n# Renson 等人：從統計估計目標到機器學習估計式\n\n## 一句話\n\n這是一篇給流行病學家的教學型論文（刊在 Practice of Epidemiology 單元）：當你的研究問題需要一個「還沒有現成估計式」的因果參數時，怎麼從統計估計目標（statistical estimand）一步一步推導出一個可以搭配機器學習、又能給出有效信賴區間的估計式。[renson2025, p.1]\n\n出處：American Journal of Epidemiology，2025 年，第 194 卷，頁 3566–3571。[renson2025, p.1]\n\n生活比喻：想做一道新菜，卻找不到現成食譜。這篇論文不教你做某一道菜，而是教你「從想吃的那道菜出發，自己寫出食譜、再檢查這份食譜在食材不夠精準時還能不能做出好味道」的流程。這個比喻是本 wiki 的說明，不是論文的話。\n\n## 研究問題\n\n- 機器學習用來估計干擾函數（nuisance function，例如結局迴歸、傾向分數）越來越常見，因為它可以避開沒有科學根據的模型假設。[renson2025, p.1]\n- 當因果參數與識別假設都是常見的類型（例如在條件可交換性、正值性、一致性下的平均處理效應），這類方法已有完整說明與軟體；但若要估計不常見的因果參數，或識別依賴較少見的假設，可能還沒有現成的估計式。[renson2025, p.1]\n- 論文舉的不常見參數例子：平行趨勢下的時間變動 g 公式（time-varying g-formula）、被遷移的雙重差分（transported difference-in-differences）、被遷移的測量誤差校正。[renson2025, p.1]\n- 關鍵難題：用機器學習時如何取得有效的推論（例如信賴區間）。[renson2025, p.1]\n- 論文目標有兩個：第一，推導以有效影響函數（efficient influence function, EIF）為基礎的估計式；第二，證明這個估計式有「速率倍增穩健」（rate double robustness）性質，能合法地納入機器學習。[renson2025, p.1]\n- 全文貫穿的範例問題：「如果樣本中每個人都沒有接受治療，平均結局會是多少？」[renson2025, p.1]\n\n## 資料與情境\n\n- 這是方法論文，沒有新資料。[renson2025, p.5]\n- 符號：Y 是觀察到的結局，A 是二元治療，W 是一組觀察到的共變數；觀察資料寫成 `O_i = (W_i, A_i, Y_i)`，共 n 個單位，假設獨立且同分布（iid）。[renson2025, p.2]\n- 潛在結局 `Y^a` 表示把治療設為 a 時的結局。[renson2025, p.2]\n- 論文假設非參數統計模型（對觀察資料分布不設任何限制）。[renson2025, p.2]\n- 論文另在附錄示範第二個參數：在受治療者中、不治療時的期望結局。[renson2025, p.2]\n\n## 方法（直覺版）\n\n先講直覺：這條路是「科學問題 → 因果參數 → 統計估計目標 → 估計式 → 檢查估計式能不能配機器學習 → 算標準誤」。論文把它拆成五步。[renson2025, p.1-5]\n\n- 第一步（原文 Step 1）定義統計估計目標：把問題翻成因果參數 `E[Y^0]`，再用條件可交換性、正值性、一致性把它等同於只依賴觀察資料分布的統計估計目標 `ψ = E(E(Y | W, A=0))`。詳見 [[statistical-estimand]]、[[identification-assumptions]]。[renson2025, p.2]\n- 第二步（原文 Step 2）推導 EIF：EIF 是估計目標對資料分布的「導數」，用和、乘積的微分規則與已知的條件平均 EIF 拼出「推測的 EIF」。詳見 [[efficient-influence-function]]。[renson2025, p.2-3]\n- 第三步（原文 Step 3）建構估計式：先看直覺的代入式估計式（plug-in），再加上估計 EIF 的樣本平均得到單步估計式（one-step），它等同增強型逆機率加權（AIPW）。詳見 [[plug-in-and-one-step-estimators]]。[renson2025, p.3]\n- 第四步（原文 Step 4）驗證漸近性質：證明估計式有速率倍增穩健性，要求干擾函數在另一份樣本中估計（例如交叉擬合）。詳見 [[rate-double-robustness]]、[[cross-fitting]]、[[nuisance-functions]]。[renson2025, p.3-4]\n- 第五步（原文 Step 5）推導變異數估計式：縮放後的誤差趨近均值為零的常態分布，變異數等於 EIF 的變異數，因此以估計的 EIF 之樣本變異數除以 n 作為估計。[renson2025, p.4-5]\n\n## 主要結果\n\n這篇論文沒有實證結果（沒有新資料）。[renson2025, p.5] 以下是論文給出的推導結論，不是資料中的發現。\n\n- 代入式估計式（等同 g 計算法）在干擾函數以機器學習估計時，一般無法得到正確推論。[renson2025, p.3]\n- 單步估計式就是 AIPW 估計式；實作時用迴歸（可用機器學習）估計治療與結局對共變數的關係，再取樣本平均。[renson2025, p.3]\n- 代入式估計式的誤差可拆成「一階誤差」與「餘項」；單步估計式設計上去除一階誤差的一部分，餘項則要靠速率倍增穩健性處理。[renson2025, p.4]\n- 餘項等於兩個干擾函數誤差的乘積（再乘 `1/ĝ`），所以若兩者都以 `n^(1/4)` 的速率收斂，估計式的速率是 `(n^(1/4))^2 = √n`。[renson2025, p.4]\n- 單步估計式縮放後的誤差趨近 `N(0, E[φ(O,P)^2])`，變異數等於 EIF 的變異數。[renson2025, p.5]\n- 論文也說明：同樣的推導思路可用在估計方程式法、目標最大概似／最小損失估計（TMLE）、雙重／去偏機器學習（double/debiased machine learning）等其他 EIF 型估計式。[renson2025, p.5]\n\n## 限制\n\n- 第二步的方法只是「推測」某函數是 EIF，並沒有證明；若要證明效率，需要額外的證明。[renson2025, p.3]\n- 有些估計目標沒有 EIF，例如連續治療的劑量反應曲線；分位數效果這類不只涉及條件平均與條件機率的估計目標，這個方法也可能不夠。[renson2025, p.3]\n- EIF 只有在估計目標「路徑可微分」（pathwise differentiable）時才存在，例如連續 W 下的條件平均處理效應就違反這點。[renson2025, p.3]\n- 速率倍增穩健性允許許多、但不是所有機器學習演算法；演算法的收斂速率取決於調整參數與資料特性，`n^(1/4)` 常見合理但不保證。[renson2025, p.5]\n- 變異數估計式要求兩個干擾函數都被一致地估計。[renson2025, p.5]\n- 論文強調嚴謹的證明仍需要與統計學家合作。[renson2025, p.5]\n- 論文只討論二元治療與單一時間點的資料結構；動態治療規則、最佳規則（ODTR）的學習：來源未提及。[renson2025, p.2]\n- 不同估計式的模擬比較或實證表現：來源未提及。\n- 附錄的完整推導：本 wiki 只有論文正文的文字，附錄內容來源未提及。\n\n## 和其他頁的關係\n\n- 核心概念頁：[[statistical-estimand]]、[[nuisance-functions]]、[[efficient-influence-function]]、[[plug-in-and-one-step-estimators]]、[[rate-double-robustness]]、[[cross-fitting]]。\n- 延伸的既有概念頁：[[doubly-robust-learner]]、[[identification-assumptions]]。\n- 與 [[williams2024]] 的對照（AIPW、交叉擬合、「倍增穩健」的兩種意思）：見 [[method-comparison]]。\n- 與 [[bluemlein2022]] 的對照：bluemlein2022 也宣稱倍增穩健，但談的是無偏性層面，沒有討論收斂速率；見 [[method-comparison]]、[[rate-double-robustness]]。\n- 與 [[hong2021]] 的關係：hong2021 是臨床應用，沒有推導估計式；它是否使用交叉擬合、有效影響函數或速率倍增穩健：來源未提及。整理在 [[method-comparison]]。\n- 名詞速查見 [[glossary]]。\n- 與 [[desman2025]] 的關係：desman2025 是臨床應用，沒有推導估計式；它是否使用交叉擬合、有效影響函數或速率倍增穩健：來源未提及。整理在 [[method-comparison]]。\n"}, "williams2024": {"title": "Williams 等人：從縱貫資料學習最佳動態治療規則", "type": "source", "sources": "[williams2024]", "group": "sources", "md": "\n# Williams 等人：從縱貫資料學習最佳動態治療規則\n\n## 一句話\n\n這是一篇教學型論文（tutorial）：教應用研究者怎麼從追蹤多個時間點的資料（縱貫資料，longitudinal data）裡，學出「每個決策時間點、對什麼樣的人、該不該給治療」的規則，並用鴉片類藥物使用障礙（opioid use disorder, OUD）病人的藥物劑量當範例。[williams2024, p.1]\n\n生活比喻：與其規定「全班每天都寫同樣份量的作業」，不如讓老師每週看學生當週狀況，再決定要不要加量。這個比喻是本 wiki 的說明，不是論文的話。\n\n## 研究問題\n\n- 研究者常報告平均處理效應（average treatment effect, ATE），但它只描述平均，沒有告訴我們治療對某一個人的效果。[williams2024, p.1]\n- 治療常常不只發生在單一時間點，而是一連串決定與調整；所以要學的不只是「不同人受益不同」，還有「同一個人在情況變化時受益也不同」。[williams2024, p.1]\n- 論文目標：為應用研究者提供從縱貫觀察性資料與臨床試驗資料估計最佳動態治療規則（optimal dynamic treatment rule, ODTR）的教學。[williams2024, p.1]\n- 範例問題：在治療的前 6 週，何時該提高 BUP-NX（buprenorphine-naloxone，丁基原啡因加納洛酮）劑量，才能讓「回到規律鴉片使用」（return to regular opioid use, RROU）的風險最小。[williams2024, p.4]\n- 論文指出，過去時間變動 ODTR 的工作多集中在理論與估計策略，缺少給應用者的教學與軟體，這可能是它在流行病學尚未普及的部分原因。[williams2024, p.1]\n\n## 資料與情境\n\n- 資料取自美國國家藥物濫用研究所臨床試驗網絡（National Institute on Drug Abuse Clinical Trials Network）三個整合（harmonized）比較有效性試驗的 BUP-NX 組，共 n = 2199 位病人，期間 2006-2017。[williams2024, p.5]\n- 三個試驗：CTN0027 為 2006-2010、n 為 1269、追蹤 24 週、另一組為美沙酮（methadone）；CTN0030 phase II 為 2006-2009、n 為 360、追蹤 12 週、另一組為 BUP-NX 加藥物諮商；CTN0051 為 2014-2017、n 為 570、追蹤 24 週、另一組為長效注射型納曲酮（XR-NTX）。[williams2024, p.5]\n- 在三個試驗中，BUP-NX 由病人自行服用，劑量與調整依臨床判斷開立。[williams2024, p.5]\n- 結局 RROU 的定義：連續 7 天非研究用鴉片使用的最後一天，或「連續第四週每週至少一次非研究用鴉片使用」的第一天；非研究用鴉片使用由尿液藥檢與時間線回溯訪談（timeline follow-back）判定。[williams2024, p.5]\n- 漏訪與拒絕尿檢一律視為鴉片使用陽性，論文說這與原始試驗論文一致，並認為在既有研究下是合理假設。[williams2024, p.5]\n- 時間變動的治療：相較前一週，每週最大領取的 BUP-NX 劑量有沒有增加，是 0/1 變數。[williams2024, p.5]\n- 基線干擾因子（confounder）包含種族／族裔、年齡、生理性別、過去鴉片戒斷不適的最高程度、過去一年物質使用障礙、神經損傷史、精神疾病史、靜脈注射藥物史、過去 30 天藥物使用；時間變動干擾因子包含最近開立的 BUP-NX 劑量，以及前一週是否有非研究用鴉片使用。[williams2024, p.5]\n- 比較對象有兩個臨床定義的劑量規則：固定劑量規則（治療 3 週後劑量不再變動，記為 d0）與動態劑量規則 d1（前一週有鴉片使用就增量，來自 Rudolph 等人之前的研究）。[williams2024, p.5]\n\n## 方法（直覺版）\n\n先講直覺：要判斷「該不該加量」，就要估計「加量」與「不加量」兩種世界的結局差多少，差的正負號決定要不要加量。這個差叫做 [[blip-function]]。論文用的估計方式是 [[doubly-robust-learner]]（倍增穩健學習器）。\n\n- 單一時間點：先用迴歸預測結局（Q），再估計「實際拿到那個治療」的機率（g），把兩者合成一個「倍增穩健的偽結局」，最後把它對想用來做決策的變數做迴歸；預測為正就給治療。[williams2024, p.4]\n- 多個時間點：從最後一個時間點往回推。先學最後一步的最佳規則，再假設最後一步已經照最佳規則做，回頭學前一步。[williams2024, p.3]\n- 範例中的機器學習細節：Q 與 g 用交叉擬合（cross-fitting）的離散超級學習器（discrete super learner）估計，候選學習器含 lasso（ℓ1 正規化）、多變量適應性迴歸樣條與梯度提升，取交叉驗證均方誤差最小者；blip 函數用 ℓ1 正規化估計。[williams2024, p.5]\n- 最佳規則下的平均結局 ψ 用「依序倍增穩健」（sequentially doubly robust）估計式估計，風險比（risk ratio, RR）的變異數用 log RR 影響函數（influence function）的樣本變異數估計。[williams2024, p.5]\n- 分析軟體為 R 4.2.1 與 lmtp 套件；程式碼放在 GitHub。[williams2024, p.5]\n- 論文說明這個方法成立需要的假設，見 [[identification-assumptions]]。[williams2024, p.3-4]\n\n## 主要結果\n\n- 若治療前 6 週都不再提高劑量（固定劑量規則），估計的第 6 週 RROU 風險為 0.388（95% CI, 0.358-0.419）。[williams2024, p.6]\n- 學出的 ODTR 之估計風險為 0.324（95% CI, 0.261-0.38）。[williams2024, p.6]\n- 動態劑量規則 d1 的估計風險為 0.348（95% CI, 0.327-0.369）。[williams2024, p.6]\n- 學出的 ODTR 比固定劑量降低 RROU 風險 16.6%（RR = 0.83; 95% CI, 0.68-1.02）。[williams2024, p.6]\n- 規則 d1 比固定劑量降低 10.5%（RR = 0.90; 95% CI, 0.84-0.96）。[williams2024, p.6]\n- 學出的 ODTR 與 d1 相比，估計降低 6.8%，但論文說這個差異不具意義（RR = 0.93; 95% CI, 0.77-1.13）。[williams2024, p.6]\n- 規則長相：d1 之下，早期很多人會被加量、後期愈來愈少，因為 BUP-NX 治療持續下去，使用鴉片的可能性會下降；Table 3 中 d1 在第 2 至 5 週的增量人數為 147、59、40、24。[williams2024, p.6]\n- 未做交叉擬合所學出的 ODTR 會讓所有病人每週都加量，只有第 3 週例外；論文討論處則寫成在第 2、4、5 週加量，且與病人病史無關。[williams2024, p.6]\n- 檢查 blip 模型發現，所有用來做決策的變數都沒有被選進去，模型退化成只有截距，因此某一週的最佳規則就只看偽結局的正負號。[williams2024, p.6]\n- 論文的解讀：學出的規則可降低第 6 週 RROU 風險（相較固定劑量），並與預先指定的動態規則表現相近。[williams2024, p.6]\n- 論文認為這個結果不令人意外，理由是劑量不足（underdosing）常見、又是治療結果不佳的重要因素，且只看治療前 6 週，這段期間證據建議要規律加量到最低門檻（例如 16 mg）。[williams2024, p.6]\n\n## 限制\n\n- 論文的模擬研究規模有限，只用來確認估計式實作正確，作者明說不能代表估計式的一般表現。[williams2024, p.4]\n- d1 是預先指定、只看前一週鴉片使用、不一定最佳；ODTR 則是學出來、使用所有基線與時間變動共變數。[williams2024, p.5]\n- 範例只用了相對簡單的模型；論文指出任何機器學習迴歸都可使用。[williams2024, p.6]\n- 論文說不同 ODTR 演算法在漸近上都一致，但有限樣本表現可能不同，所以某一個演算法在某次分析中可能表現較好；最佳策略也可能其實是簡單的靜態規則。[williams2024, p.6]\n- 論文只討論二元治療與單一結局，並說明方法可延伸到類別型暴露、資源受限情境、資訊性設限與存活結局。[williams2024, p.6-7]\n- 範例資料中前述假設是否成立的檢驗：來源未提及。\n- 外部資料驗證學出的規則：來源未提及。\n\n## 和其他頁的關係\n\n- 核心概念頁：[[dynamic-treatment-regime]]、[[decision-points-and-history]]、[[optimal-dynamic-treatment-rule]]、[[treatment-effect-heterogeneity]]、[[blip-function]]、[[doubly-robust-learner]]、[[identification-assumptions]]。\n- 和 [[hong2021]] 的關係：兩篇都估計「依病況調整的時間變動治療」的規則，並都以 [[blip-function]] 的想法為核心；差別在 hong2021 的治療是連續劑量、資料來自單一加護病房資料庫，整理在 [[dtr-clinical-applications]] 與 [[method-comparison]]。\n- 名詞速查見 [[glossary]]。\n- 和 [[renson2025]] 的關係：兩篇都用到倍增穩健與交叉擬合，用法的異同整理在 [[method-comparison]]。\n- 和 [[bluemlein2022]] 的關係：兩篇都從最後一個時間點往前估計（見 [[backward-recursion]]），但每一步估計處理效應的工具不同（倍增穩健轉換再迴歸，對照因果樹與因果森林，見 [[causal-tree-and-forest]]）；整理在 [[method-comparison]]。\n- 和 [[desman2025]] 的關係：desman2025 也學時間變動的個人化劑量規則，但用強化學習而不是 blip 函數；本 wiki 的對照：它的離線策略評估與本篇估計規則價值回答類似的問題，整理在 [[off-policy-evaluation]] 與 [[method-comparison]]。\n"}, "dtr-clinical-applications": {"title": "DTR 的臨床應用：三個情境並排", "type": "synthesis", "sources": "[williams2024, bluemlein2022, hong2021, desman2025]", "group": "syntheses", "md": "\n# DTR 的臨床應用：三個情境並排\n\n這一頁把三篇來源的臨床情境放在一起，回答三個問題：動態治療策略實際用在哪裡、用什麼資料、怎麼知道學出來的規則好不好。內容只整理各來源已寫的事；本頁的整理與比喻不是論文的話，也不評斷誰對。\n\n## 直覺（生活比喻）\n\n三位教練各自帶不同的隊伍。第一位每週決定「這週要不要加重訓練量」；第二位在每個訓練時段決定「要不要上某一項特別訓練」；第三位先把隊員分成幾種體質類型，再去調一個可以連續調整的旋鈕，例如跑步機的速度。三位都在做「看狀況、每次重新決定」，差別在決定的東西長什麼樣、怎麼檢查自己的決定是否有道理。這個比喻是本 wiki 的說明，不是論文的話。\n\n## 三個情境並排\n\n| 面向 | williams2024 | bluemlein2022 | hong2021 |\n|---|---|---|---|\n| 臨床問題 | 鴉片使用障礙病人，何時該提高 BUP-NX 劑量。[williams2024, p.4] | 加護病房依序決定要不要用機械通氣或血管加壓素。[bluemlein2022, p.14] | 急性呼吸衰竭的機械通氣病人，每個時間點的機械功率該多高。[hong2021, p.1] |\n| 治療的型態 | 二元：這週的劑量有沒有比上週高。[williams2024, p.5] | 二元：治療或不治療。[bluemlein2022, p.4] | 連續劑量：機械功率，見 [[mechanical-power]]。[hong2021, p.3] |\n| 結局 | 回到規律鴉片使用（RROU）的風險。[williams2024, p.4] | 加護病房停留時間越短代表越健康，作為代理指標。[bluemlein2022, p.15] | 死亡（存活）。[hong2021, p.3] |\n| 資料 | 三個比較有效性試驗的 BUP-NX 組，共 n = 2199 位。[williams2024, p.5] | 模擬資料與 MIMIC-III，納入 8,059 位病人。[bluemlein2022, p.15] | MIMIC-IV，8768 位病人。[hong2021, p.3] |\n| 決策時間點 | 治療前 6 週的每週。[williams2024, p.4] | 前 10 小時的病史，模型用三個時間步。[bluemlein2022, p.15] | 前 48 小時、每 8 小時，共 7 個時間點。[hong2021, p.2] |\n| 規則怎麼學 | 倍增穩健的轉換再迴歸，見 [[doubly-robust-learner]]。[williams2024, p.3] | 倒推遞迴加因果樹或因果森林，見 [[backward-recursion]]。[bluemlein2022, p.6-8] | dWOLS 估計含劑量一次項與二次項的結局模型，見 [[q-learning-dwols-g-estimation]]。[hong2021, p.3] |\n| 怎麼判斷規則好不好 | 估計的規則價值與風險比。[williams2024, p.6] | 模擬資料看後悔值與決策準確度，真實資料看期望增益，見 [[regret-and-decision-accuracy]]。[bluemlein2022, p.13] [bluemlein2022, p.16] | 實際 MP 與最佳 MP 的差（ΔMP）和死亡的關聯。[hong2021, p.3] [hong2021, p.4] |\n\n## 三個值得記住的差異\n\n- 治療可以是開關，也可以是連續的劑量。bluemlein2022 只處理二元治療，連續劑量：來源未提及；hong2021 的劑量是機械功率，它由多個呼吸器參數組合算出，要調哪個參數才能改變它：來源未提及。[bluemlein2022, p.4] [hong2021, p.1]\n- 「分組」可以先做，也可以在學規則的過程中做。hong2021 先用有限混合模型把病人分類，再讓類別進入結局模型，見 [[finite-mixture-subphenotypes]]；bluemlein2022 的因果樹在學規則時就依處理效應分群，見 [[causal-tree-and-forest]]。[hong2021, p.2] [bluemlein2022, p.8]\n- 三篇的「驗證」都不是隨機試驗的結果。williams2024 的範例用觀察到的試驗資料估計規則價值；bluemlein2022 的真實資料沒有真值、也沒有與其他基準比較；hong2021 用的是偏離最佳值與死亡的關聯，並說還需要前瞻性試驗。外部資料驗證，三篇都：來源未提及。[williams2024, p.6] [bluemlein2022, p.16] [hong2021, p.8]\n\n## 給簡報的措辭建議（本 wiki 的整理）\n\n- 說「估計的最佳劑量」「與較高死亡風險有關」，不說「證明降低機械功率能降低死亡」。hong2021 自己的結論也是「可行」與「可能有助於」，並要求前瞻性試驗。[hong2021, p.1] [hong2021, p.8]\n- 說明一個規則時，先講它輸出的是什麼（開關或劑量），再講它依據哪些資訊，最後講怎麼檢查。\n- hong2021 的圖與部分係數只在原圖中，本 wiki 沒有；簡報若要畫圖，不能憑空補數字。[hong2021, p.5]\n\n## 加入 desman2025 之後\n\n[[desman2025]] 是第四個臨床情境：心臟手術後第一天的胰島素劑量，用的是強化學習，而不是本頁前三篇的迴歸式或樹式方法。本節只整理它的情境，不評斷誰對。[desman2025, p.1] [desman2025, p.9]\n\n| 面向 | desman2025 |\n|---|---|\n| 臨床問題 | 心臟手術後第一天，每小時要給多少常規胰島素。[desman2025, p.1] |\n| 治療的型態 | 連續劑量：每小時的胰島素量，四捨五入到整數，上限為每小時 10 單位。[desman2025, p.9] |\n| 結局 | 血糖落在 70 至 180 mg/dL 的「適當控制」；訓練時用依血糖範圍計分的獎勵。[desman2025, p.8] [desman2025, p.9] |\n| 資料 | 開發用 MIMIC-IV 的 6,148 位，外部驗證用 eICU-CRD 的 649 位。[desman2025, p.2] |\n| 決策時間點 | 每小時，只用前 24 小時。[desman2025, p.8] |\n| 規則怎麼學 | 保守 Q 學習加隱含分位數網路，見 [[offline-reinforcement-learning]]、[[distributional-reinforcement-learning]]。[desman2025, p.9] |\n| 怎麼判斷規則好不好 | 離線策略評估的估計報酬對照醫師、血糖在範圍內的時間比例與劑量差距、與內分泌科醫師建議的平均絕對誤差、盲評的 Likert 量表；見 [[off-policy-evaluation]]。[desman2025, p.2] [desman2025, p.5] [desman2025, p.6] |\n\n### 加入第四篇後的觀察\n\n- 外部資料驗證：本頁前面說前三篇都來源未提及；desman2025 是例外，它用 eICU-CRD 做外部驗證，另比較被排除病人的建議分布。[desman2025, p.2] [desman2025, p.6]\n- 人類專家評估：desman2025 請內分泌科醫師、加護醫師與專科護理師給建議，並由另外兩位資深加護醫師盲評；本 wiki 的前三篇來源頁沒有記載這類評估。[desman2025, p.3] [desman2025, p.5] [desman2025, p.6]\n- 與 hong2021 最接近：兩者都是加護病房資料、連續劑量、時間變動的規則，也都看「實際用量離建議多遠」與結果的關係；hong2021 看 ΔMP 與死亡，desman2025 看劑量差距與血糖在範圍內的時間比例。[hong2021, p.4] [desman2025, p.2]\n- 「驗證」仍不是隨機試驗的結果：論文自己說這是回溯性研究，需要前瞻性研究與臨床試驗。[desman2025, p.7]\n- 措辭建議（本 wiki 的整理）：說「離線估計的報酬較高」「與內分泌科醫師的建議較接近」，不說「證明減少低血糖」。論文結論有「在真實世界展現有效性」這類字眼，但資料是回溯性的，本 wiki 不把它升級為臨床效果。[desman2025, p.8]\n\n## 相關頁面\n\n- [[method-comparison]]\n- [[dynamic-treatment-regime]]\n- [[optimal-dynamic-treatment-rule]]\n- [[treatment-effect-heterogeneity]]\n- 來源頁：[[williams2024]]、[[bluemlein2022]]、[[hong2021]]、[[desman2025]]\n- 名詞速查：[[glossary]]\n"}, "method-comparison": {"title": "方法比較：估計式家族與「倍增穩健」的兩種意思", "type": "synthesis", "sources": "[renson2025, williams2024, bluemlein2022, hong2021, desman2025]", "group": "syntheses", "md": "\n# 方法比較：估計式家族與「倍增穩健」的兩種意思\n\n這一頁把 [[renson2025]] 與 [[williams2024]] 對同一批工具的說法放在一起。重點是：兩篇的目標不同，所以同一個名字（AIPW、倍增穩健）出現時，要先問「它在估計什麼」。本頁只整理兩篇各自說了什麼，不評斷誰對。加入 [[bluemlein2022]] 之後（見文末「加入 bluemlein2022 之後」一節），仍沒有發現互相矛盾的陳述：各篇談的是不同性質或不同條件，所以沒有建立 disagreements 頁。\n\n## 兩篇的目標不同\n\n- renson2025：教學如何為一個估計目標推導出能搭配機器學習、又有有效推論的估計式；範例估計目標是不治療時的平均結局。[renson2025, p.2]\n- williams2024：教學如何從縱貫資料學出最佳動態治療規則；方法的核心是估計 blip 函數，並用依序倍增穩健估計式估計最佳規則下的平均結局。[williams2024, p.5]\n- 動態治療規則的學習，renson2025 沒有討論：來源未提及。[renson2025, p.2]\n\n## 估計式對照\n\n| 工具 | renson2025 怎麼說 | williams2024 怎麼說 |\n|---|---|---|\n| g 計算法／代入式 | 範例的代入式估計式對應 g 計算法；用機器學習估計干擾函數時一般無法正確推論。[renson2025, p.3] | 本 wiki 的 williams2024 頁未記載。 |\n| 逆機率加權（IPW） | 與 g 計算法同屬非速率倍增穩健的例子。[renson2025, p.3] | 本 wiki 的 williams2024 頁未記載。 |\n| 增強型逆機率加權（AIPW） | 單步估計式就是 AIPW，用來估計不治療時的平均結局。[renson2025, p.3] | AIPW 轉換是 blip 函數的無偏轉換，估計 blip 而非平均結局。[williams2024, p.3] |\n| 目標最大概似估計（TMLE）、雙重／去偏機器學習 | 提到這兩類 EIF 型估計式，單步估計式是雙重／去偏機器學習的特例。[renson2025, p.5] | 本 wiki 的 williams2024 頁未記載。 |\n| 交叉擬合／樣本分割 | 干擾函數須在另一份樣本估計，簡單版是分成兩半再交換。[renson2025, p.4] | 範例中 Q 與 g 用交叉擬合估計；樣本分割可繞過「夠平滑」的條件。[williams2024, p.5] |\n| 超級學習器 | 來源未提及。 | 範例用離散超級學習器估計 Q 與 g。[williams2024, p.5] |\n| 變異數估計 | 以估計 EIF 的樣本變異數除以 n。[renson2025, p.5] | 以 log RR 影響函數的樣本變異數估計風險比的變異數。[williams2024, p.5] |\n\n## 「倍增穩健」的兩種意思\n\n- williams2024 的說法：Q 或 g 只要有一個被一致估計，就能得到 blip 函數的無偏估計。條件：兩個函數至少一個一致。[williams2024, p.3]\n- renson2025 區分兩個性質。倍增穩健一致性：兩個干擾估計式中有一個設定正確，估計式就一致。速率倍增穩健：估計式誤差是兩個干擾估計式誤差的乘積，用來保證有效推論。[renson2025, p.4]\n- renson2025 的變異數估計式要求兩個干擾函數都被一致估計。條件：兩者都一致。[renson2025, p.5]\n- 本 wiki 的判讀：williams2024 的「倍增穩健」描述的是第一種性質，renson2025 把它與第二種性質分開；兩者談的是不同性質，並不互相否定。williams2024 是否討論速率倍增穩健：來源未提及。\n- 詳見 [[doubly-robust-learner]]、[[rate-double-robustness]]。\n\n## 加入 bluemlein2022 之後\n\n[[bluemlein2022]] 的目標是提出新方法：用因果樹與因果森林學最佳 DTR。它和前兩篇的重疊在「多個時間點」與「倍增穩健」。本節只整理三篇各自說了什麼。[bluemlein2022, p.1]\n\n| 面向 | williams2024 | renson2025 | bluemlein2022 |\n|---|---|---|---|\n| 目標 | 教學如何從縱貫資料學最佳規則。[williams2024, p.1] | 教學如何推導搭配機器學習的估計式。[renson2025, p.1] | 提出 DTR-CT 與 DTR-CF 兩個新方法。[bluemlein2022, p.1] |\n| 多個時間點 | 從最後一個時間點往回做。[williams2024, p.5] | 只討論單一時間點。[renson2025, p.2] | 倒推遞迴與偽結局，見 [[backward-recursion]]。[bluemlein2022, p.7] |\n| 估計 blip／HTE 的工具 | 倍增穩健的 AIPW 轉換，再迴歸。[williams2024, p.3] | 估計目標不是 blip。[renson2025, p.3] | 逆傾向分數加權後，用因果樹或因果森林。[bluemlein2022, p.7] |\n| 傾向分數與結局模型 | 範例用交叉擬合的超級學習器。[williams2024, p.5] | 兩者是干擾函數，可用機器學習估計。[renson2025, p.3] | 傾向分數用邏輯斯迴歸，結局模型由樹或森林擔任。[bluemlein2022, p.7] |\n| 樣本分割 | 範例用交叉擬合。[williams2024, p.5] | 干擾函數須在另一份樣本估計。[renson2025, p.4] | 誠實分割：訓練集與估計集。[bluemlein2022, p.8] |\n| 可解釋性 | 提到決策樹可得到好解讀的規則。[williams2024, p.4] | 來源未提及。 | 核心賣點，見 [[interpretability]]。[bluemlein2022, p.2] |\n| 實證 | 鴉片使用障礙病人的劑量資料。[williams2024, p.5] | 沒有新資料。[renson2025, p.5] | 模擬資料與 MIMIC-III 加護病房資料。[bluemlein2022, p.1] |\n| 評估學出的規則 | 規則價值的估計與風險比。[williams2024, p.6] | 沒有。[renson2025, p.5] | 後悔值、決策準確度、期望增益，見 [[regret-and-decision-accuracy]]。[bluemlein2022, p.13] |\n| Q 學習 | 只列名為迴歸式方法的一類。[williams2024, p.3] | 來源未提及。 | 線性基準方法，見 [[q-learning-dwols-g-estimation]]。[bluemlein2022, p.12] |\n\n### 「倍增穩健」的第三種說法\n\n- bluemlein2022 的說法：類比 DWOLS，用逆傾向分數加權結局；每個時間步只要傾向分數模型或處理效應模型有一個設定正確且無偏，就得到無偏的處理效應估計。條件：兩個模型至少一個設定正確。[bluemlein2022, p.10]\n- 它的論證方式：因果樹與因果森林是 HTE 的無偏估計式，最大概似是邏輯斯迴歸參數的無偏估計式，所以方法也是倍增穩健。[bluemlein2022, p.10]\n- 與 williams2024 的對照：兩者的條件都是「兩個函數至少一個正確」，但 williams2024 用 AIPW 轉換，bluemlein2022 用逆傾向分數加權。[williams2024, p.3] [bluemlein2022, p.7]\n- 與 renson2025 的對照：renson2025 把「倍增穩健一致性」與「速率倍增穩健」分開，並說逆機率加權（IPW）不是速率倍增穩健的例子。[renson2025, p.3] [renson2025, p.4]\n- bluemlein2022 是否討論收斂速率或信賴區間：來源未提及。\n- 本 wiki 的判讀：bluemlein2022 的「倍增穩健」屬於第一種性質（一致性或無偏性），沒有主張第二種性質（速率）；所以三篇沒有互相否定。但 bluemlein2022 的論證是以無偏性類推，正文沒有看到速率層面的說明，日後引用時要說清楚是哪一種。\n\n### 其他並排觀察\n\n- 估計 HTE 的做法：williams2024 以迴歸（例如 ℓ1 正規化）估計 blip，bluemlein2022 以樹或森林估計；兩者都屬資料自適應的方法，但可解釋性的程度不同，見 [[interpretability]]。[williams2024, p.5] [bluemlein2022, p.10]\n- 古典 Q 學習的假設：低維、線性、已知的函數形式；williams2024 與 renson2025 的方法則強調可以搭配彈性的機器學習。[bluemlein2022, p.22] [williams2024, p.4] [renson2025, p.1]\n\n## 加入 hong2021 之後\n\n[[hong2021]] 是臨床應用研究，不是方法論文：它用既有的 dWOLS 估計連續劑量的最佳規則，前面多了一步無監督分類。本節只整理四篇各自說了什麼；臨床情境的並排見 [[dtr-clinical-applications]]。[hong2021, p.1] [hong2021, p.3]\n\n| 面向 | williams2024 | bluemlein2022 | hong2021 |\n|---|---|---|---|\n| 目標 | 教學如何從縱貫資料學最佳規則。[williams2024, p.1] | 提出 DTR-CT 與 DTR-CF 兩個新方法。[bluemlein2022, p.1] | 臨床應用：把個人化通氣策略形式化。[hong2021, p.1] |\n| 治療的型態 | 二元：每週劑量有沒有增加。[williams2024, p.5] | 二元：治療或不治療。[bluemlein2022, p.4] | 連續劑量（機械功率），見 [[mechanical-power]]。[hong2021, p.3] |\n| 估計 blip 的工具 | 倍增穩健的 AIPW 轉換，再迴歸。[williams2024, p.3] | 因果樹或因果森林。[bluemlein2022, p.7] | dWOLS，參數式的 blip，含劑量的一次項與二次項。[hong2021, p.3] |\n| 先分亞型？ | 本 wiki 的 williams2024 頁未記載。 | 樹的葉子是依處理效應分出的群。[bluemlein2022, p.8] | 先以有限混合模型分成三類，再放進模型，見 [[finite-mixture-subphenotypes]]。[hong2021, p.2] [hong2021, p.3] |\n| 資料 | 試驗的 BUP-NX 組。[williams2024, p.5] | 模擬資料與 MIMIC-III。[bluemlein2022, p.1] | MIMIC-IV 單一資料庫。[hong2021, p.2] |\n| 時間點 | 每週。[williams2024, p.2] | 模擬 3 個時間步，真實資料前 10 小時。[bluemlein2022, p.11] [bluemlein2022, p.15] | 每 8 小時，共 7 個時間點。[hong2021, p.2] |\n| 評估學出的規則 | 規則價值的估計與風險比。[williams2024, p.6] | 後悔值、決策準確度、期望增益。[bluemlein2022, p.13] | ΔMP 與死亡的關聯。[hong2021, p.4] |\n| 倍增穩健 | 主張，條件是 Q 或 g 至少一個一致。[williams2024, p.3] | 主張，條件是兩個模型至少一個設定正確。[bluemlein2022, p.10] | 正文沒有主張；引用文獻的標題含倍增穩健。[hong2021, p.3] [hong2021, p.9] |\n\n### 並排觀察\n\n- 「驗證」的意思不同：williams2024 估計規則價值，bluemlein2022 在真實資料看期望增益，hong2021 看實際用量偏離最佳用量與死亡的關聯。三者回答的是不同問題，彼此沒有矛盾。[williams2024, p.6] [bluemlein2022, p.16] [hong2021, p.4]\n- 函數形式：bluemlein2022 說古典線性方法假設函數形式已知而受限；hong2021 用 dWOLS 並由作者指定交互作用項與二次項，沒有與其他方法比較。兩篇的目的不同（比較方法表現，對臨床應用），所以不是互相否定。[bluemlein2022, p.22] [hong2021, p.3]\n- 結論的措辭：hong2021 的結論是最佳 MP 可能有助於改善存活，需要前瞻性試驗檢驗；本 wiki 把它的估計當成關聯，不當成因果。[hong2021, p.1] [hong2021, p.8]\n- 加入 hong2021 之後仍沒有發現互相矛盾的陳述，所以沒有新增 disagreements 條目。\n\n## 加入 desman2025 之後\n\n[[desman2025]] 是臨床應用研究，但用的是強化學習這條路線：保守 Q 學習加分布式的部分，不是前四篇的迴歸式、樹式或估計式推導。本節只整理它與其他篇各自說了什麼；整體導覽見 [[overview-for-beginners]]。[desman2025, p.1] [desman2025, p.9]\n\n| 面向 | desman2025 | 對照的來源怎麼說 |\n|---|---|---|\n| 目標 | 建一個建議每小時胰島素劑量的演算法。[desman2025, p.1] | hong2021：把個人化通氣策略形式化。[hong2021, p.1] |\n| 治療的型態 | 連續劑量，每小時的胰島素量。[desman2025, p.9] | hong2021：連續劑量（機械功率）；bluemlein2022：二元。[hong2021, p.3] [bluemlein2022, p.4] |\n| 時間點 | 每小時，只用前 24 小時。[desman2025, p.8] | hong2021：每 8 小時，共 7 個時間點；bluemlein2022：真實資料前 10 小時。[hong2021, p.2] [bluemlein2022, p.15] |\n| 估計規則的工具 | 保守 Q 學習加隱含分位數網路，三層隱藏層的神經網路。[desman2025, p.9] | hong2021：dWOLS；bluemlein2022：因果樹或因果森林。[hong2021, p.3] [bluemlein2022, p.7] |\n| 時間結構的處理 | 馬可夫決策過程加折扣因子，見 [[reinforcement-learning-mdp]]；倒推遞迴：來源未提及。[desman2025, p.9] | bluemlein2022：倒推遞迴與偽結局，見 [[backward-recursion]]。[bluemlein2022, p.7] |\n| 評估學出的規則 | 離線策略評估、血糖在範圍內的時間比例、與內分泌科醫師的平均絕對誤差、盲評；見 [[off-policy-evaluation]]。[desman2025, p.2] [desman2025, p.5] [desman2025, p.6] | hong2021：ΔMP 與死亡的關聯；bluemlein2022：後悔值、決策準確度、期望增益。[hong2021, p.4] [bluemlein2022, p.13] |\n| 外部資料驗證 | eICU-CRD。[desman2025, p.2] | 前三篇：來源未提及，見 [[dtr-clinical-applications]]。 |\n| 倍增穩健、有效影響函數 | 來源未提及。 | williams2024、bluemlein2022 主張倍增穩健；renson2025 推導相關估計式。[williams2024, p.3] [bluemlein2022, p.10] [renson2025, p.1] |\n\n### 並排觀察\n\n- 「Q 學習」同名但不同脈絡：desman2025 的保守 Q 學習屬於離線強化學習；bluemlein2022 的 Q 學習是來自統計學的線性迴歸式方法。論文沒有說明兩者的關係：來源未提及。見 [[q-learning-dwols-g-estimation]]。[desman2025, p.8] [bluemlein2022, p.22]\n- 「驗證」的意思不同：desman2025 是離線估計的報酬加專家評估，hong2021 是偏離最佳用量與死亡的關聯，williams2024 是規則價值的估計。三者回答不同的問題，彼此沒有矛盾。[desman2025, p.2] [hong2021, p.4] [williams2024, p.6]\n- 可解釋性：bluemlein2022 說強化學習多為深度學習、不易解釋；desman2025 用的是神經網路加事後的 SHAP 說明，兩者談的是不同層次（路線的一般特徵、對一個模型的事後說明），不是互相否定。見 [[interpretability]]。[bluemlein2022, p.2] [desman2025, p.10]\n- 加入 desman2025 之後仍沒有發現互相矛盾的陳述，所以沒有新增 disagreements 條目。\n\n## 相關頁面\n\n- [[plug-in-and-one-step-estimators]]\n- [[cross-fitting]]\n- [[nuisance-functions]]\n- [[efficient-influence-function]]\n- [[backward-recursion]]\n- [[causal-tree-and-forest]]\n- [[interpretability]]\n- [[regret-and-decision-accuracy]]\n- [[q-learning-dwols-g-estimation]]\n- [[mechanical-power]]\n- [[finite-mixture-subphenotypes]]\n- [[dtr-clinical-applications]]\n- [[reinforcement-learning-mdp]]\n- [[offline-reinforcement-learning]]\n- [[distributional-reinforcement-learning]]\n- [[off-policy-evaluation]]\n- [[overview-for-beginners]]\n\n- [[glossary]]\n"}, "overview-for-beginners": {"title": "如果你只讀一頁：動態治療策略導覽", "type": "synthesis", "sources": "[williams2024, renson2025, bluemlein2022, hong2021, desman2025]", "group": "syntheses", "md": "\n# 如果你只讀一頁：動態治療策略導覽\n\n這一頁把五篇來源與主要概念，依「先懂問題、再懂規則、再懂怎麼學、最後懂怎麼檢查」的順序串起來，每一步連到概念頁。內容只整理來源已寫的事；生活比喻與整理語句是本 wiki 的說明，不是論文的話，也不評斷誰對。\n\n## 直覺（生活比喻）\n\n把動態治療策略想成一個好的導航軟體：它不會一次規劃到底，而是每個路口都看「到目前為止走過的路與現在的路況」，再重新決定直走還是轉彎。學習這個導航，就是從很多人過去的行車紀錄，學出「在什麼路況該怎麼轉」。最後還要有辦法檢查：這個新導航真的比大家原本的走法好嗎？（比喻為本 wiki 的說明，不是論文的話。）\n\n## 五篇來源一覽\n\n| 來源 | 一句話 | 在這份導覽中的角色 |\n|---|---|---|\n| [[williams2024]] | 教學型論文：教應用研究者從追蹤多個時間點的資料，學出「每個決策時間點、對什麼樣的人、該不該給治療」的規則，範例是 BUP-NX 劑量。[williams2024, p.1] | 主幹：問題與基本詞彙 |\n| [[renson2025]] | 教學型論文：教怎麼從統計估計目標一步步推導出可搭配機器學習、又有有效信賴區間的估計式。[renson2025, p.1] | 統計工具箱 |\n| [[bluemlein2022]] | 方法論文：提出 DTR-CT 與 DTR-CF 兩個以因果樹與因果森林學最佳 DTR 的新方法。[bluemlein2022, p.1] | 可解釋的學習方法 |\n| [[hong2021]] | 臨床應用：先以有限混合模型分類，再以 DTR 估計個人化的機械功率。[hong2021, p.1] | 連續劑量的加護病房案例 |\n| [[desman2025]] | 臨床應用：用分布式離線強化學習建議心臟手術後每小時的胰島素劑量。[desman2025, p.1] | 強化學習路線的案例 |\n\n## 閱讀順序\n\n### 第一步：為什麼不能只看平均\n\n- 平均處理效應只描述平均，沒有告訴我們治療對某一個人的效果。[williams2024, p.1]\n- 治療常常是一連串的決定，所以要學的不只是「不同人受益不同」，還有「同一個人在情況變化時受益也不同」。[williams2024, p.1]\n- 詳見 [[treatment-effect-heterogeneity]]。\n\n### 第二步：規則是什麼\n\n- 治療規則是一個函數：輸入治療前的變數，輸出要給的治療。靜態規則讓每個人拿到同一個治療；動態規則依個人已量測的病史而定。[williams2024, p.2]\n- 有多個時間點時，每個時間點各有一條規則，每條規則都看到當時為止的病史。[williams2024, p.2]\n- 治療可以是開關，也可以是連續的劑量：bluemlein2022 處理的是治療或不治療，hong2021 的劑量是機械功率，desman2025 的劑量是每小時的胰島素量。[bluemlein2022, p.4] [hong2021, p.3] [desman2025, p.9]\n- 詳見 [[dynamic-treatment-regime]]、[[decision-points-and-history]]。\n\n### 第三步：「最佳」是什麼意思\n\n- 所有可能的動態規則中，讓族群受益最大的那一條稱為最佳動態治療規則；規則的價值，是依這條規則治療時反事實結局的期望值。[williams2024, p.2]\n- 「最佳」是族群平均意義上的最佳；範例中學出的規則與預先指定的動態規則相比，論文說差異不具意義，所以沒有保證一定贏過臨床規則。[williams2024, p.6]\n- 詳見 [[optimal-dynamic-treatment-rule]]。\n\n### 第四步：從觀察資料學需要什麼前提\n\n- 把「接受治療的反事實結局」寫成可由資料估計的量，需要三個假設：一致性、無未測量干擾（可交換性）與正值性。[williams2024, p.3]\n- bluemlein2022 把前提寫成四個，多了一位病人的結局與其他病人的治療指派無關這一項，並把可交換性寫成每個時間步、以病史為條件的版本。[bluemlein2022, p.5]\n- hong2021 與 desman2025 都沒有列出或討論這些假設：來源未提及。\n- 詳見 [[identification-assumptions]]。\n\n### 第五步：怎麼學出規則（三條路）\n\n- 迴歸式與倍增穩健：先估 blip 函數，也就是兩種治療的結局差如何隨變數而變，為正就給治療。倍增穩健的意思是 Q 或 g 只要有一個被一致估計，就能得到無偏的 blip 估計。[williams2024, p.3] 詳見 [[blip-function]]、[[doubly-robust-learner]]。\n- 古典的線性迴歸式方法（Q 學習、DWOLS、G 估計）來自統計學，假設函數形式已知、維度低。[bluemlein2022, p.22] 詳見 [[q-learning-dwols-g-estimation]]。\n- 從最後一個時間點往回推：前面時間點的最佳決定，取決於後面的時間點之後會如何被最佳地決定。[williams2024, p.3] bluemlein2022 把這個倒推遞迴與因果樹、因果森林合在一起。[bluemlein2022, p.6] 詳見 [[backward-recursion]]、[[causal-tree-and-forest]]。\n- 強化學習：代理在環境中採取行動，以最大化累積獎勵來學習決策；離線強化學習只從固定的資料集學；分布式強化學習看結果的整個分布，而不只看期望。[desman2025, p.2] 詳見 [[reinforcement-learning-mdp]]、[[offline-reinforcement-learning]]、[[distributional-reinforcement-learning]]。\n- 先分類再估計：hong2021 先用有限混合模型把病人自動分類，再把類別放進估計規則的模型。[hong2021, p.1] [hong2021, p.3] 詳見 [[finite-mixture-subphenotypes]]。\n\n### 第六步：統計工具箱（可以晚點讀）\n\n- renson2025 教的是：為一個還沒有現成估計式的因果參數，推導出可搭配機器學習、又有有效推論的估計式；它只討論單一時間點，動態規則的學習來源未提及。[renson2025, p.1] [renson2025, p.2]\n- 它的關鍵零件是有效影響函數與速率倍增穩健。[renson2025, p.1]\n- 詳見 [[statistical-estimand]]、[[nuisance-functions]]、[[efficient-influence-function]]、[[plug-in-and-one-step-estimators]]、[[rate-double-robustness]]、[[cross-fitting]]。\n\n### 第七步：怎麼檢查學出來的規則\n\n- 有真值的模擬：看後悔值與決策準確度。[bluemlein2022, p.13] 真實資料沒有真值，改看期望增益。[bluemlein2022, p.16]\n- hong2021 看實際機械功率偏離最佳值，與死亡的關聯。[hong2021, p.3]\n- desman2025 用離線策略評估估計策略的報酬，並請專家比較建議的劑量、盲評安全性與有效性。[desman2025, p.9] [desman2025, p.5] [desman2025, p.6]\n- 詳見 [[regret-and-decision-accuracy]]、[[off-policy-evaluation]]。\n- 規則要不要「看得懂」：bluemlein2022 區分決策邏輯本身透明的可詮釋，與靠替代模型提供洞察的可說明；desman2025 以 SHAP 事後估計各特徵的貢獻。[bluemlein2022, p.2] [desman2025, p.10] 詳見 [[interpretability]]。\n\n### 第八步：臨床案例並排\n\n- 四個臨床情境（鴉片使用障礙的 BUP-NX 劑量、加護病房的開關式處置、機械功率、術後的胰島素劑量）在 [[dtr-clinical-applications]] 並排；方法差異整理在 [[method-comparison]]。名詞見 [[mechanical-power]]、[[glossary]]。[williams2024, p.4] [bluemlein2022, p.14] [hong2021, p.1] [desman2025, p.1]\n\n## 讀結果時要記得的三件事（本 wiki 的整理）\n\n- 「估計的最佳」不是「證明有效」：hong2021 說依 DTR 調整通氣是否改善死亡，還需要前瞻性試驗；desman2025 說回溯性的發現需要前瞻性研究與臨床試驗驗證。[hong2021, p.2] [hong2021, p.8] [desman2025, p.7]\n- 關聯不是因果：hong2021 的結果以風險比與勝算比這類關聯估計呈現；desman2025 的離線估計報酬是對自己建議的估計，不是觀察到的病人結局。[hong2021, p.4] [desman2025, p.2]\n- 看有沒有外部資料：hong2021 的外部資料驗證來源未提及；desman2025 另用 eICU-CRD 做外部驗證。[desman2025, p.2]\n\n## 相關頁面\n\n- [[method-comparison]]\n- [[dtr-clinical-applications]]\n- [[glossary]]\n- 來源頁：[[williams2024]]、[[renson2025]]、[[bluemlein2022]]、[[hong2021]]、[[desman2025]]\n"}};
const GROUPS = [["top","總覽"],["syntheses","比較與綜合"],["sources","來源"],["concepts","概念"]];
function linkify(md) {
  return md
    .replace(/\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g, (m, s) => PAGES[s.trim()] ? `[${PAGES[s.trim()].title}](#${s.trim()})` : m)
    .replace(/\[([a-z]+\d{4}),\s*(pp?\.\s*\d+(?:\s*[-–]\s*\d+)?)\]/g, '<span class="cite">$1 $2</span>');
}
function renderList(filter) {
  const box = document.getElementById('list');
  const cur = decodeURIComponent(location.hash.slice(1)) || 'index';
  let html = '';
  for (const [g, label] of GROUPS) {
    const items = Object.entries(PAGES).filter(([k, p]) => p.group === g &&
      (!filter || (k + p.title + p.md).toLowerCase().includes(filter.toLowerCase())));
    if (!items.length) continue;
    html += `<h2>${label}</h2>` + items.map(([k, p]) =>
      `<a href="#${k}" class="${k === cur ? 'on' : ''}">${p.title.replace(/</g, '&lt;')}</a>`).join('');
  }
  box.innerHTML = html;
}
function show() {
  const k = decodeURIComponent(location.hash.slice(1)) || 'index';
  const p = PAGES[k] || PAGES.index;
  const meta = p.type ? `<div class="meta">${p.type} · 來源：${p.sources.replace(/[\[\]]/g, '')}</div>` : '';
  const body = marked.parse(linkify(p.md));
  document.getElementById('main').innerHTML = meta + (/^\s*#\s/.test(p.md) ? '' : `<h1>${p.title}</h1>`) + body;
  document.title = p.title + ' · ODTR LLM Wiki';
  renderList(document.getElementById('q').value);
  window.scrollTo(0, 0);
  document.getElementById('nav').classList.remove('open');
}
document.getElementById('q').addEventListener('input', e => renderList(e.target.value));
document.getElementById('menu').addEventListener('click', () => document.getElementById('nav').classList.toggle('open'));
window.addEventListener('hashchange', show);
show();
</script>
