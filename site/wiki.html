<script>
const PAGES = {"backward-recursion": {"title": "倒推遞迴與偽結局（backward recursion）", "type": "concept", "sources": "[bluemlein2022, williams2024, renson2025]", "group": "concepts", "md": "\n# 倒推遞迴與偽結局（backward recursion）\n\n## 直覺（生活比喻）\n\n想像要在期末前排好一整學期的讀書計畫。你會先決定「考前最後一週」怎麼讀最有效，再回頭決定上一週，因為上一週讀什麼好，要看之後那一週打算怎麼讀。倒推遞迴就是這種「從終點往回排」的做法。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 倒推遞迴（backward recursion）是學習最佳 DTR 的動態規劃（dynamic programming）方法；論文引用 Murphy（2003）的研究。[bluemlein2022, p.6]\n- 它處理兩個難題。第一，要同時考慮過去決定與當下決定的預後效果與延遲效果。第二，時間變動共變數依測量時間而定，可能既是干擾因子，也是治療效果的中介。[bluemlein2022, p.6]\n- 因此，把治療後才量到的共變數也放進同一個模型，會因為「解釋掉」（explaining-away）治療效果而造成治療後偏誤（post-treatment bias）；論文說，對完整病史只配一個模型，會得到有偏的 DTR。[bluemlein2022, p.6]\n- 做法：把連續決策拆成一組單步問題；每一步配一個結局模型來估計處理效應，再解出那一步的最佳決定。[bluemlein2022, p.6]\n- 結局只在最後一步觀察到，所以每一步改為最佳化「偽結局」（pseudo-outcome）：假如病人在之後的時間步都被最佳治療，會有的潛在結局。[bluemlein2022, p.6]\n- Algorithm 1 的流程：先把 DTR 設成資料中實際的治療序列，把偽結局設成觀察到的結局；然後 t 從 T 倒數到 1，每一步依序做五件事。[bluemlein2022, p.7]\n  - 估計傾向分數。[bluemlein2022, p.7]\n  - 用因果樹或因果森林估計處理效應。[bluemlein2022, p.7]\n  - 處理效應為正就給治療，否則不給。[bluemlein2022, p.7]\n  - 以代入原則（plug-in principle），把估計的最佳決定寫進 DTR。[bluemlein2022, p.7]\n  - 更新偽結局：下一輪（前一個時間步）的偽結局，等於這一步的偽結局，再加上「實際治療與估計的最佳治療不同時」的處理效應。所以偽結局記錄的是最佳決定帶來的改善量。[bluemlein2022, p.7-8]\n\n## 在各篇怎麼出現\n\n### 在 bluemlein2022 中\n\n- 這是 DTR-CT 與 DTR-CF 的骨架；五個基準方法也放在同一套遞迴裡，只是把每步估計處理效應的部分換掉。[bluemlein2022, p.12]\n- 每一步都用「到該步為止的完整病史」估計處理效應。[bluemlein2022, p.12]\n\n### williams2024\n\n- 同樣從最後一個時間點往回做；每個時間點重複同樣步驟，並把「依最佳規則給治療」的預測值當作往前一個時間點的結局。[williams2024, p.5]\n- 差別在每一步估計處理效應的工具：williams2024 用倍增穩健的無偏轉換再迴歸（見 [[doubly-robust-learner]]），bluemlein2022 用因果樹或因果森林（見 [[causal-tree-and-forest]]）。[williams2024, p.4] [bluemlein2022, p.7]\n\n### renson2025\n\n- 論文只討論二元治療與單一時間點的資料結構；倒推遞迴：來源未提及。[renson2025, p.2]\n\n## 常見誤解\n\n- 「倒推就是讓時間倒流」：倒的只是估計的順序，資料仍按時間記錄；原因是現在該怎麼決定，要考慮之後會採取哪些決定。[bluemlein2022, p.5]\n- 「偽結局是真的觀察值」：只有最後一步用的是觀察到的結局；之前各步用的是在估計的最佳決定下算出的結局。[bluemlein2022, p.6-7]\n- 「一個模型吃下整段病史就好」：論文說這樣會得到有偏的 DTR。[bluemlein2022, p.6]\n\n## 相關頁面\n\n- [[decision-points-and-history]]\n- [[optimal-dynamic-treatment-rule]]\n- [[blip-function]]\n- [[causal-tree-and-forest]]\n- [[q-learning-dwols-g-estimation]]\n- [[doubly-robust-learner]]\n- 來源頁：[[bluemlein2022]]、[[williams2024]]、[[renson2025]]\n- 名詞速查：[[glossary]]\n"}, "blip-function": {"title": "Blip 函數（條件平均處理效應）", "type": "concept", "sources": "[williams2024, bluemlein2022, hong2021]", "group": "concepts", "md": "\n# Blip 函數（條件平均處理效應）\n\n## 直覺（生活比喻）\n\n想像為每位同學算一張「補習的加分表」：有補習的預期成績減去沒補習的預期成績。加分是正的，就建議補習；是負的，就不補。blip 函數就是這張加分表，只是它是「按特徵分群」算出來的平均差。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 條件平均處理效應（conditional average treatment effect, CATE）通常稱為 blip 函數（blip function），是用迴歸方法學出最佳規則的關鍵成分。[williams2024, p.3]\n- 因果寫法：B(V) 等於在 V 條件下「接受治療的反事實結局」減「沒接受治療的反事實結局」的期望值；觀察資料寫法則是對 `E[Y|H, A = 1] - E[Y|H, A = 0]` 在 V 條件下取期望。[williams2024, p.3]\n- 這兩個寫法要相等，需要三個假設：一致性（consistency）、無未測量干擾（可交換性，exchangeability）與正值性（positivity），見 [[identification-assumptions]]。[williams2024, p.3]\n- 決策規則：若目標是讓結局期望值最大，就對 Bn(V) 為正的人給治療、為負的人不給。論文給的是最大化版本；最小化版本（例如要讓 RROU 最小）的寫法來源未提及，方向相反是讀者的推論。[williams2024, p.3]\n- 簡單的替代式（substitution）估計：先估 Q(H, A) = E[Y|H, A]，再把 A 分別設為 1 與 0 做預測、相減，最後把差值對 V 迴歸。[williams2024, p.3]\n- 論文指出這種簡單估計式的表現可能不好，因此改用無偏轉換（unbiased transformation），見 [[doubly-robust-learner]]。[williams2024, p.3]\n- 時間變動版本：第一個時間點的 blip 要重新定義成「假設之後的治療已依最佳規則指派」下的差。[williams2024, p.4]\n\n## 在各篇怎麼出現\n\n### williams2024\n\n- 是論文估計 ODTR 的核心：先學 blip，再以符號決定治療。[williams2024, p.3]\n- 範例中檢查各週的 blip 模型，發現所有用來做決策的變數都沒被選進去，模型變成只有截距，所以每週的最佳規則就只由偽結局的正負號決定。[williams2024, p.6]\n- 論文提到的一個一致估計 ψ 的條件：blip 不可為零，也就是 `P(B(V) = 0) = 0`，沒有任何個體的 CATE 剛好是零。[williams2024, p.4]\n- 論文提到可以用決策樹估計 B(V)，得到好解讀的決策規則。[williams2024, p.4]\n\n### 在 bluemlein2022 中\n\n- 論文把 blip 函數寫成：在病史條件下，若在時間 t 治療或不治療、且之後都依最佳決定，兩者潛在結局的期望差。概念出自 Robins（2004），論文也稱它為異質處理效應（heterogeneous treatment effect, HTE）。[bluemlein2022, p.5]\n- 若 HTE 已知，最佳決定就是對 HTE 為正的人給治療（假設沒有治療成本或限制）。[bluemlein2022, p.5]\n- 實際只觀察得到實際治療下的結局，所以 HTE 是反事實量，要靠假設才能從資料識別，見 [[identification-assumptions]]。[bluemlein2022, p.5]\n- 估計方式：DTR-CT 以每片葉子內治療組與未治療組的（逆傾向分數加權）平均結局之差，當作該葉的 HTE；DTR-CF 以局部鄰域的加權平均估計。見 [[causal-tree-and-forest]]。[bluemlein2022, p.9]\n- 古典方法（Q 學習等）則假設 blip 是病史的線性函數，稱為 blip model（治療交互作用模型），見 [[q-learning-dwols-g-estimation]]。[bluemlein2022, p.22]\n- 與 williams2024 的對照：williams2024 的範例以 ℓ1 正規化估計 blip；bluemlein2022 直接用樹或森林估計。[williams2024, p.5] [bluemlein2022, p.9]\n- 真實資料的樹中，每片葉子標示該亞群的估計處理效應與對應的最佳決定。[bluemlein2022, p.16-17]\n\n### 在 hong2021 中\n\n- 論文把死亡結局的期望值拆成兩塊：「沒有治療的模型」加上「blip 函數」；blip 函數由一組參數表達，描述治療（這裡是機械功率劑量）的效果。[hong2021, p.3]\n- 這裡的治療是連續劑量：MP 的分布假設為 Gamma 分布，連結函數取對數；blip 中同時有 MP 的一次項與二次項。與一次項交互的變數包含年齡、呼吸速率、收縮壓、心率、類別、血氣與實驗室指標；與二次項交互的只有類別與 P/F 比值。[hong2021, p.3]\n- 本 wiki 的讀法（不是論文的話）：劑量只有一次項時，結局對劑量是一條直線，最佳劑量只會落在可用範圍的兩端；加入二次項，最佳劑量才可能落在中間。\n- 與前兩篇不同：williams2024 與 bluemlein2022 的 blip 是「給治療」減「不給治療」的差，hong2021 的 blip 是劑量的函數；blip 係數的數值，以及相對於哪個基準劑量：來源未提及。[williams2024, p.3] [williams2024, p.5] [bluemlein2022, p.5] [hong2021, p.3]\n\n## 常見誤解\n\n- 「blip 是某一個人的真實效果」：它是在 V 相同的人之中的平均差，不是個人的效果；論文把它稱為 CATE。[williams2024, p.3]\n- 「blip 估計出來之後，規則就一定有用」：範例中 blip 模型退化為截距，結果規則與病人特徵無關，見上。[williams2024, p.6]\n\n## 相關頁面\n\n- [[treatment-effect-heterogeneity]]\n- [[doubly-robust-learner]]\n- [[optimal-dynamic-treatment-rule]]\n- [[identification-assumptions]]\n- [[causal-tree-and-forest]]\n- [[q-learning-dwols-g-estimation]]\n- 來源頁：[[williams2024]]、[[bluemlein2022]]、[[hong2021]]\n"}, "causal-tree-and-forest": {"title": "因果樹與因果森林（causal tree / causal forest）", "type": "concept", "sources": "[bluemlein2022, williams2024]", "group": "concepts", "md": "\n# 因果樹與因果森林（causal tree / causal forest）\n\n## 直覺（生活比喻）\n\n把全班同學分成幾個小組：同一組的人背景相似，不同組的人對「補習有沒有用」的反應差很多；接著在每一組內，比較有補習與沒補習的平均成績差，這就是那一組的補習效果。這就是因果樹。因果森林則像請很多位老師各自分組，再對某位同學看「哪些同學常和他被分在同一組」，用這些「鄰居」的平均來估他的補習效果。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 因果樹（causal tree，Athey 與 Imbens 2016）與因果森林（causal forest）是估計異質處理效應（HTE）的方法，原本為靜態（單一時間點）設定設計，論文說它們尚未被用來學最佳 DTR。[bluemlein2022, p.3]\n- 與一般的 CART 或隨機森林不同：後者沒有明確建模因果效應；因果樹以量身訂做的分裂準則，直接估計有因果解釋的 HTE。[bluemlein2022, p.3-4]\n- 分裂準則：獎勵「葉子內處理效應相近、葉子之間處理效應不同」的分群方式。[bluemlein2022, p.8]\n- 誠實分割（honest splitting）：把資料分成訓練集（用來決定怎麼分群，即模型選擇）與估計集（用來估計每個葉子的效應，即模型估計），兩者不重疊；目的是確保無偏並避免過度配適。[bluemlein2022, p.8]\n- 葉子的處理效應：該葉內治療組與未治療組的平均結局之差，結局先以逆傾向分數加權。[bluemlein2022, p.9]\n- 因果森林：許多棵因果樹的集成，像自適應的最近鄰估計式；某位病人的 HTE 不是簡單平均，而是對局部鄰域的加權平均，權重是其他病人與他落在同一片葉子的頻率。[bluemlein2022, p.9-10]\n- 森林版也遵守誠實原則：結局與傾向分數以「袋外」（out-of-bag）方式預測，不用該病人自己的資料。[bluemlein2022, p.9]\n\n## 在各篇怎麼出現\n\n### 在 bluemlein2022 中\n\n- DTR-CT 用單棵因果樹，DTR-CF 用因果森林，各自放在倒推遞迴的每一個時間步（見 [[backward-recursion]]）。[bluemlein2022, p.6]\n- 設定：DTR-CT 以 50 % 訓練、50 % 估計；每片葉子的治療與對照病人合計至少 20 位（各 10 位）；分裂用的桶最多 20 個；5 折交叉驗證決定剪枝。DTR-CF 每個時間步用 500 棵樹。[bluemlein2022, p.24]\n- 論文說這兩個方法的優勢，是不必假設關係已知，也不必假設所有病人由同一組變數決定治療。[bluemlein2022, p.17]\n- 敏感度：葉子最小人數在 10 到 70 之間變動，結果變化很小。[bluemlein2022, p.14]\n- 作者也推測樹與森林會自動偵測要控制哪些共變數，因此可能比線性模型更不受未測量干擾影響；這是推測，沒有直接檢驗。[bluemlein2022, p.25]\n\n### williams2024\n\n- 論文提到可以用決策樹估計 blip 函數 B(V)，得到好解讀的決策規則；因果樹的分裂準則與誠實分割：本 wiki 的 williams2024 頁未記載。[williams2024, p.4]\n\n### renson2025\n\n- 來源未提及因果樹或因果森林。\n\n## 常見誤解\n\n- 「因果樹就是一般決策樹」：論文把 CART 當成基準，並說它不是為了估計因果 HTE 而設計的。[bluemlein2022, p.12]\n- 「樹分出來的群組一定有因果意義」：論文的識別仍需要假設（例如序列可交換性），見 [[identification-assumptions]]。[bluemlein2022, p.6]\n- 「森林就不能解釋」：論文用變數重要性解釋 DTR-CF，並在自己的用詞下稱 DTR-CF 為「可說明」（explainable）、DTR-CT 為「可詮釋」（interpretable），見 [[interpretability]]。[bluemlein2022, p.2] [bluemlein2022, p.11]\n\n## 相關頁面\n\n- [[blip-function]]\n- [[treatment-effect-heterogeneity]]\n- [[cross-fitting]]\n- [[interpretability]]\n- [[backward-recursion]]\n- [[q-learning-dwols-g-estimation]]\n- 來源頁：[[bluemlein2022]]、[[williams2024]]\n- 名詞速查：[[glossary]]\n"}, "cross-fitting": {"title": "交叉擬合與樣本分割（cross-fitting）", "type": "concept", "sources": "[renson2025, williams2024, bluemlein2022]", "group": "concepts", "md": "\n# 交叉擬合與樣本分割（cross-fitting）\n\n## 直覺（生活比喻）\n\n老師若用同一份考古題先教學生、又拿它當期末考，成績會看起來比實力高。比較公平的做法，是把題庫分成兩半：一半用來教、另一半用來考，之後兩半交換角色再算一次。交叉擬合的想法類似：用一份資料估計干擾函數，用另一份資料算最後的估計式。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 條件：干擾估計式要在「和最後評估估計式不同的樣本」中擬合。[renson2025, p.4]\n- 做法：可以透過各種樣本分割（sample splitting），例如交叉擬合。[renson2025, p.4]\n- 簡單版本：把樣本分成兩半；用前一半估計干擾模型 `P̂`，用後一半計算估計式 `ψ̂_os`；然後交換兩半的角色，把結果平均。更完整的描述在論文附錄。[renson2025, p.4]\n- 為什麼需要：單步估計式剩下的「CLT 項」與「經驗過程項」，在這個條件下一般會收斂到均值為零的常態分布。[renson2025, p.4]\n- 論文強調樣本分割，是為了能使用最一般的機器學習演算法。[renson2025, p.5]\n- 例外：具 Donsker 類性質的演算法，可免樣本分割用於速率倍增穩健估計式；高度適應性 lasso 在適當條件下兩者兼具。[renson2025, p.5]\n\n## 在各篇怎麼出現\n\n### 在 renson2025 中\n\n- 位於第四步的證明骨架中，用來處理「一階誤差」的剩餘部分，餘項則另靠速率倍增穩健性。見 [[rate-double-robustness]]。[renson2025, p.4]\n\n### williams2024\n\n- 範例中 Q 與 g 的估計用交叉擬合與離散超級學習器。[williams2024, p.5]\n- 論文說，被估計的函數「夠平滑」這個條件可以用樣本分割繞過。[williams2024, p.4]\n- 兩篇的說法方向一致（用樣本分割避開對干擾估計式的額外條件），但用詞不同；本頁不判斷兩個條件是不是同一個條件：來源未提及。\n\n### 在 bluemlein2022 中\n\n- 論文的樣本分割叫誠實分割（honest splitting）：把資料分成訓練集（模型選擇）與估計集（模型估計），兩者不重疊，目的是確保無偏並避免過度配適。[bluemlein2022, p.8]\n- 設定：DTR-CT 以 50 % 訓練、50 % 估計；用 5 折交叉驗證決定剪枝。[bluemlein2022, p.24]\n- 森林版：結局與傾向分數用「袋外」方式預測，不使用該病人自己的資料。[bluemlein2022, p.9]\n- 論文沒有使用「交叉擬合」一詞，也沒有說明誠實分割是否等同 renson2025 所說的、讓干擾函數與最後估計式用不同樣本的條件：來源未提及。詳見 [[causal-tree-and-forest]]。\n\n## 常見誤解\n\n- 「交叉擬合就保證有效推論」：論文說使用 EIF 型估計式並不會自動處理餘項，還需要速率倍增穩健性。[renson2025, p.4]\n- 「一定要做樣本分割」：論文指出具 Donsker 類性質的演算法可以不用。[renson2025, p.5]\n- 「交叉擬合只是把資料切開來驗證模型好壞」：在論文裡它的角色是讓干擾函數與最後估計式用不同樣本，而不是模型選擇。[renson2025, p.4]\n\n## 相關頁面\n\n- [[nuisance-functions]]\n- [[rate-double-robustness]]\n- [[plug-in-and-one-step-estimators]]\n- [[doubly-robust-learner]]\n- [[causal-tree-and-forest]]\n- 來源頁：[[renson2025]]、[[williams2024]]、[[bluemlein2022]]\n- 名詞速查：[[glossary]]\n"}, "decision-points-and-history": {"title": "決策時間點與病史（連續決策）", "type": "concept", "sources": "[williams2024, bluemlein2022, hong2021, desman2025]", "group": "concepts", "md": "\n# 決策時間點與病史（連續決策）\n\n## 直覺（生活比喻）\n\n用手機導航開車：每個路口都要重新決定「直走還是轉彎」，而且決定時看到的是「到目前為止走過的路與現在的路況」。治療也是這樣，不是一次決定到底，而是每次回診再決定一次。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 決策時間點（decision point）：研究中離散的時間點（例如天、週、月），每個時間點病人可以選擇加量或不加量。[williams2024, p.2]\n- 病史（history, 記為 Ht）：到「剛好在 At 之前」為止所有變數的紀錄，包含各期共變數與過去的治療。[williams2024, p.3]\n- 每個時間點的順序是：先量到共變數 Lt，接著是二元治療指標 At，最後是結局 Y。[williams2024, p.3]\n- 規則中真正使用的變數 Vt 是 Ht 的子集合。[williams2024, p.3]\n- 於是治療規則變成一個序列：每個時間點各有一條規則，而每條規則都以當時為止觀察到的病史（含基線與時間變動共變數）為條件。[williams2024, p.2]\n- 論文說，所有規則都必須在資料中有支持，也就是資料裡要真的有人照著各條規則做過。[williams2024, p.3]\n\n## 在各篇怎麼出現\n\n### williams2024\n\n- 範例中每週都是一個決策：醫師在每次回診決定這位病人要不要增加 BUP-NX 劑量。[williams2024, p.2]\n- 論文把問題寫成：「用每位病人的基線病史與每週回診取得的資訊，每週該對哪些病人增加劑量，才能讓第 12 週回到規律鴉片使用最少？」這是時間變動 ODTR 的例子。[williams2024, p.3]\n- 估計時要從最後一個時間點開始往回推，原因是前面時間點的最佳決定，取決於後面時間點之後會如何被最佳地決定；做法見 [[doubly-robust-learner]]。[williams2024, p.3]\n- 範例分析把每週治療定義為「這週的最大領取劑量有沒有比上週高」。[williams2024, p.5]\n- 時間變動干擾因子包含最近開立的劑量與前一週有無非研究用鴉片使用，見 [[identification-assumptions]]。[williams2024, p.5]\n\n### 在 bluemlein2022 中\n\n- 論文用 t = 1 到 T 表示時間步；病史 Ht 由基線共變數、到前一步為止的治療、到時間 t 為止的時間變動共變數組成；結局在時間 T + 1 觀察到。[bluemlein2022, p.4]\n- 病史中的共變數有先後之分：依測量時間，時間變動共變數可能是干擾因子，也可能是治療效果的中介；把治療後才量到的共變數放進同一個模型，會造成治療後偏誤。這是採用倒推遞迴的理由之一，見 [[backward-recursion]]。[bluemlein2022, p.6]\n- 模擬資料有 3 個時間步。[bluemlein2022, p.11]\n- 真實資料取加護病房的前 10 小時病史；模型只用三個時間步的病史，以偵測最多延遲三個時間步的效果。[bluemlein2022, p.15]\n- 論文的限制段落寫「評估兩個時間步」，與上面兩條不一致；原因來源未說明。[bluemlein2022, p.18]\n\n### 在 hong2021 中\n\n- 時間點：從開始機械通氣起每 8 小時蒐集一次時間變動變數，共 48 小時，所以有 7 個時間點（0 到 48 小時）；選 8 小時，是因為多數病人的靜態肺力學平均約每 8 小時量一次。[hong2021, p.2]\n- 同一個 8 小時窗內若有多次測量，取平均；缺失值以末次觀察值延續（LOCF）補，論文說另以 hot deck 法做過敏感度分析，但結果未顯示。[hong2021, p.2]\n- 病人的「狀態」包含有限混合模型分出的類別（見 [[finite-mixture-subphenotypes]]）與生理變數；類別會隨通氣天數改變，論文以此說明為什麼通氣策略要隨時調整。[hong2021, p.7]\n- 從 Class 2 轉到 Class 1 的病人較可能存活到出院；Class 3 在通氣期間維持不變。[hong2021, p.4] [hong2021, p.5]\n- 病史怎麼進入模型（只用當期的值，還是也含過去的治療與前期的值）：來源未提及；論文只列出協變數清單。[hong2021, p.3]\n\n### 在 desman2025 中\n\n- 時間點：每小時一個決策點；只用每位病人手術後前 24 小時的資料，時間步從 ICU 入院後第一次血糖測量開始記。[desman2025, p.8]\n- 病史怎麼進入：以「狀態」表示，包含當下的特徵、前四小時的血糖、這段期間的血糖變化，以及血糖變化與胰島素劑量的比值，而不是整段病史。[desman2025, p.9]\n- 缺失值：先以前一個值往後填，再以 k 近鄰法（k = 5）補。[desman2025, p.8]\n- 視野：折扣因子設為 0.67，相當於約 3 小時的有效視野；論文說這是為了讓策略跟得上快速變化的血糖。[desman2025, p.9]\n- 資訊限制：GLUCOSE 只能用到目前時間點為止的資料，人類評估者則看得到整段時間序列。本 wiki 的對照（不是論文的話）：這與本頁「病史只含剛好在治療之前的資訊」的定義一致。[desman2025, p.5] [desman2025, p.7] [williams2024, p.3]\n\n## 常見誤解\n\n- 「連續決策只是把單一決策重複做很多次」：論文的作法不是各週各自獨立學，而是先學最後一步、再假設最後一步已經最佳，回頭學前一步。[williams2024, p.3]\n- 時間點的間隔固定是多少、最多可以有幾個時間點：來源未提及一般性的限制，只說明可推廣到任何時間範圍 τ。[williams2024, p.4]\n\n## 相關頁面\n\n- [[dynamic-treatment-regime]]\n- [[optimal-dynamic-treatment-rule]]\n- [[doubly-robust-learner]]\n- [[backward-recursion]]\n- [[finite-mixture-subphenotypes]]\n- [[reinforcement-learning-mdp]]\n- 來源頁：[[williams2024]]、[[bluemlein2022]]、[[hong2021]]、[[desman2025]]\n"}, "distributional-reinforcement-learning": {"title": "分布式強化學習（看整個結果分布，不只看平均）", "type": "concept", "sources": "[desman2025]", "group": "concepts", "md": "\n# 分布式強化學習（看整個結果分布，不只看平均）\n\n## 直覺（生活比喻）\n\n兩位外送員的平均送餐時間一樣，但其中一位偶爾會嚴重誤點。只看平均，兩人看起來一樣好；看整個分布，才知道哪一位偶爾會出大問題。調胰島素也是：同一個劑量，大多數病人沒事，但少數人可能血糖掉太低，只看平均會漏掉這個風險。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 分布式強化學習（distributional RL）：刻畫「可能結果的整個分布」，而不只是期望獎勵。[desman2025, p.2] [desman2025, p.8]\n- 論文的動機：只看期望獎勵的離線 RL 會忽略病人反應的不確定性；分布式 RL 提供對各行動風險與益處較完整的理解，讓決策在不確定下更細緻。[desman2025, p.2]\n- 為什麼適合胰島素：外表相似的病人，生理反應仍可能差很多；分布式 RL 量化馬可夫決策過程中本質上的不確定性。[desman2025, p.7]\n- 論文特別強調罕見但嚴重的事件，例如低血糖，傳統 RL 可能低估；胰島素的治療指數窄，所以需要這種風險意識。[desman2025, p.9]\n- 做法：把隱含分位數網路（Implicit Quantile Networks, IQN）放進 CQL。論文說，IQN 不像其他分布式方法要事先指定分位數的個數，而是在訓練時從連續的分位數值取樣，彈性地學出完整的報酬分布，不需固定分箱。[desman2025, p.9]\n- 本 wiki 對「分位數」的白話（不是論文的話）：把所有可能的結果由差到好排成一列，某個分位數就是排在隊伍某個位置的那個結果；學很多個位置的結果，就約略描出整個分布。\n- 論文宣稱這是醫療領域第一次把 CQL 與分布式 Q 函數整合；這是作者的說法。[desman2025, p.9]\n\n## 在各篇怎麼出現\n\n### 在 desman2025 中\n\n- GLUCOSE 就是 CQL 結合 IQN 的演算法；論文把它當成研究的第二個重要優點（第一個是三階段人類評估）。[desman2025, p.7] [desman2025, p.9]\n- 論文引用文獻說這種做法優於其不分布式的版本；但論文自己沒有報告拿掉分布式部分的對照實驗：來源未提及。所以本研究的結果不能歸因於分布式的設計。[desman2025, p.9]\n- 論文沒有單獨報告對低血糖等罕見事件的估計風險分布：來源未提及；正文只有每位病人至少發生一次低血糖的比例。[desman2025, p.2]\n\n## 常見誤解\n\n- 「分布式 RL 預測的是血糖的分布」：論文說的是報酬（return）的分布，也就是長期累積獎勵的各種可能值。[desman2025, p.9]\n- 「看了分布就一定更安全」：論文只說這樣能更好地處理不確定性；它用來證明安全性的是人類評估與離線評估，並說還需要前瞻性試驗。[desman2025, p.7] [desman2025, p.9]\n\n## 相關頁面\n\n- [[reinforcement-learning-mdp]]\n- [[offline-reinforcement-learning]]\n- [[off-policy-evaluation]]\n- [[treatment-effect-heterogeneity]]\n- 來源頁：[[desman2025]]\n- 名詞速查：[[glossary]]\n"}, "doubly-robust-learner": {"title": "倍增穩健學習器（從資料學出規則的方法）", "type": "concept", "sources": "[williams2024, renson2025, bluemlein2022]", "group": "concepts", "md": "\n# 倍增穩健學習器（從資料學出規則的方法）\n\n## 直覺（生活比喻）\n\n請兩位預報員各自預測明天會不會下雨：一位看氣象雲圖（預測結局），一位看過去的天氣紀錄推測今天為什麼是這個天氣（預測誰拿到哪種治療）。「倍增穩健」（doubly robust）的意思是：只要兩位之中有一位夠準，最後的結論就大致可靠。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 論文描述的是一個非參數、倍增穩健、以迴歸為基礎的方法，稱為 DR 估計式（DR estimator）或 DR 學習器（DR learner）。[williams2024, p.1-3]\n- 核心概念是無偏轉換（unbiased transformation）：資料的函數 D(O) 在 V 條件下的期望值等於 [[blip-function]] B(V)。[williams2024, p.3]\n- 論文用的是增強型逆機率加權（augmented inverse probability weighting, AIPW）轉換。除了結局迴歸 Q(H, A)，還要估計實際拿到所觀察到治療的機率 g(A, H)。[williams2024, p.3]\n- 倍增穩健的意思：Q 或 g 只要有一個被一致地估計，就能得到 B(V) 的無偏估計。[williams2024, p.3]\n- 這個性質也讓分析者能用彈性的資料自適應演算法來配模型，並以標準統計理論做推論。[williams2024, p.3]\n- 單一時間點的步驟（Algorithm 1）：用 H 與 A 迴歸 Y，用 H 迴歸 A 得到 g；把 A 分別設為 1 與 0 預測 Q；組成 AIPW 轉換值；再把轉換值對 V 迴歸得到 blip 估計；預測為正就給治療。[williams2024, p.4]\n- 多個時間點（Algorithm 2）：從最後一個時間點倒著做；每個時間點重複上述步驟，並把「依最佳規則給治療」的預測值當作下一輪往前一個時間點的結局。[williams2024, p.5]\n- 論文說，各步迴歸都可以用資料自適應的機器學習演算法，在維持有效統計推論下增加模型彈性。[williams2024, p.4]\n\n## 在各篇怎麼出現\n\n### williams2024\n\n- 範例中 Q 與 g 的估計用交叉擬合與離散超級學習器；候選學習器包含 lasso（ℓ1 正規化）、多變量適應性迴歸樣條、梯度提升；元學習器採「贏者全拿」，選交叉驗證均方誤差最小的學習器。[williams2024, p.5]\n- blip 的估計用 ℓ1 正規化；最佳規則下的平均結局用依序倍增穩健（sequentially doubly robust）估計式，並使用相同的超級學習器候選庫。[williams2024, p.5]\n- 論文指出，另一類做法是分類式方法（outcome-weighted learning 等）；在各自假設成立時，所有提到的演算法在漸近上都是一致的，但有限樣本表現可能不同。[williams2024, p.6]\n- 論文提供的 R 套件在 GitHub 上可下載，並以有限的模擬研究確認實作正確。[williams2024, p.4]\n- 一致估計最佳規則下的平均結局另需額外條件，見 [[identification-assumptions]]；其中一個條件是這些被估計的函數「夠平滑」，但可以用樣本分割（sample-splitting）繞過。[williams2024, p.4]\n\n### 在 renson2025 中\n\n- renson2025 解釋為什麼倍增穩健（EIF 型）估計式適合搭配機器學習：以平均處理效應為例，倍增穩健估計式在使用機器學習時，仍可得到（大樣本下）名目涵蓋率的信賴區間，g 計算法除了特殊情況外做不到。[renson2025, p.1]\n- 它的範例估計式（單步估計式）就是增強型逆機率加權（AIPW）估計式，估計的是不治療時的平均結局，而不是 blip 函數。[renson2025, p.3]\n- 論文把「倍增穩健」拆成兩個不同的性質：倍增穩健一致性（兩個干擾估計式有一個設定正確就一致）與速率倍增穩健（誤差是兩個干擾估計式誤差的乘積）。詳見 [[rate-double-robustness]]。[renson2025, p.4]\n- 論文的變異數估計式要求兩個干擾函數都被一致估計，這在使用機器學習時可能是合理的。[renson2025, p.5]\n- 干擾函數、交叉擬合與單步估計式的細節，見 [[nuisance-functions]]、[[cross-fitting]]、[[plug-in-and-one-step-estimators]]；兩篇對照見 [[method-comparison]]。\n- renson2025 是否討論動態治療規則或 blip 函數的學習：來源未提及。\n\n### 在 bluemlein2022 中\n\n- 論文的做法是「逆傾向分數加權」而不是 AIPW 轉換：在每個時間步，先用邏輯斯迴歸估傾向分數（原則上任何機率分類器都可），再以傾向分數的倒數加權結局，交給因果樹或因果森林估計處理效應。[bluemlein2022, p.7]\n- 論文說這類比 DWOLS，而 Wallace 等人（2017）顯示這種加權帶來倍增穩健：每個時間步只要傾向分數模型或處理效應模型有一個設定正確且無偏，就能得到無偏的處理效應估計，進而得到最佳決定。[bluemlein2022, p.10]\n- 論文的推論：因果樹與因果森林是 HTE 的無偏估計式，最大概似是邏輯斯迴歸參數的無偏估計式，所以它們的方法也是倍增穩健。本 wiki 在正文沒有看到另外的形式證明（本 wiki 的觀察）。[bluemlein2022, p.10]\n- 森林版的公式不用加權，而是把結局與傾向分數的「袋外」預測值代入，並以治療減傾向分數的差修正；演算法則寫成加權，兩者的關係論文沒有進一步說明。[bluemlein2022, p.7] [bluemlein2022, p.9]\n- 本 wiki 的整理：論文所稱的倍增穩健，條件與 williams2024 的「Q 或 g 有一個一致就行」同一類；收斂速率與信賴區間：來源未提及。兩篇與 renson2025 的對照見 [[method-comparison]]。[bluemlein2022, p.10]\n- 倒著逐步估計的整體流程見 [[backward-recursion]]；逆傾向分數加權的結局模型也出現在基準方法 DWOLS，見 [[q-learning-dwols-g-estimation]]。[bluemlein2022, p.23]\n\n## 常見誤解\n\n- 「倍增穩健就是不會錯」：它只要求 Q 與 g 其中一個被一致地估計；論文另外列出推論還需要的條件。[williams2024, p.4]\n- 「簡單的替代式估計就夠了」：論文說它的表現可能不好，才轉向無偏轉換。[williams2024, p.3]\n- 「模擬研究證明這個方法比別的方法好」：作者明說有限的模擬不代表一般的估計式表現。[williams2024, p.4]\n\n## 相關頁面\n\n- [[blip-function]]\n- [[identification-assumptions]]\n- [[optimal-dynamic-treatment-rule]]\n- [[decision-points-and-history]]\n- [[rate-double-robustness]]\n- [[cross-fitting]]\n- [[nuisance-functions]]\n- [[plug-in-and-one-step-estimators]]\n- [[method-comparison]]\n- [[backward-recursion]]\n- [[causal-tree-and-forest]]\n- [[q-learning-dwols-g-estimation]]\n- 來源頁：[[williams2024]]、[[renson2025]]、[[bluemlein2022]]\n- 名詞速查：[[glossary]]\n"}, "dynamic-treatment-regime": {"title": "動態治療策略（靜態與動態規則）", "type": "concept", "sources": "[williams2024, bluemlein2022, hong2021, desman2025]", "group": "concepts", "md": "\n# 動態治療策略（靜態與動態規則）\n\n## 直覺（生活比喻）\n\n想像營養午餐。「靜態」像是全校每天都領同一份便當；「動態」像是營養師看每個學生的身高、過敏與當天狀況，再決定給哪一份。兩種都是「規則」，差別在規則有沒有看對象的資料。（這個比喻是本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 治療規則（treatment rule）d(V) 是一個函數：輸入治療前的變數 V，輸出要給的治療 A。[williams2024, p.2]\n- 靜態（static）規則：每個人都拿到同一個治療值，不管輸入是什麼，d 永遠輸出相同的 A。[williams2024, p.2]\n- 動態（dynamic）規則：治療依個人已量測的病史 H 而定；也可只挑 H 裡的一部分變數 V 放進規則。[williams2024, p.2]\n- 正式說法：把治療當成個人病史的函數、且確定性地指派，稱為動態治療規則。[williams2024, p.1]\n- 當治療有多個時間點，規則變成一串 [[decision-points-and-history]] 中的規則，每個時間點的規則都看到當時為止的病史。[williams2024, p.2]\n- 在最佳化的脈絡下，「在所有可能的規則裡選出最好的」見 [[optimal-dynamic-treatment-rule]]。\n\n## 在各篇怎麼出現\n\n### williams2024\n\n論文用 Table 1 的四個情境說明差異（BUP-NX 為治療鴉片使用障礙的藥物）：[williams2024, p.2]\n\n- 情境 1（靜態）：所有病人固定開 16/4 mg/d，整個療程不變。[williams2024, p.2]\n- 情境 2（靜態）：所有病人初始 4/1 mg/d，每 2 週加量，直到最大 24/6 mg/d。[williams2024, p.2]\n- 情境 3（動態）：依自述戒斷症狀程度，初始劑量為 4/1 mg/d 或 16/4 mg/d；之後不論病人特徵，每 2 週加 4/1 mg/d，直到最大 24/6 mg/d。[williams2024, p.2]\n- 情境 4（動態）：初始 4/1 mg/d；每次 2 週一次的回診，自述自上次回診後有任何鴉片使用的病人加 4/1 mg/d（最大 24/6 mg/d），沒有使用的維持原劑量。[williams2024, p.2]\n\n另一個動態規則的例子：以病人的住房狀況決定開哪一種藥；論文引用的一個試驗發現，無家可歸者用注射型納曲酮的 RROU 風險較低，住房穩定者用 BUP-NX 較低。[williams2024, p.1]\n\n### 在 bluemlein2022 中\n\n- 論文把 DTR 寫成一串決策規則：每個時間點的規則把「到那個時間點為止的病史」對應到治療選項，所有可能 DTR 的集合由所用的函數類別決定。[bluemlein2022, p.5]\n- 論文的說法：DTR 以病人的歷史資訊為輸入，輸出個人化的治療決定。[bluemlein2022, p.2]\n- 論文把既有方法分成兩條路線：統計學的古典 DTR 方法（多用線性迴歸，可解釋但結構簡單）與機器學習路線（多為黑箱）；它要找的是「可解釋、又能處理複雜關係」的方法，見 [[causal-tree-and-forest]]、[[interpretability]]。[bluemlein2022, p.2]\n- 論文說 DTR 的研究可追溯到 Robins（1997、2004）。[bluemlein2022, p.3]\n- 論文設定中的治療是二元的（治療或不治療）。[bluemlein2022, p.4]\n\n### 在 hong2021 中\n\n- 論文用 DTR 把「個人化通氣策略」形式化：DTR 的想法是估計一串治療規則，使臨床益處最大；論文說這樣的策略不只看病人目前的生理狀況，也看先前對治療的反應。[hong2021, p.1-2]\n- 這裡的「治療」是連續的劑量（機械功率，見 [[mechanical-power]]）：規則在前 48 小時、每 8 小時的各個時間點輸出個人化的最佳劑量，而不是「給或不給」。[hong2021, p.2-3]\n- 論文說 DTR 的好處是能完整考慮疾病過程中的狀態轉換，並提到 DTR 已用在精神健康、腫瘤與創傷等領域。[hong2021, p.7]\n- 論文指出現行臨床實務很少考慮病人狀態的動態轉換；指引雖有單一數值的建議（例如潮氣量與平台壓的上限），病情改變時該怎麼調整呼吸器，論文說大致不清楚。[hong2021, p.7]\n- 本 wiki 的對照（不是論文的話）：論文批評的「全體病人共用同一個上限」，大致對應本 wiki 的「靜態規則」；論文自己沒有使用「靜態規則」這個詞。\n- 規則的具體形式（例如各係數的數值或流程圖）：正文未列出，來源未提及。[hong2021, p.3]\n\n### 在 desman2025 中\n\n- 論文沒有使用「動態治療策略」或 DTR 這些詞：來源未提及。它用強化學習的語言：學出依病人個別血糖波動調整、使累積獎勵最大的最佳胰島素劑量策略。[desman2025, p.2]\n- 規則的輸出是連續的劑量：每小時的常規胰島素量，四捨五入到整數，上限為每小時 10 單位。[desman2025, p.9]\n- 論文拿來對照的是階梯式劑量：同一個血糖給同一個劑量，不看病人個別條件。本 wiki 的對照（不是論文的話）：這相當於一條只看一個變數的簡單規則；GLUCOSE 則每小時評估超過 70 個特徵。[desman2025, p.2] [desman2025, p.7]\n- 規則由三層隱藏層的神經網路表示；可以直接閱讀的公式或流程圖：來源未提及。[desman2025, p.9]\n\n## 常見誤解\n\n- 「劑量會隨時間增加就是動態」不一定：情境 2 每個人的劑量安排完全相同，論文仍把它歸為靜態。[williams2024, p.2]\n- 「動態」的定義不只一種：論文採用「規則依 Ht 中任何變數而定」的寬鬆定義；也有人把靜態規則限定為只依基線資訊、把動態限定為會隨時間、只依時間變動共變數而變，照那個定義只有情境 4 算動態。[williams2024, p.2]\n\n## 相關頁面\n\n- [[decision-points-and-history]]\n- [[optimal-dynamic-treatment-rule]]\n- [[treatment-effect-heterogeneity]]\n- [[interpretability]]\n- [[mechanical-power]]\n- [[reinforcement-learning-mdp]]\n- 來源頁：[[williams2024]]、[[bluemlein2022]]、[[hong2021]]、[[desman2025]]\n- 名詞速查：[[glossary]]\n"}, "efficient-influence-function": {"title": "有效影響函數（EIF）", "type": "concept", "sources": "[renson2025, williams2024]", "group": "concepts", "md": "\n# 有效影響函數（EIF）\n\n## 直覺（生活比喻）\n\n站在山坡上，「斜率」告訴你：往某個方向走一小步，高度會變多少。有效影響函數（efficient influence function, EIF）就像統計估計目標的斜率：資料分布稍微動一點點，我們要的那個數字會跟著動多少。知道這個斜率，就知道該怎麼修正一個粗略的估計。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 論文給的是啟發式的描述：EIF 是一種導數。若估計目標是分布的函數，EIF 就是這個函數對分布的導數，反映估計目標對資料分布小變動的敏感度。[renson2025, p.2]\n- EIF 也代表「拿掉第 i 個單位的資料，對任何有效估計式的影響」。[renson2025, p.2]\n- EIF 描述估計式的「一階誤差」；使用機器學習時，正是這個誤差使推論失效，所以必須處理它。[renson2025, p.2]\n- EIF 寫成 `φ(O_i, P)`，是單位資料與分布的函數，而且在真實分布 P 下平均值為零。[renson2025, p.2]\n- 例子：Y 的平均 `E[Y]` 的 EIF 是 `Y_i − E[Y]`。[renson2025, p.2]\n- 論文用的推導方法只是「推測」EIF，有三個工具：先假裝資料全是離散變數，把估計目標寫成加總；再用和規則、乘積規則把它拆成較簡單部分的 EIF；最後代入已知的邊際與條件平均的 EIF 並化簡。[renson2025, p.2]\n- 範例估計目標的推測 EIF 是 `I(A=0)/g(W) × (Y − q(W)) + q(W) − ψ`。[renson2025, p.3]\n- 論文假設非參數模型，所以所有 EIF 都是非參數模型下的 EIF。[renson2025, p.2]\n- 變異數：EIF 平方的期望值就是單步估計式的漸近變異數；變異數估計式是估計 EIF 的樣本變異數除以 n。[renson2025, p.5]\n\n## 在各篇怎麼出現\n\n### 在 renson2025 中\n\n- EIF 是第二步的主題，也是單步估計式的原料：估計式 = 代入式 + 估計 EIF 的樣本平均。詳見 [[plug-in-and-one-step-estimators]]。[renson2025, p.3]\n- EIF 的限制：一、推導出來的只是推測，要證明才能確認；二、有些估計目標沒有 EIF，例如連續治療的劑量反應曲線；三、EIF 只有在路徑可微分（pathwise differentiable，導數存在且變異數有限）時才存在。[renson2025, p.3]\n- 論文舉的違反路徑可微分的常見情況：推導出的式子含有「連續變數等於某值」的指示函數、又無法再化簡，例如連續 W 下的條件平均處理效應。[renson2025, p.3]\n\n### williams2024\n\n- williams2024 以 log RR 影響函數（influence function）的樣本變異數估計風險比的變異數。[williams2024, p.5]\n- 這和 renson2025 的第五步（用估計 EIF 的樣本變異數估計變異數）在概念上相近，這是本 wiki 的觀察；williams2024 是否使用「有效影響函數」一詞：來源未提及。\n\n## 常見誤解\n\n- 「推導出來的函數就是真正的 EIF」：論文說這個方法只得到推測的 EIF；通常相符，但不一定。[renson2025, p.3]\n- 「每個估計目標都有 EIF」：連續治療的劑量反應曲線沒有 EIF。[renson2025, p.3]\n- 「有了 EIF 就自動能用機器學習」：論文說，以 EIF 為基礎並不代表一定能給出有效推論，還要證明速率倍增穩健性。[renson2025, p.3]\n\n## 相關頁面\n\n- [[statistical-estimand]]\n- [[plug-in-and-one-step-estimators]]\n- [[rate-double-robustness]]\n- [[nuisance-functions]]\n- 來源頁：[[renson2025]]、[[williams2024]]\n"}, "finite-mixture-subphenotypes": {"title": "有限混合模型與表型（subphenotypes）", "type": "concept", "sources": "[hong2021, bluemlein2022]", "group": "concepts", "md": "\n# 有限混合模型與表型（subphenotypes）\n\n## 直覺（生活比喻）\n\n水果攤老闆不看標籤，只看大小、顏色與軟硬，把一大堆水果自動堆成幾堆：同一堆內部很像，不同堆之間差很多。有限混合模型就是讓電腦做這件事，只是「要分成幾堆」要自己決定，而且每顆水果屬於哪一堆是用「機率」表示的。分出來的每一堆，在醫學上就叫一個「表型」或「亞型」。這個比喻是本 wiki 的說明，不是論文的話。\n\n## 定義\n\n- 有限混合模型（finite mixture modeling, FMM）：論文說它也稱為潛在剖面分析（latent profile analysis, LPA），用來找出 ARF 病人的類別。[hong2021, p.2]\n- 論文在討論處把這個分類稱為非監督式機器學習演算法的應用；FMM 實際輸入了哪些變數、有沒有用到 MP 或死亡：來源未提及。[hong2021, p.5]\n- 論文的用詞：類別（class）、表型（phenotype）、亞型（subtype）。[hong2021, p.1] [hong2021, p.2]\n- 怎麼決定要分成幾類：由模型適配統計與臨床意義共同決定；用 bootstrap 概似比檢定比較 k 類與 k 減 1 類模型；AIC 與 SABIC 越低、entropy 越高越好；最小類別的比例須大於 10%；歸入某一類的最小機率須大於 0.85；最後用 k-means 分群確認。[hong2021, p.2]\n- 論文的結果是 3 類：AIC 與 SABIC 從 2 類一路降到 10 類，沒有自己停在 3 類；4 類到 10 類的最小類別都不到 5% 的病人，entropy 指向 3 類。[hong2021, p.3-4]\n- 論文說這個分類是可詮釋的，因為每一類對應一種臨床表型；這些類別無法完全由 COPD、ARDS、心衰竭或 sepsis 等傳統原因解釋。[hong2021, p.5-6]\n\n| 類別 | 論文的稱呼 | 論文描述的特徵 | 出處 |\n|---|---|---|---|\n| Class 1 | Baseline Class（基線類） | 最大的一類，各變數接近平均。 | [hong2021, p.4] |\n| Class 2 | Critical Class（危急類） | 代謝性酸中毒與組織灌流差；討論處稱為系統性組織低灌流與多重器官功能障礙。 | [hong2021, p.4] [hong2021, p.5] |\n| Class 3 | Refractory Respiratory Failure Class（頑固性呼吸衰竭類） | 即使在通氣下仍有高 PaCO2 與低 PF，其他器官功能相對正常。 | [hong2021, p.4] [hong2021, p.6] |\n\n## 在各篇怎麼出現\n\n### 在 hong2021 中\n\n- 分類是整個研究的第一步，之後類別被當成「會改變 MP 效果的變數」：Cox 迴歸裡有類別與 MP 的交互作用，DTR 的 blip 函數中類別也和 MP 交互。見 [[treatment-effect-heterogeneity]]、[[blip-function]]。[hong2021, p.2] [hong2021, p.3]\n- 結果：MP_static 每增加 5 Joules/min 的死亡風險比，Class 1 最小（1.29），Class 3 最大（1.83）。這是觀察性資料的關聯估計。[hong2021, p.4]\n- 類別會隨通氣天數改變：從 Class 2 轉到 Class 1 的病人較可能存活到出院，Class 3 維持不變；論文用這點說明策略必須隨病況調整，見 [[decision-points-and-history]]。[hong2021, p.4] [hong2021, p.5] [hong2021, p.7]\n- 對照 bluemlein2022（本 wiki 的整理）：因果樹用專為處理效應設計的分裂準則分群，分群時就在看處理效應；hong2021 稱 FMM 為非監督式方法，分好類之後才檢查 MP 的效果是否隨類別而不同。[bluemlein2022, p.8] [hong2021, p.5]\n\n## 常見誤解\n\n- 「分成 3 類是唯一客觀的答案」：論文說 AIC 與 SABIC 一路下降，不會自己停在 3 類；最後靠 entropy、最小類別的比例與臨床意義決定，並用 k-means 確認。[hong2021, p.3] [hong2021, p.2]\n- 「類別就是診斷」：論文說這些類別無法完全由傳統診斷解釋，而且病人的類別會隨時間改變。[hong2021, p.5-6] [hong2021, p.4]\n- 「類別是治療造成的」：論文描述 Class 3 是即使在通氣下仍有高 PaCO2 與低 PF，沒有說這是通氣造成的。[hong2021, p.4]\n- 「這三類在別的醫院、別的資料庫也會出現」：來源未提及；論文只用一個資料庫。[hong2021, p.2]\n- 本 wiki 的觀察（不是論文的話）：方法段設的最小類別比例下限是大於 10%，而 Class 3 在第 0 小時有 759 位、占 8768 位的比例不到十分之一；論文沒有說明比例的分母，所以不能判斷是否違反自己的準則。[hong2021, p.2] [hong2021, p.4]\n\n## 相關頁面\n\n- [[treatment-effect-heterogeneity]]\n- [[blip-function]]\n- [[decision-points-and-history]]\n- [[causal-tree-and-forest]]\n- [[mechanical-power]]\n- 來源頁：[[hong2021]]\n- 名詞速查：[[glossary]]\n"}, "identification-assumptions": {"title": "因果識別的前提假設", "type": "concept", "sources": "[williams2024, renson2025, bluemlein2022, hong2021, desman2025]", "group": "concepts", "md": "\n# 因果識別的前提假設\n\n## 直覺（生活比喻）\n\n要公平比較兩個補習班，至少要滿足三件事：紀錄上寫的成績就是學生真實拿到的（一致性）；影響「去哪個班」又影響成績的因素都被考慮進來（沒有漏掉的共同原因）；每種背景的學生都有機會進入兩個班（不然那種學生根本無從比較）。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n論文在說明 [[blip-function]] 的因果寫法與觀察資料寫法為何相等時，列出三個假設：[williams2024, p.3]\n\n- 一致性（consistency）：一個觀察值在其實際接受的治療水準下，反事實結局就是我們真正觀察到的結局。[williams2024, p.3]\n- 無未測量干擾，也叫可交換性（no unmeasured confounding / exchangeability）：所有同時影響暴露與結局的共同原因都已被測量並調整。[williams2024, p.3]\n- 正值性（positivity）：在所有層（strata）內，經歷各個治療水準的機率都不為零。[williams2024, p.3]\n\n與時間變動規則有關的額外條件：\n\n- 所有規則都必須在資料中有支持，也就是要觀察到有人照每條規則做過。[williams2024, p.3]\n- 一致估計最佳規則下的平均結局及其信賴區間，除了上述標準假設外，論文轉介讀者看 van der Laan 與 Luedtke 的技術細節。[williams2024, p.4]\n- 論文用直覺描述其中幾項：結局迴歸與傾向分數要估得正確；被估計的函數要「夠平滑」（可以用樣本分割繞過）；blip 函數不可為零，也就是 `P(B(V) = 0) = 0`。[williams2024, p.4]\n\n## 在各篇怎麼出現\n\n### williams2024\n\n- 範例中把可能同時影響劑量增加與結局的變數當作干擾因子調整，名單見 [[williams2024]]（資料與情境）。[williams2024, p.5]\n- 範例資料來自試驗的 BUP-NX 組，劑量與調整依臨床判斷開立；因此「劑量增加」本身並非隨機指派。[williams2024, p.5]\n- 漏訪與拒絕尿檢視為鴉片使用陽性，論文稱之為合理假設。[williams2024, p.5]\n- 這些假設在範例資料中是否成立、如何檢驗：來源未提及。\n\n### 在 renson2025 中\n\n- renson2025 用同樣三個假設來識別範例的因果參數（不治療時的期望潛在結局）：條件可交換性 `Y^0 ⊥ A | W`；正值性 `f(w) > 0 ⇒ Pr(A=0 | W=w) > 0`；因果一致性 `A=a ⇒ Y=Y^a`。[renson2025, p.2]\n- 在這個例子裡，正值性只寫成「不接受治療」這一側的機率要大於零。[renson2025, p.2]\n- 三個假設成立時，因果參數等於統計估計目標 `E[Y^0] = E(E(Y | W, A=0))`，見 [[statistical-estimand]]。[renson2025, p.2]\n- 論文指出：若識別依賴較少見的假設，可能還沒有現成的估計式，這是需要自己推導估計式的情況之一。[renson2025, p.1]\n- 論文認為，流行病學家常走在最前面，負責定義新問題、翻成因果參數，並提出合理的識別假設。[renson2025, p.1]\n- 估計階段還需要一個「溫和條件」，是一種正值性：g 與 ĝ 都介於 `(ε, 1 − ε)`，ε 大於零。詳見 [[rate-double-robustness]]。[renson2025, p.4]\n- 這些假設在實際資料中如何檢驗：來源未提及。\n\n### 在 bluemlein2022 中\n\n- 論文列出四個假設：一致性、穩定單位處理值假設（SUTVA，一位病人的潛在結局與其他病人的治療指派無關）、正值性、序列可交換性（sequential exchangeability）。[bluemlein2022, p.5]\n- 正值性：對任何可能的病史，治療指派都不是確定性的。[bluemlein2022, p.6]\n- 序列可交換性：以病史為條件，就足以移除估計 HTE 時的干擾偏誤。[bluemlein2022, p.6]\n- 與 williams2024 的三個假設相比，這裡多列了 SUTVA，並把可交換性寫成「每個時間步、以病史為條件」的序列版本。[williams2024, p.3] [bluemlein2022, p.5]\n- 實作上，各方法都把整段病史放進模型，以模仿「控制所有治療前變數、試圖滿足序列可交換性」的做法。[bluemlein2022, p.12-13]\n- 真實資料的檢查：論文用 Blackwell（2014）的因果敏感度分析，改變未測量干擾的強度與方向；多數時間步的估計不隨之改變，只有第一個時間步似乎有些敏感。[bluemlein2022, p.25]\n- 這個檢查的限制：只能對線性、逆傾向分數加權的結局模型進行，不是對 DTR-CT 或 DTR-CF 本身；估計的是治療者的平均處理效應，不是個人層級的 HTE。[bluemlein2022, p.25]\n- 作者推測樹與森林可能比線性模型更不受未測量干擾影響；這是推測，論文沒有檢驗。[bluemlein2022, p.25]\n- 模擬資料中的假設是否成立：模擬資料依自己設定的資料生成過程產生，其他細節見附錄；各假設的檢驗：來源未提及。[bluemlein2022, p.11]\n\n### 在 hong2021 中\n\n- 論文沒有列出或討論一致性、正值性、可交換性這幾個識別假設：來源未提及。\n- 論文做的調整：模型納入年齡、呼吸速率、收縮壓、心率、類別、血氣與實驗室指標等協變數，選擇依據是專家意見與臨床意義；ΔMP 危險因子的分析也說明是在調整可能的干擾因子之後。[hong2021, p.2] [hong2021, p.3] [hong2021, p.5]\n- 資料是單一醫院資料庫的回溯性分析，免除知情同意。[hong2021, p.2]\n- 實際 MP 為何因人而異（誰決定、依什麼調整）：來源未提及；最佳 MP 是否落在資料中真有人使用過的範圍：來源未提及。\n- 除了 hot deck 對補值的敏感度分析（結果未顯示）外，沒有看到對未測量干擾的敏感度分析：來源未提及。[hong2021, p.2]\n\n### 在 desman2025 中\n\n- 論文沒有列出或討論一致性、正值性、可交換性，也沒有討論未測量干擾：來源未提及。\n- 資料是回溯性的觀察資料：醫師依醫院流程與個人經驗給胰島素，並不是隨機分派。[desman2025, p.1] [desman2025, p.7]\n- 本 wiki 的對照（不是論文的話）：williams2024 說所有規則都必須在資料中有支持；desman2025 的 CQL 懲罰資料分布之外的行動，避免在資料覆蓋不足處高估，每小時 10 單位的上限也是類似的防線。這處理的是「資料裡沒人做過」的問題，但論文沒有使用正值性這個詞：來源未提及。見 [[offline-reinforcement-learning]]。[williams2024, p.3] [desman2025, p.8] [desman2025, p.9]\n- 論文做的穩健性檢查：以外部驗證資料（eICU-CRD）重做評估，並比較被排除病人的建議分布；兩者都不是對因果假設的檢查。[desman2025, p.2] [desman2025, p.6]\n- 補值（前一個值往後填、再用 k 近鄰法）的敏感度分析：來源未提及。[desman2025, p.8]\n\n## 常見誤解\n\n- 「資料來自隨機試驗，所以所有假設自動成立」：論文的 BUP-NX 組內，劑量調整是依臨床判斷，而不是隨機分派，所以仍以干擾因子調整。[williams2024, p.5]\n- 「這三個假設是模型自己會檢查的」：來源未提及任何檢查它們的方法。\n\n## 相關頁面\n\n- [[blip-function]]\n- [[doubly-robust-learner]]\n- [[decision-points-and-history]]\n- [[statistical-estimand]]\n- [[rate-double-robustness]]\n- [[backward-recursion]]\n- [[offline-reinforcement-learning]]\n- [[off-policy-evaluation]]\n- 來源頁：[[williams2024]]、[[renson2025]]、[[bluemlein2022]]、[[hong2021]]、[[desman2025]]\n"}, "interpretability": {"title": "可解釋性（interpretable 與 explainable）", "type": "concept", "sources": "[bluemlein2022, williams2024, desman2025]", "group": "concepts", "md": "\n# 可解釋性（interpretable 與 explainable）\n\n## 直覺（生活比喻）\n\n可詮釋（interpretable）像是把食譜直接攤在桌上，每一步你都看得到；可說明（explainable）像是廚房是黑盒子，但服務生會告訴你「這道菜主要靠哪幾種食材」。兩種都讓你比較放心，但放心的程度不同。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 論文說，把降低 DTR 不透明程度的方法稱為「explainable」。[bluemlein2022, p.2]\n- 論文也提到有些作者做區分：決策邏輯本身透明稱為 interpretable；靠替代模型提供洞察稱為 explainable。在這個用詞下，DTR-CT 屬於 interpretable，DTR-CF 屬於 explainable。[bluemlein2022, p.2]\n- 為什麼重要：論文說，在醫療決策與個人化醫療中，對個別病人治療決定的依據必須透明且好懂。[bluemlein2022, p.2]\n- DTR-CT：每個時間步都可以把決策樹畫出來，看哪些變數解釋了處理效應在病人之間的差異，供醫師檢視。[bluemlein2022, p.10]\n- DTR-CF：每個時間步可以檢視變數重要性，看哪些變數對治療決定最具指示性。[bluemlein2022, p.11]\n- 對照：古典線性方法好解釋但結構簡單；機器學習路線多為黑箱；強化學習多以深度學習或神經網路為基礎，不易解釋。[bluemlein2022, p.2] [bluemlein2022, p.4]\n\n## 在各篇怎麼出現\n\n### 在 bluemlein2022 中\n\n- 真實資料的樹（Fig. 3）：分裂變數包含舒張壓、心率、收縮壓與呼吸速率；每片葉子標示該亞群的估計處理效應與對應的最佳決定。論文說醫師可以拿這棵樹對照臨床做法與領域知識。[bluemlein2022, p.16-17]\n- 真實資料的變數重要性（Fig. 4，只展示一個時間步）：是否使用機械通氣，主要依據前兩個時間步的呼吸速率與血氧；是否使用血管加壓素，則以前兩個時間步的平均血壓與收縮壓最重要。作者說這符合醫學知識，因此增加結果的可信度。[bluemlein2022, p.17]\n- 作者承認：即使學出的規則沒有涵蓋臨床做法的所有細節，仍可能是有用的個人化決策支援。[bluemlein2022, p.17]\n- 臨床人員是否實際評估過這些樹與重要性圖：來源未提及。\n\n### williams2024\n\n- 論文提到用決策樹估計 blip 函數，可得到好解讀的決策規則。[williams2024, p.4]\n\n### renson2025\n\n- 來源未提及可解釋性。\n\n### 在 desman2025 中\n\n- 論文用 SHAP（具體是排列式 SHAP）事後估計各特徵對模型輸出的貢獻，目的是了解模型的表徵、確保臨床可解釋性。[desman2025, p.3] [desman2025, p.10]\n- 結果：近期與歷史血糖最重要，其次是病人嚴重度的指標（機械通氣、SOFA 分數、Elixhauser 共病指數、手術類型）；論文說這與臨床直覺相符，顯示模型使用臨床相關的資訊。[desman2025, p.3]\n- 另一個為了可讀性的設計：建議劑量四捨五入到整數。[desman2025, p.9]\n- 本 wiki 的對照（不是論文的話）：照 bluemlein2022 的用詞，靠事後方法提供洞察屬於 explainable，決策邏輯本身透明才是 interpretable；GLUCOSE 是神經網路加 SHAP，屬於前者。論文自己沒有做這個區分：來源未提及。[bluemlein2022, p.2] [desman2025, p.9]\n- bluemlein2022 說強化學習多以深度學習為基礎、不易解釋；desman2025 走的是這條路線，並以 SHAP 補充說明。[bluemlein2022, p.2] [bluemlein2022, p.4] [desman2025, p.10]\n- SHAP 圖（補充圖）的數值不在文字中：來源未提及。\n\n## 常見誤解\n\n- 「可說明就等於可詮釋」：論文自己的用詞把兩者分開，DTR-CF 只算可說明。[bluemlein2022, p.2]\n- 「變數重要就代表因果上重要」：這是本 wiki 的提醒，不是論文的話；論文只說這些變數對估計的處理效應差異最具指示性，並以醫學知識「看起來合理」作旁證。[bluemlein2022, p.17]\n- 「可解釋所以比較準」：論文的比較只納入可解釋或前人用過的基準，沒有和不可解釋的方法比較。[bluemlein2022, p.18]\n\n## 相關頁面\n\n- [[causal-tree-and-forest]]\n- [[treatment-effect-heterogeneity]]\n- [[dynamic-treatment-regime]]\n- [[blip-function]]\n- [[reinforcement-learning-mdp]]\n- 來源頁：[[bluemlein2022]]、[[williams2024]]、[[desman2025]]\n- 名詞速查：[[glossary]]\n"}, "mechanical-power": {"title": "機械功率（mechanical power）", "type": "concept", "sources": "[hong2021]", "group": "concepts", "md": "\n# 機械功率（mechanical power）\n\n## 直覺（生活比喻）\n\n開車時，只看「油門踩多深」或「瞬間最高時速」都不夠，真正累積磨損的是「一段時間內引擎總共出了多少力」。呼吸器也是：潮氣量、壓力、呼吸速率各是一個旋鈕，機械功率把它們合成一個「單位時間內灌進肺裡的總力道」的數字。這個比喻是本 wiki 的說明，不是論文的話；論文本身沒有用「力道」這樣的說法。\n\n## 定義\n\n- 機械通氣（mechanical ventilation, MV）：重症急性呼吸衰竭病人常需要的侵入性通氣，能維持氣體交換，但本身也可能造成肺損傷。[hong2021, p.1]\n- 保護性通氣：限制潮氣量、平台壓與驅動壓，用來減少通氣造成的肺損傷；指引常見的數值建議是 ARDS 病人潮氣量小於 6 ml/kg、平台壓小於 30 cmH2O。[hong2021, p.1]\n- 機械功率（mechanical power, MP）：把平台壓、呼吸速率與呼氣末正壓（PEEP）等幾個機械參數合成一個數字。論文引用的研究說 MP 能提供較好的肺損傷預測；比較的對象，論文未說明：來源未提及。[hong2021, p.1]\n- 單位是 Joules/min，論文以「每增加 5 Joules/min」報告風險比。[hong2021, p.1]\n- 兩個版本：動態 MP（MP_dynamic）與靜態 MP（MP_static）。公式由呼吸速率、潮氣量、峰值吸氣壓、平台壓與 PEEP 算出；文字萃取中的公式有亂碼，本 wiki 不重述。[hong2021, p.2]\n- 靜態 MP 與存活的關聯比動態 MP 強（靜態的風險比一貫較高），所以 DTR 那一步只最佳化 MP_static。[hong2021, p.3]\n- 數值感：整體中位數，靜態 MP 為 14.8（IQR 11.6 至 19.5）、動態 MP 為 12.9（IQR 10.2 至 16.9）Joules/min。[hong2021, p.3]\n\n## 在各篇怎麼出現\n\n### 在 hong2021 中\n\n- MP 是 DTR 裡被調整的「劑量」：論文為每位病人在前 48 小時、每 8 小時的各個時間點估計最佳 MP。[hong2021, p.2-3]\n- 實際 MP 減最佳 MP 記為 ΔMP：ΔMP 等於零代表實際用的就是最佳值，小於零是通氣不足（hypoventilation），大於零是過度通氣（over ventilation）；ΔMP 大於 5 Joules/min 在圖說中稱為 hyperventilation。[hong2021, p.5] [hong2021, p.8]\n- ΔMP 分成 very low、low、optimal、high、very high 五類，切點為 10、5、5、10 Joules/min。[hong2021, p.4]\n- 最佳 MP_static 因類別而異，數值與單位的疑點見 [[hong2021]]；類別的來源見 [[finite-mixture-subphenotypes]]。[hong2021, p.4]\n- 關聯估計（觀察性資料）：MP_static 每增加 5 Joules/min，死亡風險比在 Class 1 為 1.29、在 Class 3 為 1.83。[hong2021, p.1]\n- ΔMP 偏低或偏高都與住院死亡風險增加有關（OR 分別為 1.08 與 1.07）。[hong2021, p.4]\n\n## 常見誤解\n\n- 「MP 越低越好」：論文不是這個意思。論文的說明是，高 MP 可能造成肺損傷，但低於最佳值的 MP 可能造成通氣不足，導致二氧化碳滯留與氧氣供應不足，這兩者是已知的死亡危險因子；結果上偏低與偏高的 ΔMP 都與較高的死亡風險有關。[hong2021, p.5]\n- 「所有人的最佳 MP 都一樣」：論文估出的最佳 MP_static 在三個類別不同，Class 3 的較低、Class 2 的較高。[hong2021, p.4]\n- 「MP 是呼吸器上一個可以直接轉的旋鈕」：論文說 MP 是由多個機械參數組合算出的，要調哪個參數才能改變 MP：來源未提及。[hong2021, p.1]\n- 「最佳 MP 就是指引的標準」：指引常見的建議是潮氣量與平台壓的上限，不是 MP；論文的最佳 MP 是模型估出來的目標。[hong2021, p.1] [hong2021, p.8]\n- 「論文證明降低 MP 能降低死亡」：論文的結果是風險比與勝算比這類關聯，論文自己說還需要對照試驗來檢驗。[hong2021, p.7]\n\n## 相關頁面\n\n- [[dynamic-treatment-regime]]\n- [[optimal-dynamic-treatment-rule]]\n- [[finite-mixture-subphenotypes]]\n- [[blip-function]]\n- 來源頁：[[hong2021]]\n- 名詞速查：[[glossary]]\n"}, "nuisance-functions": {"title": "干擾函數（nuisance function）", "type": "concept", "sources": "[renson2025, williams2024, bluemlein2022]", "group": "concepts", "md": "\n# 干擾函數（nuisance function）\n\n## 直覺（生活比喻）\n\n蓋房子時，你真正想要的是房子，但得先搭鷹架。鷹架本身不是目的，卻決定房子蓋得穩不穩。干擾函數就是統計估計裡的鷹架：我們不是為了它們而分析，但最後答案好不好，要看它們搭得準不準。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 論文把結局迴歸（outcome regression）與傾向分數（propensity score）當作干擾函數的例子。[renson2025, p.1]\n- 在範例估計目標中有兩個干擾函數：`q(W) = E[Y | W, A=0]` 是條件結局期望，`g(W) = Pr(A=0 | W)` 是傾向分數。[renson2025, p.3]\n- 估計時用 `P̂` 表示對資料分布各部分的估計，包含條件結局期望、W 的經驗分布與傾向分數；代入式估計式雖然不用傾向分數，論文為了後面的符號仍把它列進去。[renson2025, p.3]\n- 實作方式：把治療與結局各自對共變數做迴歸（可以用機器學習），得到 `ĝ(W_i)` 與 `q̂(W_i)`。[renson2025, p.3]\n- 用機器學習估計干擾函數，好處是可以避開沒有科學根據的模型假設。[renson2025, p.1]\n- 難處是：許多機器學習演算法（例如隨機森林、提升樹）的收斂速率慢於 `√n`。[renson2025, p.4]\n- 因此干擾函數估得多快、多準，決定了估計式能不能給出有效推論。見 [[rate-double-robustness]]。[renson2025, p.4]\n\n## 在各篇怎麼出現\n\n### 在 renson2025 中\n\n- 干擾函數是全文的主角：第三步到第四步都在處理「干擾函數用機器學習估計」會造成什麼問題。[renson2025, p.3-4]\n- 對代入式估計式而言，誤差是干擾估計式的「平均誤差」；對速率倍增穩健的估計式，誤差是兩個干擾估計式誤差的乘積。[renson2025, p.3]\n\n### williams2024\n\n- williams2024 中對應的兩個函數是結局迴歸 Q(H, A) 與傾向分數 g(A, H)；論文用交叉擬合的超級學習器估計它們。[williams2024, p.3]\n- 兩篇的對應是本 wiki 的整理；williams2024 本身是否使用「干擾函數」一詞：來源未提及。\n\n### 在 bluemlein2022 中\n\n- 論文中對應的輔助估計是傾向分數與結局模型：傾向分數以邏輯斯迴歸估計，原則上任何機率分類器都可以用。[bluemlein2022, p.7]\n- 結局模型在 DTR-CT 與 DTR-CF 中由因果樹或因果森林擔任；森林版以「袋外」預測結局與傾向分數。[bluemlein2022, p.9]\n- 古典基準方法把結局模型拆成「沒有治療時的模型」與「治療交互作用模型」兩塊，兩塊都以整段病史迴歸。[bluemlein2022, p.22]\n- 論文是否使用「干擾函數」一詞：來源未提及；這裡的對應是本 wiki 的整理。\n\n## 常見誤解\n\n- 「干擾函數不重要，反正是輔助」：它們的誤差決定推論是否有效。[renson2025, p.4]\n- 「干擾函數就是干擾因子」：這是本 wiki 的提醒，不是論文的話。williams2024 的「干擾因子」（confounder）是影響治療與結局的變數，干擾函數是需要估計的迴歸函數；論文並未討論兩個詞的差別，來源未提及。\n- 「一定要用機器學習估計」：論文說有些機器學習演算法夠快，連 g 計算法或 IPW 估計式也能容納；一般的做法只是在需要彈性時使用。[renson2025, p.5]\n\n## 相關頁面\n\n- [[statistical-estimand]]\n- [[efficient-influence-function]]\n- [[plug-in-and-one-step-estimators]]\n- [[rate-double-robustness]]\n- [[cross-fitting]]\n- [[doubly-robust-learner]]\n- [[causal-tree-and-forest]]\n- 來源頁：[[renson2025]]、[[williams2024]]、[[bluemlein2022]]\n"}, "off-policy-evaluation": {"title": "離線策略評估（OPE）與擬合 Q 評估（FQE）", "type": "concept", "sources": "[desman2025, williams2024]", "group": "concepts", "md": "\n# 離線策略評估（OPE）與擬合 Q 評估（FQE）\n\n## 直覺（生活比喻）\n\n想知道「如果全校都改用新的上學路線，平均通學時間會變多少」，但不可能真的叫全校改路線。只能拿過去大家走舊路線的紀錄，用一個模型去推估走新路線會怎樣。推估出來的是「估計」，不是實測。離線策略評估（off-policy evaluation, OPE）做的就是這種推估。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- OPE：不實際施行新策略，而是從既有資料估計學到的策略的表現。論文用它來估計 GLUCOSE 的表現。[desman2025, p.9]\n- 擬合 Q 評估（fitted Q evaluation, FQE）：論文採用的 OPE 方法。論文說它能處理學到的策略與觀察到的行為差異很大的情況，也能處理隨機性，並在多個醫療基準上顯示出一致性與校準。這是作者引用文獻的說法。[desman2025, p.9]\n- 信賴區間：對所有病程（episode）重抽樣、取後放回 10,000 次，得到 95% 信賴區間。[desman2025, p.9]\n- 比較的方式：圖中實線是 GLUCOSE 經 OPE 得到的估計表現，虛線是觀察到的醫師行為的表現；挑選模型時，拿 GLUCOSE 信賴區間的下界與醫師信賴區間的上界比。[desman2025, p.2] [desman2025, p.4]\n- 結果：GLUCOSE 的估計報酬在內部測試為 0.0（−0.07 至 0.06）、外部驗證為 −0.63（−0.74 至 −0.52）；醫師的報酬分別為 −1.29（−1.37 至 −1.20）與 −1.02（−1.16 至 −0.89）。[desman2025, p.2]\n- 做不到的情況：eICU-CRD 中胰島素紀錄含糊、被排除的病人，因為 OPE 與直接比較都需要準確的胰島素給藥紀錄，所以無法做。[desman2025, p.6]\n\n## 在各篇怎麼出現\n\n### 在 desman2025 中\n\n- OPE 是整個研究的主要評估：GLUCOSE 的估計報酬在兩個資料集都高於醫師的報酬。[desman2025, p.2]\n- 論文把 OPE 的全名在正文寫成 off-policy evaluation，在方法段寫成 offline policy estimation；本 wiki 照記，不判斷。[desman2025, p.2] [desman2025, p.9]\n- 本 wiki 的讀法（不是論文的話）：報酬是作者自訂的計分尺度，所以這些數字不是臨床單位；醫師的報酬是觀察到的，GLUCOSE 的是估計出來的，兩邊的算法不同。[desman2025, p.2] [desman2025, p.9]\n- OPE 需要哪些前提才能當成因果估計（例如不能有未測量干擾）：來源未提及。見 [[identification-assumptions]]。\n\n### 與 williams2024 的對照（本 wiki 的整理）\n\n- williams2024 在範例中估計各規則之下結局的價值並給信賴區間，見 [[optimal-dynamic-treatment-rule]]；OPE 回答的是同一類問題：「若依這條規則做，平均結局會怎樣」。但論文沒有把兩者並論，所用的估計式也不同：來源未提及。[williams2024, p.6]\n\n## 常見誤解\n\n- 「OPE 的結果等於把策略在病人身上試過」：不是。論文自己說這是回溯性研究，需要前瞻性研究與臨床試驗驗證。[desman2025, p.7]\n- 「報酬 0.0 代表血糖完美」：0.0 是作者設計的獎勵尺度上的一個數字，最高獎勵是 +0.2，所以 0.0 只表示在這個計分下的平均表現。[desman2025, p.2] [desman2025, p.9]\n- 「估計報酬高就是比醫師好」：論文用「顯著改善」描述，依據是信賴區間下界高於醫師的上界；它仍是對自己建議的離線估計。[desman2025, p.2]\n\n## 相關頁面\n\n- [[reinforcement-learning-mdp]]\n- [[offline-reinforcement-learning]]\n- [[optimal-dynamic-treatment-rule]]\n- [[regret-and-decision-accuracy]]\n- [[identification-assumptions]]\n- 來源頁：[[desman2025]]、[[williams2024]]\n- 名詞速查：[[glossary]]\n"}, "offline-reinforcement-learning": {"title": "離線強化學習與保守 Q 學習（CQL）", "type": "concept", "sources": "[desman2025, bluemlein2022]", "group": "concepts", "md": "\n# 離線強化學習與保守 Q 學習（CQL）\n\n## 直覺（生活比喻）\n\n想學開車，但不能真的上路，只能看很多位駕駛留下的行車紀錄。紀錄裡大家常走的路，你可以學得很準；但紀錄裡沒人走過的岔路，你就算「覺得」那條路更快，也沒有證據。保守的做法是：對沒人走過的選項打折，寧可選紀錄裡有佐證的好選項。離線強化學習做的就是這件事。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 離線強化學習（offline RL）：代理從固定的資料集學習，過程中不再與環境互動。[desman2025, p.2]\n- 論文說，傳統的離線 RL 受限於只看期望獎勵，常忽略病人反應的不確定性，因此可能得到不理想的治療方案，也可能無法照顧不同行動的風險差異。這個缺點由 [[distributional-reinforcement-learning]] 補。[desman2025, p.2]\n- 離線 RL 本身帶有抽樣與隨機訓練的偏差；論文因此照前人做法訓練多個模型，直到看不到顯著進步，最後訓練了 200 個獨立模型再從中挑一個。[desman2025, p.2]\n- 保守 Q 學習（conservative Q learning, CQL）：一種離線 RL 演算法，在建議臨床行動的同時，對學到的策略做正則化，以減輕在資料覆蓋不足或超出資料分布的狀態與行動組合上的高估。[desman2025, p.8]\n- 論文選 CQL 而不選其他離線方法（BCQ、BRAC、TD3 加 BC）的理由：它明確且保守地對學到的策略做正則化，懲罰資料分布之外的行動，同時仍允許有策略性的推廣。[desman2025, p.8]\n- 為什麼適合胰島素：胰島素管理是高風險決策、治療指數窄；CQL 的保守做法讓策略維持在資料中看得到的安全且高報酬的行動上，降低外推到沒有資料支持之組合的風險。[desman2025, p.8]\n- 論文另用一種批次抽樣策略，避免策略被低報酬的行動過度正則化，讓學到的策略反映更多高報酬的軌跡。[desman2025, p.9]\n- 論文還加了人為的安全措施：建議與觀察的劑量都以每小時 10 單位為上限，並強調需要醫師在迴路中。[desman2025, p.9]\n- 論文宣稱這是醫療領域第一次把 CQL 與分布式 Q 函數整合；這是作者的說法，本 wiki 沒有核對。[desman2025, p.9]\n\n## 在各篇怎麼出現\n\n### 在 desman2025 中\n\n- GLUCOSE 的核心演算法就是 CQL 加分布式的部分，網路為三層隱藏層的多層感知器，以 d3rlpy 實作。[desman2025, p.9]\n- 論文說明選 CQL 的理由，但在正文沒有報告它與其他離線 RL 方法的比較結果：來源未提及。[desman2025, p.8]\n- 論文沒有解釋 Q 函數是什麼：來源未提及。\n\n### 在 bluemlein2022 中\n\n- bluemlein2022 把強化學習歸為另一條路線，多以深度學習為基礎；本 wiki 的該來源頁沒有記載離線 RL 或 CQL。[bluemlein2022, p.2] [bluemlein2022, p.4]\n\n## 常見誤解\n\n- 「CQL 的 Q 學習就是 [[q-learning-dwols-g-estimation]] 那個 Q 學習」：名字相同，但論文沒有說明兩者的關係：來源未提及；bluemlein2022 則把 Q 學習歸為來自統計學的線性迴歸式古典方法，與多以深度學習為基礎的強化學習是不同路線。[bluemlein2022, p.4] [bluemlein2022, p.22]\n- 「保守就等於安全」：論文只說 CQL 有助於讓策略維持在資料支持的行動上；是否在真實病人身上安全，論文說還需要前瞻性試驗。[desman2025, p.7] [desman2025, p.8]\n- 「離線學的策略可以直接和醫師比」：策略只在資料裡學，所以要靠 [[off-policy-evaluation]] 估計它的表現，而這個估計仍不是實際施行的結果。[desman2025, p.9]\n\n## 相關頁面\n\n- [[reinforcement-learning-mdp]]\n- [[distributional-reinforcement-learning]]\n- [[off-policy-evaluation]]\n- [[identification-assumptions]]\n- [[q-learning-dwols-g-estimation]]\n- 來源頁：[[desman2025]]、[[bluemlein2022]]\n- 名詞速查：[[glossary]]\n"}, "optimal-dynamic-treatment-rule": {"title": "最佳動態治療規則（ODTR）與規則的價值", "type": "concept", "sources": "[williams2024, bluemlein2022, hong2021, desman2025]", "group": "concepts", "md": "\n# 最佳動態治療規則（ODTR）與規則的價值\n\n## 直覺（生活比喻）\n\n把每一種可能的「補習安排」都當成一個候選計畫：週一誰去、週三誰不去。最佳計畫就是「全班平均成績最好」的那一個。要比較計畫，得先知道「如果照這個計畫做，平均會怎樣」，這個平均就是規則的「價值」。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 所有可能的動態規則所成的集合記為 D；其中讓族群受益最大的那一條稱為最佳動態治療規則（optimal dynamic treatment rule, ODTR）。[williams2024, p.2]\n- 「受益」的定義：對某個以共變數值 V = v 描述的子群，若「接受治療時」的（可能觀察不到的）反事實結局（counterfactual outcome）比「沒接受治療時」更大（結局是好事時）或更小（結局是壞事時），就算有益。[williams2024, p.2]\n- 規則的價值：在規則 d 之下的反事實結局期望值 `E[Yd]`；ODTR 是在所有規則中讓它最大（好結局）或最小（壞結局）的規則。[williams2024, p.2]\n- 時間變動的版本：ODTR 是一串規則，使整串規則之下的反事實結局期望值最大或最小。[williams2024, p.3]\n- 目標參數 ψ：照最佳規則治療時的反事實結局平均值，也就是「即使與實際觀察到的不同，假如治療是依最佳規則指派，平均結局會是多少」。[williams2024, p.3]\n- 估計 ODTR 的方法大致分兩類：以條件平均處理效應迴歸為基礎（最常見的是 Q-learning 與 A-learning），以及直接估計規則的分類方法（outcome-weighted learning 等）。[williams2024, p.3]\n\n## 在各篇怎麼出現\n\n### williams2024\n\n- 論文用 ODTR 的語言提出兩類研究問題：只看單一時間點的「用收案（intake）時蒐集的資訊決定哪些病人在 1 個月後加量」，以及時間變動的「每週決定要不要加量」。[williams2024, p.3]\n- 範例中學出的 ODTR 對應的價值估計是 0.324（95% CI, 0.261-0.38），固定劑量規則是 0.388（95% CI, 0.358-0.419），動態規則 d1 是 0.348（95% CI, 0.327-0.369）。[williams2024, p.6]\n- 學出的規則在範例中變成「每週加量（第 3 週除外）」，論文認為這在只看前 6 週的設定下不令人意外。[williams2024, p.6]\n- 作者提到「ODTR 集成」（ODTR ensembles）：讓回歸類、分類類與簡單靜態策略一起「競爭」，由資料自適應地選出最佳策略。[williams2024, p.6]\n\n### 在 bluemlein2022 中\n\n- 論文的估計目標是最佳 DTR：在所有可能 DTR 的集合中，讓規則的價值（若人人依該規則治療，結局的母體平均）最大的那一條。[bluemlein2022, p.5]\n- 論文以潛在結局架構（Neyman 1923；Rubin 1974）表達，結局以「越大越好」為準（不失一般性）。[bluemlein2022, p.5] [bluemlein2022, p.4]\n- 作者宣稱這是第一篇把因果樹方法用來學最佳 DTR 的論文。[bluemlein2022, p.1]\n- 評估方式：模擬資料有真值，用後悔值與決策準確度；真實資料用期望增益。見 [[regret-and-decision-accuracy]]。[bluemlein2022, p.13] [bluemlein2022, p.16]\n- 論文報告的是上述指標，沒有報告學出規則之價值（平均結局）的估計與信賴區間：來源未提及。\n- 估計 ODTR 的另一類做法（Q 學習等古典迴歸式方法）見 [[q-learning-dwols-g-estimation]]。\n\n### 在 hong2021 中\n\n- 論文要學的最佳規則：在前 48 小時、每 8 小時的各時間點，為每位病人估計最佳的靜態機械功率（MP_static），使最終死亡結局最好；論文只最佳化 MP_static，理由是它與存活的關聯比 MP_dynamic 強。[hong2021, p.2-3]\n- 學出的最佳 MP_static 在三個類別不同：Class 1 為 14.6 ± 9.1，Class 2 為 17.2 ± 8.9，Class 3 為 13.0 ± 8.2；論文印的單位是 ml/cmH2O，與機械功率的單位 Joules/min 不一致，± 後的數字是不是標準差：來源未提及。[hong2021, p.4]\n- 論文把最佳 MP 稱為「目標」：實務上重度肺損傷病人為了氣體交換，未必能降到那個水準；調整到模型選出的水準是否改善結局，論文說尚待驗證。[hong2021, p.8]\n- 論文沒有報告「若人人照最佳規則」的平均結局估計（規則的價值）或其信賴區間：來源未提及。它的檢查方式是比較實際值與最佳值的差距和死亡的關聯，見 [[regret-and-decision-accuracy]]。[hong2021, p.3]\n- 與前面來源的對照（本 wiki 的整理）：williams2024 估計規則價值並給信賴區間，bluemlein2022 在真實資料用期望增益；hong2021 兩者都沒有，只有關聯式的檢查。整理在 [[method-comparison]]。\n\n### 在 desman2025 中\n\n- 論文要學的最佳策略：讓累積獎勵最大的每小時胰島素劑量策略；共訓練 200 個模型，挑出在內部測試集上、估計報酬 95% 信賴區間下界最高的一個。[desman2025, p.2] [desman2025, p.9]\n- 規則的「價值」：論文用離線策略評估來估計，見 [[off-policy-evaluation]]。GLUCOSE 的估計報酬在內部測試為 0.0（−0.07 至 0.06）、外部驗證為 −0.63（−0.74 至 −0.52）；醫師的報酬為 −1.29（−1.37 至 −1.20）與 −1.02（−1.16 至 −0.89）。[desman2025, p.2]\n- 論文沒有使用「ODTR」「規則的價值」這些詞：來源未提及。本 wiki 的對照（不是論文的話）：估計報酬相當於規則的價值，但報酬是作者自訂的尺度（最高 +0.2、最低 −1），不是結局的原始單位。[desman2025, p.9]\n- 論文用「顯著改善」「優於醫師」等字眼，但那是對自己建議的離線估計；論文自己說需要前瞻性研究與臨床試驗驗證。[desman2025, p.2] [desman2025, p.7]\n- 與 williams2024 的對照：兩者都估計「依這條規則做」的平均表現並給信賴區間；williams2024 用倍增穩健的估計，desman2025 用擬合 Q 評估，論文沒有把兩者並論。[williams2024, p.6] [desman2025, p.9]\n\n## 常見誤解\n\n- 「最佳」是指在族群平均意義上讓反事實結局最好；論文並沒有保證學出的規則一定贏過臨床規則：與 d1 的比較，論文說差異不具意義（RR = 0.93; 95% CI, 0.77-1.13）。[williams2024, p.6]\n- 最佳規則不一定複雜：論文指出最佳策略也可能其實是簡單的靜態規則。[williams2024, p.6]\n- 估計 ψ 是另一件事：論文提到可以用標靶最小損失估計（targeted minimum loss-based estimation）或倍增穩健轉換的估計式；一致估計 ψ 與其信賴區間還需要額外條件，見 [[identification-assumptions]]。[williams2024, p.4]\n\n## 相關頁面\n\n- [[dynamic-treatment-regime]]\n- [[decision-points-and-history]]\n- [[blip-function]]\n- [[doubly-robust-learner]]\n- [[regret-and-decision-accuracy]]\n- [[q-learning-dwols-g-estimation]]\n- [[mechanical-power]]\n- [[off-policy-evaluation]]\n- 來源頁：[[williams2024]]、[[bluemlein2022]]、[[hong2021]]、[[desman2025]]\n"}, "plug-in-and-one-step-estimators": {"title": "代入式估計式與單步估計式（plug-in／one-step）", "type": "concept", "sources": "[renson2025, williams2024]", "group": "concepts", "md": "\n# 代入式估計式與單步估計式（plug-in／one-step）\n\n## 直覺（生活比喻）\n\n用手機導航估算到達時間：代入式（plug-in）像是完全相信導航的路線圖，直接讀出預估時間。單步式（one-step）則是在讀出預估時間後，再拿一路上實際遇到的塞車與順暢情形，把預估值修正一下。修正量從哪裡來？就是 [[efficient-influence-function]] 頁講的那個「斜率」。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 代入式估計式（plug-in estimator）：把估計出的分布各部分代進估計目標。論文的範例是 `ψ(P̂) = (1/n) Σ q̂(W_i)`，對應 g 計算法（g-computation）。[renson2025, p.3]\n- 論文稱代入式為「直覺、但不一定最好」的估計式；用機器學習估計 `q̂(W)` 時，它一般無法給出正確推論。[renson2025, p.3]\n- 單步估計式（one-step estimator）：在代入式上加上「估計 EIF 的樣本平均」，即 `ψ̂_os = ψ(P̂) + (1/n) Σ φ(O_i, P̂)`。[renson2025, p.3]\n- 範例的單步估計式化簡成 `(1/n) Σ { I(A_i=0)/ĝ(W_i) × (Y_i − q̂(W_i)) + q̂(W_i) }`。[renson2025, p.3]\n- 這個形式也叫增強型逆機率加權（augmented inverse probability weighted, AIPW）估計式；做法是用迴歸估計 `ĝ` 與 `q̂`（可用機器學習），再取樣本平均。[renson2025, p.3]\n- 論文說單步估計式是「可論證最簡單」的 EIF 型估計式；另外還有目標最大概似／最小損失估計（targeted minimum loss/maximum likelihood estimation, TMLE）與估計方程式法。[renson2025, p.3]\n- 論文在討論處補充：雙重／去偏機器學習（double/debiased machine learning）把單步估計式當作特例，並指出另一篇相關論文示範如何用 EIF 建構 TMLE。[renson2025, p.5]\n- 論文對比：倍增穩健估計式在使用機器學習時，仍可得到（大樣本下）名目涵蓋率的信賴區間，g 計算法除了特殊情況外做不到。[renson2025, p.1]\n\n## 在各篇怎麼出現\n\n### 在 renson2025 中\n\n- 這是第三步：先講代入式，再講為什麼要加上 EIF 的樣本平均。[renson2025, p.3]\n- 論文把 g 計算法與逆機率加權（IPW）估計式歸為「非速率倍增穩健」的例子，誤差是各自干擾估計式的平均誤差。[renson2025, p.3]\n- 論文提到有些機器學習演算法快到足以讓 g 計算法或 IPW 容納，也有演算法具 Donsker 類性質，可免樣本分割使用速率倍增穩健估計式；高度適應性 lasso（highly adaptive lasso）在適當條件下兩者兼具。[renson2025, p.5]\n\n### williams2024\n\n- williams2024 的「增強型逆機率加權（AIPW）」轉換用來產生 blip 函數的無偏轉換，而不是估計平均結局本身。[williams2024, p.3]\n- 兩篇都用到 AIPW 這個名字，但目標不同；詳見 [[method-comparison]]，這是本 wiki 的整理。\n\n## 常見誤解\n\n- 「代入式一定不能用」：論文只說它在機器學習下一般無法給出正確推論，並說某些演算法夠快時仍可用。[renson2025, p.5]\n- 「單步估計式和 AIPW 是兩個不同的方法」：在論文的範例中，兩者是同一個式子。[renson2025, p.3]\n- 「單步估計式只是在原式上做個小調整，不需要再證明什麼」：論文說仍需證明速率倍增穩健性，見 [[rate-double-robustness]]。[renson2025, p.3]\n\n## 相關頁面\n\n- [[statistical-estimand]]\n- [[efficient-influence-function]]\n- [[nuisance-functions]]\n- [[rate-double-robustness]]\n- [[cross-fitting]]\n- [[doubly-robust-learner]]\n- [[method-comparison]]\n- 來源頁：[[renson2025]]、[[williams2024]]\n"}, "q-learning-dwols-g-estimation": {"title": "Q 學習、DWOLS 與 G 估計（古典迴歸式方法）", "type": "concept", "sources": "[bluemlein2022, williams2024, hong2021, desman2025]", "group": "concepts", "md": "\n# Q 學習、DWOLS 與 G 估計（古典迴歸式方法）\n\n## 直覺（生活比喻）\n\n三位會計用同一張表格記帳，表格的格子都是直線型的（線性）。第一位照實填數字；第二位把每一筆依「這筆帳被分到這個項目的機率」加權後再填；第三位則把那個機率直接寫進結算公式。三種做法的表格長相一樣，只是處理「誰被分到哪一組」的方式不同。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 三者在論文中都是「古典、以線性迴歸為基礎」的 DTR 方法，源自統計學。[bluemlein2022, p.22]\n- 共同架構：每個時間步，把觀察結局的期望值拆成兩塊，「沒有治療時的模型」（treatment-free model）加上「治療與病史的交互作用模型」（treatment-interaction model，也叫 blip model）。[bluemlein2022, p.22]\n- 因為是加法分離，治療決定完全由交互作用那一塊決定；參數若已知，處理效應就是病史的線性組合，估計值為正就給治療。[bluemlein2022, p.22]\n- Q 學習（Q-learning，Moodie 等人 2012）：以普通最小平方法（OLS）估計 blip 參數；也可以理解成分別用線性模型建兩個潛在結局再相減。[bluemlein2022, p.12] [bluemlein2022, p.22]\n- DWOLS（dynamic weighted ordinary least squares，Wallace 與 Moodie 2015）：在 Q 學習上加逆傾向分數權重；論文說這使它對模型設定錯誤具倍增穩健性。[bluemlein2022, p.12] [bluemlein2022, p.23]\n- G 估計（G-estimation，Robins 2004）：不加權，而是把估計的傾向分數放進估計方程式；同樣是倍增穩健、以迴歸為基礎的方法。[bluemlein2022, p.12] [bluemlein2022, p.23]\n- 它們共同的假設：真實模型是低維、對參數線性、函數形式與變數已知；也假設結局預測與處理效應異質性靠同一組共變數。實務上這兩組可能不同且未知。[bluemlein2022, p.22]\n\n## 在各篇怎麼出現\n\n### 在 bluemlein2022 中\n\n- 三者都是基準方法，各自放進 Algorithm 1 取代因果樹／因果森林。[bluemlein2022, p.22]\n- 為了公平，兩個成分都用同一組共變數：整段病史。[bluemlein2022, p.12]\n- 線性情境中，Q 學習與 DWOLS 的測試集累積後悔值為 23.730 與 23.566，遠高於 DTR-CT 的 3.223 與 DTR-CF 的 3.052。[bluemlein2022, p.14]\n- G 估計在線性情境的累積後悔值最高（55.807），在非線性情境（20.434）卻是五個基準中最低；原因論文未解釋：來源未提及。[bluemlein2022, p.14]\n- 本 wiki 的觀察（不是論文的話）：在作者設計的線性情境，三個線性方法的後悔值都沒有低過 CART 的 4.188。[bluemlein2022, p.14]\n\n### williams2024\n\n- 只把 Q-learning 與 A-learning 列為「以條件平均處理效應迴歸為基礎」的一類方法；細節，以及 DWOLS 與 G 估計：本 wiki 的 williams2024 頁未記載。[williams2024, p.3]\n\n### 在 hong2021 中\n\n- 論文以動態加權普通最小平方法（dWOLS，也就是本頁的 DWOLS）依序估計最佳 MP，輸出 0 到 48 小時的個人化最佳劑量策略。[hong2021, p.3]\n- 論文為這一步引用的文獻之一，標題含「最佳劑量策略的倍增穩健估計」；但正文沒有主張自己的估計具有倍增穩健性，也沒有說明傾向分數（連續劑量的指派機制）怎麼建模與加權：來源未提及。[hong2021, p.3] [hong2021, p.9]\n- 函數形式由作者事先指定（哪些變數與 MP 交互、二次項只與類別和 P/F 比值交互），屬於參數式迴歸；bluemlein2022 對這類古典方法的描述是假設函數形式與變數已知。[hong2021, p.3] [bluemlein2022, p.22]\n- hong2021 沒有把 dWOLS 和其他方法比較，也沒有模擬研究：來源未提及。這和 bluemlein2022 把它當作基準方法的用途不同。[hong2021, p.3] [bluemlein2022, p.12]\n\n### 在 desman2025 中\n\n- 論文用的演算法叫保守 Q 學習（CQL），是離線強化學習的方法，見 [[offline-reinforcement-learning]]。[desman2025, p.8]\n- CQL 與本頁的 Q 學習（以線性迴歸估計 blip 參數）是不是同一脈絡：論文沒有說明：來源未提及。bluemlein2022 把 Q 學習歸為統計學的古典線性方法，與強化學習是不同的路線。[bluemlein2022, p.4] [bluemlein2022, p.22]\n- desman2025 沒有使用 DWOLS 或 G 估計：來源未提及。\n\n## 常見誤解\n\n- 「Q 學習就是深度強化學習」：論文把 Q 學習歸為來自統計學的古典方法（線性迴歸），與另外提到、多以深度學習為基礎的強化學習研究是不同的路線。[bluemlein2022, p.4] [bluemlein2022, p.22]\n- 「DWOLS 加了權重就不會錯」：論文只說它對模型設定錯誤具倍增穩健性，且前提仍是線性、低維的模型形式。[bluemlein2022, p.22-23]\n- 「線性方法在線性情境一定贏」：在作者的模擬中沒有；原因來源未提及。[bluemlein2022, p.14]\n\n## 相關頁面\n\n- [[backward-recursion]]\n- [[blip-function]]\n- [[doubly-robust-learner]]\n- [[causal-tree-and-forest]]\n- [[optimal-dynamic-treatment-rule]]\n- [[offline-reinforcement-learning]]\n- 來源頁：[[bluemlein2022]]、[[williams2024]]、[[hong2021]]、[[desman2025]]\n- 名詞速查：[[glossary]]\n"}, "rate-double-robustness": {"title": "速率倍增穩健（rate double robustness）", "type": "concept", "sources": "[renson2025, williams2024, bluemlein2022]", "group": "concepts", "md": "\n# 速率倍增穩健（rate double robustness）\n\n## 直覺（生活比喻）\n\n兩位學徒分別負責抄寫食譜的兩個部分，每人都難免抄錯一點點。如果最後成品的錯誤是「兩人錯誤的相加」，錯就會累積；如果是「兩人錯誤的相乘」，每人只錯一點點，乘起來就小得多。速率倍增穩健講的就是：好的估計式，最後的誤差像後者。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 收斂速率（convergence rate）：一個估計式的偏差與變異數趨近於零有多快。[renson2025, p.3]\n- 若 `√n(ψ̂ − ψ)` 在分布上收斂到 `N(0, σ²)`，就說估計式的速率是 `√n`（`√n` 一致）且漸近常態。[renson2025, p.3]\n- 為什麼要 `√n`：大部分建構信賴區間的統計理論（包含拔靴法與其他重抽樣法）都靠「誤差乘上 `√n`」；而且 `√n` 通常是最快可能的速率。[renson2025, p.3]\n- 難處：許多機器學習演算法（隨機森林、提升樹）收斂慢於 `√n`，例如可能只有 `n^(1/4)`。[renson2025, p.4]\n- 速率倍增穩健：估計式的收斂速率等於兩個干擾函數收斂速率的乘積。例如兩者都是 `n^(1/4)` 一致，估計式的速率是 `(n^(1/4))^2 = √n`；一個慢一點，另一個就要快一點，只要乘積是 `√n`。[renson2025, p.4]\n- 啟發式的說法：速率倍增穩健的估計式，誤差是兩個干擾估計式誤差的乘積；g 計算法與 IPW 的誤差則是各自干擾估計式的平均誤差。[renson2025, p.3]\n- 它與「倍增穩健一致性」不同：後者（常簡稱倍增穩健）是說只要兩個干擾估計式有一個被正確設定，估計式就是一致的；論文在附錄給了單步估計式的正式定義與證明。[renson2025, p.4]\n- 證明的骨架：\n  - 代入式的誤差可以用馮·米塞斯展開（von Mises expansion）拆成「一階誤差」與「餘項」兩項。[renson2025, p.4]\n  - 單步估計式設計上去除了一階誤差的「漂移項」；剩下的項在「干擾函數是在另一份樣本中估計」的條件下，一般收斂到均值為零的常態分布。這可用樣本分割達成，見 [[cross-fitting]]。[renson2025, p.4]\n  - 餘項則需另外推導：範例中餘項等於 `−E[(1/ĝ)(g − ĝ)(q − q̂)]`，即兩個干擾函數誤差的乘積。[renson2025, p.4]\n  - 若 `g − ĝ` 以速率 a 趨近零、`q − q̂` 以速率 b 趨近零，餘項就以速率 `a × b` 趨近零；論證用柯西–許瓦茲不等式（Cauchy–Schwarz inequality）。[renson2025, p.4]\n  - 所需的「溫和條件」是一種正值性假設：g 與 ĝ 都介於 `(ε, 1 − ε)`，其中 ε 大於零。[renson2025, p.4]\n- 結論：證明之後，縮放的誤差趨近 `N(0, E[φ(O,P)^2])`，因此可以用估計 EIF 的樣本變異數除以 n 估計變異數；這個變異數估計式要求兩個干擾函數都被一致地估計。[renson2025, p.5]\n\n## 在各篇怎麼出現\n\n### 在 renson2025 中\n\n- 第四步與第五步的主題。[renson2025, p.3-5]\n- 論文的討論：這個性質容許許多、但不是所有機器學習演算法；兩個演算法的速率相乘要等於 `√n`，例如兩者都是 `n^(1/4)`，或一個是 `n^(1/8)` 而另一個至少 `n^(3/8)`。[renson2025, p.5]\n- 論文說 `n^(1/4)` 通常合理（例如隨機森林與神經網路可達到），但不保證。[renson2025, p.5]\n\n### williams2024\n\n- williams2024 說的「倍增穩健」是：Q 或 g 只要有一個被一致估計，就能得到 blip 函數的無偏估計。[williams2024, p.3]\n- 這接近 renson2025 所說的「倍增穩健一致性」，而不是「速率倍增穩健」；兩者的對照見 [[method-comparison]]，這是本 wiki 的整理。williams2024 是否討論速率：來源未提及。\n\n### 在 bluemlein2022 中\n\n- 論文宣稱方法是倍增穩健，說法是：每個時間步只要傾向分數模型或處理效應模型有一個設定正確，就能得到無偏的處理效應估計。這接近「倍增穩健一致性」那一類的說法。[bluemlein2022, p.10]\n- 收斂速率、速率倍增穩健、信賴區間與推論：來源未提及。論文報告的是模擬中的平均值與標準差，見 [[regret-and-decision-accuracy]]。[bluemlein2022, p.13]\n\n## 常見誤解\n\n- 「速率倍增穩健就是倍增穩健」：論文明說兩者不同。[renson2025, p.4]\n- 「只要用了 EIF 型估計式，任何機器學習都行」：論文說這個性質容許許多、但不是所有演算法。[renson2025, p.5]\n- 「兩個干擾估計式只要有一個準就夠做推論」：論文的變異數估計式要求兩個干擾函數都被一致估計。[renson2025, p.5]\n\n## 相關頁面\n\n- [[nuisance-functions]]\n- [[efficient-influence-function]]\n- [[plug-in-and-one-step-estimators]]\n- [[cross-fitting]]\n- [[doubly-robust-learner]]\n- [[method-comparison]]\n- 來源頁：[[renson2025]]、[[williams2024]]、[[bluemlein2022]]\n"}, "regret-and-decision-accuracy": {"title": "後悔值與決策準確度（評估學出的規則）", "type": "concept", "sources": "[bluemlein2022, williams2024, renson2025, hong2021, desman2025]", "group": "concepts", "md": "\n# 後悔值與決策準確度（評估學出的規則）\n\n## 直覺（生活比喻）\n\n把學出的規則想成一位學生在多選題考試中選答案，而老師手上有標準答案。決策準確度像「選對的題目占幾成」；後悔值像「選錯題目時，被扣掉的分數加總」，扣分多寡看那題的差距有多大。選錯一題差距很小，準確度會扣一題，但後悔值幾乎不增加。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 模擬資料是自己產生的，因此真正的最佳決策（oracle）已知，可用來當基準。[bluemlein2022, p.11] [bluemlein2022, p.13]\n- 評估流程：用 75 % 的資料訓練、25 % 的資料測試；重複估計、預測、評估共 100 次，每次重新模擬資料；兩個指標都報告平均值與標準差。[bluemlein2022, p.13]\n- 後悔值（regret）：估計的最佳 DTR 與真正最佳 DTR 在結局上的差，以真實處理效應表示；每個時間步都不會是負的，估計決定與真正最佳決定相同時為零，不同時為正。[bluemlein2022, p.13]\n- 累積後悔值（cumulative regret）：把一位病人各時間步的後悔值加總，再對病人與模擬次數取平均；越小越好。[bluemlein2022, p.13]\n- 決策準確度（decision accuracy）：估計的最佳決定與真正最佳決定相符的比例，對時間步、病人與模擬次數取平均；越大越好。[bluemlein2022, p.13]\n- 論文的直覺說法：後悔值捕捉「錯誤決定使結局變差的程度」。[bluemlein2022, p.13]\n- 真實資料沒有真值，無法和 oracle 比較；論文改看期望增益：依估計的最佳 DTR 治療，相對於病人實際接受的治療，預期結局的增加量。數值越大，代表估計的決定與實際決定不同，因而代表改善。[bluemlein2022, p.15-16]\n- 若累積期望報酬不為負，論文就說估計的結局優於實際治療做法。[bluemlein2022, p.16]\n\n## 在各篇怎麼出現\n\n### 在 bluemlein2022 中\n\n- 模擬結果以累積後悔值與決策準確度報告，數字見來源頁。[bluemlein2022, p.14]\n- 真實資料以 Table 3 的累積期望報酬報告；論文說因為估計的處理效應尺度隨方法而異且各方法專屬，所以不與其他基準比較。[bluemlein2022, p.16]\n- 本 wiki 的觀察（不是論文的話）：期望增益用的是方法自己估計的處理效應，所以它不是獨立資料上的驗證；外部驗證：來源未提及。[bluemlein2022, p.16]\n\n### williams2024\n\n- 以各規則之下結局的估計價值（例如風險）和風險比來比較規則。[williams2024, p.6]\n\n### renson2025\n\n- 沒有新資料與實證結果。[renson2025, p.5]\n\n### 在 hong2021 中\n\n- 這篇沒有真值（oracle），也沒有報告後悔值、決策準確度或期望增益。[hong2021, p.3]\n- 論文的「驗證」：算 ΔMP（實際 MP 減最佳 MP），比較不同 ΔMP 的病人的死亡結局；再用含二次項的邏輯斯迴歸看最低死亡風險是否落在 ΔMP 約為零處。論文的推論是：偏離最佳 MP 的病人死亡風險較高，支持使用 DTR。[hong2021, p.3] [hong2021, p.7]\n- 結果：以 optimal 的 ΔMP 為參照，ΔMP 偏低（OR 1.08；95% CI 1.02 至 1.15）或偏高（OR 1.07；95% CI 1.00 至 1.14）都與住院死亡風險增加有關；含二次項的模型結果相同。[hong2021, p.4]\n- 本 wiki 的觀察（不是論文的話）：兩個勝算比都接近 1，偏高那組的信賴區間下限是 1.00；而且論文沒有說明最佳 MP 與這個驗證用的死亡結局是否取自同一批資料、有沒有分開估計與驗證：來源未提及。[hong2021, p.4]\n- 與 bluemlein2022 的對照：兩篇在真實資料上都沒有與真值比較；bluemlein2022 的期望增益由方法自己估計的處理效應算出，hong2021 用的是實際用量偏離最佳用量與死亡的關聯。[bluemlein2022, p.16] [hong2021, p.3]\n\n### 在 desman2025 中\n\n- 這篇沒有真值（oracle），也沒有報告後悔值、決策準確度或期望增益：來源未提及。\n- 論文用四種檢查：（一）離線策略評估的估計報酬對照醫師，見 [[off-policy-evaluation]]；（二）血糖在範圍內的時間比例，如何隨「模型建議減實際給藥」的差距而變；（三）與內分泌科醫師建議的平均絕對誤差；（四）盲評的 5 分 Likert 量表。[desman2025, p.2] [desman2025, p.5] [desman2025, p.6]\n- 與 bluemlein2022 的期望增益對照（本 wiki 的整理）：因為沒有真值，兩篇都是拿「學出的策略的估計結果」去比「實際做法」；差別是 desman2025 的醫師報酬是觀察到的、GLUCOSE 的報酬是估計出來的，而且另有外部驗證資料。[bluemlein2022, p.16] [desman2025, p.2]\n- 與 hong2021 的對照：兩篇都看「實際用量離建議多遠」與結果的關係；hong2021 看 ΔMP 與死亡，desman2025 看劑量差距與血糖在範圍內的時間比例。[hong2021, p.4] [desman2025, p.2]\n- 論文自己的措辭是：讓給藥更接近模型建議「可能」提高血糖在範圍內的時間比例；這個關聯是觀察性的。[desman2025, p.7]\n\n## 常見誤解\n\n- 「準確度高就代表對病人好」：準確度只在模擬資料中對照 oracle；真實資料沒有 oracle。[bluemlein2022, p.16]\n- 「Table 3 中數字較大的方法比較好」：論文明說估計的處理效應尺度隨方法而異，所以不能直接比。[bluemlein2022, p.16]\n- 「後悔值和準確度是同一件事」：這是本 wiki 的整理，不是論文的話：準確度只看對不對，後悔值還看錯的代價；論文把兩者並列報告。[bluemlein2022, p.13]\n\n## 相關頁面\n\n- [[optimal-dynamic-treatment-rule]]\n- [[backward-recursion]]\n- [[causal-tree-and-forest]]\n- [[q-learning-dwols-g-estimation]]\n- [[off-policy-evaluation]]\n- 來源頁：[[bluemlein2022]]、[[williams2024]]、[[renson2025]]、[[hong2021]]、[[desman2025]]\n- 名詞速查：[[glossary]]\n"}, "reinforcement-learning-mdp": {"title": "強化學習與馬可夫決策過程（狀態、行動、獎勵）", "type": "concept", "sources": "[desman2025, bluemlein2022]", "group": "concepts", "md": "\n# 強化學習與馬可夫決策過程（狀態、行動、獎勵）\n\n## 直覺（生活比喻）\n\n像訓練一隻狗：每次做對動作就給零食，做錯就不給。狗不懂規則，只是從「在這種情況下做這個動作，之後得到什麼回饋」的經驗，慢慢養成一套習慣。強化學習就是讓電腦照這個方式學：看目前的情況（狀態）、選一個動作（行動）、得到回饋（獎勵），目標是讓長期得到的回饋總和最大。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 強化學習（reinforcement learning, RL）：一種機器學習，由代理（agent）在環境中採取行動，以最大化累積獎勵來學習做決策。[desman2025, p.2]\n- 代理依行動得到獎勵或懲罰作為回饋，並隨時間改進自己的策略（policy）。[desman2025, p.2]\n- 論文把 RL 的問題寫成馬可夫決策過程（Markov Decision Process, MDP）：每個時間步有目前的狀態、採取的行動、得到的獎勵，以及行動後下一個時間步的狀態。[desman2025, p.9]\n- 狀態（state）：這篇是某一小時的一組特徵向量，包含人口學、共病、實驗室值、生命徵象、用藥、機械通氣與 SOFA 分數，另有前四小時的血糖、血糖變化，以及血糖變化與胰島素劑量的比值。[desman2025, p.9]\n- 行動（action）：每小時給的常規胰島素量，是連續的；建議劑量四捨五入到整數，上限為每小時 10 單位。[desman2025, p.9]\n- 獎勵（reward）：由血糖是否在目標範圍決定。血糖在 140 至 180 mg/dL 時最高為 +0.2，離開範圍後罰則越來越重，最低到 −1；另有一項隨劑量增大的懲罰，以勸阻大幅度的過度矯正。[desman2025, p.9]\n- 折扣因子（discount factor）：決定遠期獎勵比近期獎勵少算多少；論文設為 0.67，相當於約 3 小時的有效視野，理由是血糖變化快，折扣因子太高會讓模型過度看重遠期、或對眼前的差狀態不敏感。[desman2025, p.9]\n- 論文把「預測」與「決策」分開：血糖預測模型預測趨勢，不建議一連串的胰島素劑量；RL 則學最佳劑量策略。[desman2025, p.2]\n\n本 wiki 的對照（不是論文的話；論文沒有使用動態治療策略或 ODTR 這些詞：來源未提及）：\n\n| DTR 的語言 | RL 的語言 | 在 desman2025 的對應 |\n|---|---|---|\n| 病史與目前狀況 | 狀態 | 當下特徵加前四小時血糖，見上。[desman2025, p.9] |\n| 治療（開關或劑量） | 行動 | 每小時的胰島素劑量。[desman2025, p.9] |\n| 結局 | 累積獎勵 | 依血糖範圍計分、再逐小時累加。[desman2025, p.2] [desman2025, p.9] |\n| 治療規則 | 策略 | 論文稱為最佳胰島素劑量策略。[desman2025, p.2] |\n\n## 在各篇怎麼出現\n\n### 在 desman2025 中\n\n- 整個研究的框架：把心臟手術後第一天的每小時胰島素調整當成 MDP，用歷史紀錄訓練策略。[desman2025, p.2] [desman2025, p.9]\n- 論文認為 RL 的好處是能適應快速改變的臨床狀況，並持續從個別病人資料學習。[desman2025, p.2]\n- 這個策略的設計限制：只看目前時間點為止的資料，不看未來；論文特別說，人類評估者看得到整段時間序列，而 GLUCOSE 只有目前的狀態。[desman2025, p.5] [desman2025, p.7]\n\n### 在 bluemlein2022 中\n\n- bluemlein2022 把強化學習視為另一條路線，說它多以深度學習或神經網路為基礎，不易解釋。[bluemlein2022, p.2] [bluemlein2022, p.4]\n- 它沒有用 RL 的語彙；本 wiki 的其他來源頁也沒有記載 MDP 或獎勵這些概念。\n\n## 常見誤解\n\n- 「RL 會在病人身上邊做邊試」：這篇是離線學習，只用已經收集好的紀錄，學習過程不與病人互動；見 [[offline-reinforcement-learning]]。[desman2025, p.2]\n- 「獎勵就是臨床結局」：這篇的獎勵是作者設計的計分函數，數值尺度（最高 +0.2、最低 −1）是人訂的，不是死亡率或住院天數。[desman2025, p.9]\n- 「折扣因子越高越好，因為考慮得更遠」：論文說，高折扣因子在這個問題反而會讓策略不敏感，所以刻意選低的。[desman2025, p.9]\n\n## 相關頁面\n\n- [[offline-reinforcement-learning]]\n- [[distributional-reinforcement-learning]]\n- [[off-policy-evaluation]]\n- [[dynamic-treatment-regime]]\n- [[decision-points-and-history]]\n- [[interpretability]]\n- 來源頁：[[desman2025]]、[[bluemlein2022]]\n- 名詞速查：[[glossary]]\n"}, "statistical-estimand": {"title": "統計估計目標（estimand）", "type": "concept", "sources": "[renson2025, williams2024]", "group": "concepts", "md": "\n# 統計估計目標（estimand）\n\n## 直覺（生活比喻）\n\n想像你要「複製一道菜」。菜單上的那道菜，是你真正想知道的答案；食材清單是你手上的資料；而「依照食材做出這道菜的步驟」才是食譜。估計目標（estimand）是「想知道的那個數字是什麼」，估計式（estimator）是「怎麼用資料算出它的食譜」。兩件事要分開想：先講清楚想要哪道菜，再談怎麼做。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 論文的路線：先把科學問題翻成因果參數，再用因果假設把因果參數等同於一個只依賴觀察資料分布的統計估計目標（statistical estimand），這一步稱為識別（identification）。[renson2025, p.2]\n- 範例：科學問題是「如果每個人都沒有接受治療，平均結局是多少？」，因果參數是不治療時的期望潛在結局 `E[Y^0]`，統計估計目標是 `ψ = E(E(Y | W, A=0))`。[renson2025, p.2]\n- 論文把統計估計目標看成一個「映射」：輸入一個分布 P，輸出一個數字（在範例中是純量，但向量或其他形式的估計目標也適用），寫成 `ψ(P)`。[renson2025, p.2]\n- 估計式則是從資料算出 ψ 的方法，例如代入式估計式、單步估計式。詳見 [[plug-in-and-one-step-estimators]]。[renson2025, p.3]\n- 論文指出，需要自己推導估計式的情況，通常是因為科學問題或識別結果帶來一個較少見的估計目標。[renson2025, p.2]\n- 論文把「估計」與「識別」分成兩個步驟：它的焦點是統計估計，所以只簡述如何走到統計估計目標。[renson2025, p.2]\n\n## 在各篇怎麼出現\n\n### 在 renson2025 中\n\n- 全文五步中的第一步就是「定義統計估計目標」。[renson2025, p.1]\n- 範例的因果參數 `E[Y^0]` 只是平均處理效應 `E[Y^1] - E[Y^0]` 的一個組成部分。[renson2025, p.2]\n- 論文在附錄另示範第二個估計目標：在受治療者中、不治療時的期望結局，是治療組平均處理效應的一部分。[renson2025, p.2]\n- 論文舉的其他估計目標例子見 [[renson2025]] 的研究問題段落。[renson2025, p.1]\n\n### williams2024\n\n- williams2024 也有一個以 ψ 表示的估計目標：最佳規則下的平均結局，以「依序倍增穩健」估計式估計。[williams2024, p.5]\n- 兩篇用同一個符號 ψ，但指的不是同一個東西；williams2024 的 ψ 是依某規則治療時的平均結局，renson2025 的 ψ 是不治療時的平均結局（以觀察資料表示）。這是本 wiki 的整理，兩篇各自的定義見上面的引用。[renson2025, p.2]\n\n## 常見誤解\n\n- 「估計目標就是估計式」：論文把兩者分開，估計目標是 ψ(P) 這個映射，估計式是用資料近似它的方法。[renson2025, p.2]\n- 「因果參數與統計估計目標天生相等」：要靠識別假設（可交換性、正值性、一致性）才能把兩者畫上等號。詳見 [[identification-assumptions]]。[renson2025, p.2]\n- 「估計目標一定是單一數字」：論文說這個做法也適用於向量或其他非純量的估計目標。[renson2025, p.2]\n\n## 相關頁面\n\n- [[identification-assumptions]]\n- [[nuisance-functions]]\n- [[efficient-influence-function]]\n- [[plug-in-and-one-step-estimators]]\n- [[optimal-dynamic-treatment-rule]]\n- 來源頁：[[renson2025]]、[[williams2024]]\n- 名詞速查：[[glossary]]\n"}, "treatment-effect-heterogeneity": {"title": "平均效果與處理效應異質性", "type": "concept", "sources": "[williams2024, bluemlein2022, hong2021, desman2025]", "group": "concepts", "md": "\n# 平均效果與處理效應異質性\n\n## 直覺（生活比喻）\n\n一款外套「平均來說」很保暖，但怕熱的人穿了可能更不舒服。只看平均，就看不出誰該穿、誰不該穿。個人化的治療規則想解決的就是這個問題。（比喻為本 wiki 的說明，不是論文的話。）\n\n## 定義\n\n- 平均處理效應（average treatment effect, ATE）：一個族群全部的人都接受某治療，相比全部的人都沒接受（或接受別的處理），結局的平均差異。[williams2024, p.1]\n- ATE 可以說明治療平均而言有益或有害，但無法說明對某個特定的人是有益還是有害。[williams2024, p.1]\n- 處理效應異質性（treatment effect heterogeneity）：對整體族群平均有益的治療，可能讓某些人受益、卻傷害另一些人。[williams2024, p.1]\n- 個人化醫療（personalized medicine）的前提是應該假設異質性存在，並把治療調整到「每位病人不斷演變的健康狀態」，而不是一體適用。[williams2024, p.1]\n- 其基本原則：治療應給會受益的人，並避免讓不會受益的人接受不必要的治療。[williams2024, p.1]\n- 時間變動的情境下，異質性還包含「同一個人在不同時間、情況不同，兩種治療的效益也不同」。[williams2024, p.1]\n\n## 在各篇怎麼出現\n\n### williams2024\n\n- 論文以 ATE 的侷限當作整篇的出發點，在討論處再次指出 ATE 忽略了對某些亞群有實際重要性的異質性。[williams2024, p.6]\n- 例子：在鴉片使用障礙的一個比較有效性試驗中，學出的最佳治療規則是無家可歸的病人用注射型納曲酮、住房穩定的病人用 BUP-NX 的 RROU 風險較低。[williams2024, p.1]\n- 估計「兩種治療的結局差」如何隨 V 而變，正是 [[blip-function]]（條件平均處理效應）要做的事。[williams2024, p.3]\n\n### 在 bluemlein2022 中\n\n- 論文以個人化醫療為出發點：過去「一體適用」的做法，大致忽略病人在治療反應與風險因子上的異質性。[bluemlein2022, p.1]\n- 估計異質處理效應（HTE）的方法（因果樹、因果森林）原本為靜態設定設計，論文說它們尚未被用來學最佳 DTR，見 [[causal-tree-and-forest]]。[bluemlein2022, p.3]\n- 作者的見解：要個人化治療決定，古典統計方法與以預測為主的機器學習可能不是最佳選擇，專為因果效應估計設計的機器學習較有益處。[bluemlein2022, p.3]\n- 作者認為，古典基準假設關係已知、且所有病人由同一組變數決定治療；他們的方法允許「對決策有指示性的變數」因人而異。[bluemlein2022, p.17]\n- 古典線性方法假設同一組共變數對結局預測與對處理效應異質性都重要；實務上兩組可能不同且未知。[bluemlein2022, p.22]\n\n### 在 hong2021 中\n\n- 論文以族群異質性為出發點：單一的通氣數值（例如潮氣量與平台壓的上限）未必對所有 ARF 病人都有益；它舉的例子是有些病人在低潮氣量下會發生嚴重的二氧化碳滯留，有些人因循環衰竭無法耐受高 PEEP。[hong2021, p.1]\n- 作法是先用有限混合模型分出三個類別（見 [[finite-mixture-subphenotypes]]），再看機械功率的效果是否隨類別而變。[hong2021, p.1-2]\n- 結果（觀察性資料的關聯估計）：類別與 MP 有顯著交互作用；MP_static 每增加 5 Joules/min，死亡風險比在 Class 1 最小（1.29；95% CI 1.15 至 1.45），在 Class 3 最大（1.83；95% CI 1.52 至 2.20）。[hong2021, p.1] [hong2021, p.4]\n- 異質性也沿著連續的肺功能指標出現：論文報告了 MP_dynamic 與 P/F 比值、肺順應性的交互作用項，細節見 [[hong2021]]。[hong2021, p.4]\n- 論文對 Class 3 的詮釋：其特徵是通氣下仍頑固的呼吸衰竭、其他器官功能相對正常；在這種情況下，降低 MP 有助於減少潛在的肺損傷。這是作者的詮釋，不是試驗結果。[hong2021, p.6]\n- 用字提醒：摘要寫「MP 對 ARF 的亞型有不同的治療效果」，但文中實際估計的是 Cox 迴歸裡的風險比與交互作用；本 wiki 照估計的字面說明，把它們當成關聯，不當成因果效應。[hong2021, p.1] [hong2021, p.4]\n- 這些交互作用是用風險比的差異呈現，不是 [[blip-function]]（條件平均處理效應）的估計；DTR 那一步的 blip 才把類別放進模型當作會改變效果的變數。[hong2021, p.3]\n\n### 在 desman2025 中\n\n- 論文的出發點：流程化的方案常常沒有考慮病人間的個別差異；有些方案對某些病人較合適，或只在一段時間內有效，因為病情會演變。[desman2025, p.2]\n- 論文沒有估計條件平均處理效應（blip）或處理效應異質性本身：來源未提及。\n- 亞群檢查：依性別、種族、糖尿病狀態分層，各亞群中血糖在範圍內的時間比例都是在建議與實際給藥相符時最高；論文據此說模型在這些亞群表現一致。這是一致性的檢查，不是估計各亞群效果的差異。[desman2025, p.3]\n- 另一種「個體差異」：外表相似的病人，生理反應仍可能差很多；分布式強化學習用來處理這種不確定性，見 [[distributional-reinforcement-learning]]。[desman2025, p.7]\n\n## 常見誤解\n\n- 「ATE 為正就代表對每個人都有益」：論文明說不是，見上方定義。[williams2024, p.1]\n- 「個人化規則一定會比一體適用好」：來源未提及這樣的保證；論文的範例中，學出的規則與預先指定的動態規則相比差異並不具意義。[williams2024, p.6]\n\n## 相關頁面\n\n- [[blip-function]]\n- [[optimal-dynamic-treatment-rule]]\n- [[dynamic-treatment-regime]]\n- [[causal-tree-and-forest]]\n- [[finite-mixture-subphenotypes]]\n- [[distributional-reinforcement-learning]]\n- 來源頁：[[williams2024]]、[[bluemlein2022]]、[[hong2021]]、[[desman2025]]\n"}, "glossary": {"title": "術語表", "type": "glossary", "sources": "[williams2024, renson2025, bluemlein2022, hong2021, desman2025]", "group": "top", "md": "\n# 術語表\n\n每列：中文 ／ English ／ 一句話定義 ／ 詳見頁面。定義只依據已 ingest 的來源；目前來源：[[williams2024]]、[[renson2025]]、[[bluemlein2022]]、[[hong2021]]、[[desman2025]]。\n\n| 中文 | English | 一句話定義 | 詳見 |\n|---|---|---|---|\n| 治療規則 | treatment rule | 把治療前變數 V 對應到要給的治療 A 的函數。[williams2024, p.2] | [[dynamic-treatment-regime]] |\n| 靜態規則 | static rule | 每個人都拿到同一個治療值。[williams2024, p.2] | [[dynamic-treatment-regime]] |\n| 動態規則 | dynamic rule | 治療依個人已量測的病史而定。[williams2024, p.2] | [[dynamic-treatment-regime]] |\n| 病史 | history | 到某次治療之前的所有變數紀錄，記為 Ht。[williams2024, p.3] | [[decision-points-and-history]] |\n| 決策時間點 | decision point | 病人可以選擇要不要接受（或加量）治療的離散時間點。[williams2024, p.2] | [[decision-points-and-history]] |\n| 最佳動態治療規則 | optimal dynamic treatment rule（ODTR） | 在所有可能規則中，讓反事實結局期望值最大（或最小）的規則。[williams2024, p.2] | [[optimal-dynamic-treatment-rule]] |\n| 反事實結局 | counterfactual outcome | 若治療依某規則指派，結局會有的假想值。[williams2024, p.2] | [[optimal-dynamic-treatment-rule]] |\n| 平均處理效應 | average treatment effect（ATE） | 全部的人都接受治療相對全部不接受時，結局的平均差。[williams2024, p.1] | [[treatment-effect-heterogeneity]] |\n| 處理效應異質性 | treatment effect heterogeneity | 平均有益的治療仍可能使有些人受益、有些人受害。[williams2024, p.1] | [[treatment-effect-heterogeneity]] |\n| 條件平均處理效應 | conditional average treatment effect（CATE） | 在 V 條件下兩種治療的結局差，常稱 blip 函數。[williams2024, p.3] | [[blip-function]] |\n| Blip 函數 | blip function | CATE 的別名，是迴歸式學出最佳規則的關鍵成分。[williams2024, p.3] | [[blip-function]] |\n| 無偏轉換 | unbiased transformation | 資料的函數，其在 V 條件下的期望值等於 blip。[williams2024, p.3] | [[doubly-robust-learner]] |\n| 增強型逆機率加權 | augmented inverse probability weighting（AIPW） | 論文採用的倍增穩健無偏轉換。[williams2024, p.3] renson2025 中，AIPW 估計式就是單步估計式。[renson2025, p.3] | [[doubly-robust-learner]]、[[plug-in-and-one-step-estimators]] |\n| 倍增穩健 | doubly robust | Q 或 g 只要有一個被一致估計，就能得到無偏的 blip 估計。[williams2024, p.3] | [[doubly-robust-learner]] |\n| 傾向分數 | propensity score | 實際拿到所觀察到治療的機率，論文中記為 g(A, H)。[williams2024, p.3] | [[doubly-robust-learner]] |\n| Q 學習 | Q-learning | 以條件平均處理效應迴歸為基礎的 ODTR 估計方法之一。[williams2024, p.3] bluemlein2022 中，Q 學習以普通最小平方法估計線性的 blip 參數。[bluemlein2022, p.22] | [[optimal-dynamic-treatment-rule]]、[[q-learning-dwols-g-estimation]] |\n| 超級學習器 | super learner | 以另一個演算法（元學習器）組合一組使用者指定學習器的預測。[williams2024, p.5] | [[doubly-robust-learner]] |\n| 交叉擬合 | cross-fitting | 範例中用來估計 Q 與 g 的做法，論文在別處以樣本分割說明可避開平滑性要求。[williams2024, p.5] renson2025 中，要求干擾估計式在另一份樣本擬合，簡單版是把樣本分成兩半再交換。[renson2025, p.4] | [[doubly-robust-learner]]、[[cross-fitting]] |\n| 一致性 | consistency | 觀察到的治療水準下，反事實結局就是實際觀察到的結局。[williams2024, p.3] | [[identification-assumptions]] |\n| 可交換性（無未測量干擾） | exchangeability（no unmeasured confounding） | 所有同時影響暴露與結局的共同原因都已測量並調整。[williams2024, p.3] | [[identification-assumptions]] |\n| 正值性 | positivity | 在所有層內，各治療水準出現的機率都不為零。[williams2024, p.3] | [[identification-assumptions]] |\n| 回到規律鴉片使用 | return to regular opioid use（RROU） | 論文範例的結局，定義見來源頁。[williams2024, p.5] | [[williams2024]] |\n| 鴉片使用障礙 | opioid use disorder（OUD） | 論文範例的疾病情境。[williams2024, p.1] | [[williams2024]] |\n| 丁基原啡因加納洛酮 | buprenorphine-naloxone（BUP-NX） | 論文範例中被調整劑量的藥物。[williams2024, p.1] | [[williams2024]] |\n| 估計目標 | estimand | 想知道的那個量；統計估計目標是只依賴觀察資料分布的映射 ψ(P)。[renson2025, p.2] | [[statistical-estimand]] |\n| 估計式 | estimator | 從資料算出估計目標的方法，例如代入式、單步估計式。[renson2025, p.3] | [[statistical-estimand]]、[[plug-in-and-one-step-estimators]] |\n| 識別 | identification | 用因果假設把因果參數等同於只依賴觀察資料分布的統計估計目標。[renson2025, p.2] | [[statistical-estimand]]、[[identification-assumptions]] |\n| 干擾函數 | nuisance function | 需要估計但不是最終目標的函數，例如結局迴歸、傾向分數。[renson2025, p.1] | [[nuisance-functions]] |\n| 有效影響函數 | efficient influence function（EIF） | 估計目標對資料分布的導數，描述估計式的一階誤差。[renson2025, p.2] | [[efficient-influence-function]] |\n| 路徑可微分性 | pathwise differentiability | EIF 存在的條件：映射的導數存在且變異數有限。[renson2025, p.3] | [[efficient-influence-function]] |\n| 代入式估計式 | plug-in estimator | 把估計出的分布各部分代進估計目標，範例中對應 g 計算法。[renson2025, p.3] | [[plug-in-and-one-step-estimators]] |\n| g 計算法 | g-computation | 代入式估計式在範例中的別名；用機器學習時一般無法正確推論。[renson2025, p.3] | [[plug-in-and-one-step-estimators]] |\n| 單步估計式 | one-step estimator | 代入式加上估計 EIF 的樣本平均，範例中等同 AIPW。[renson2025, p.3] | [[plug-in-and-one-step-estimators]] |\n| 目標最大概似估計 | targeted minimum loss/maximum likelihood estimation（TMLE） | 另一類 EIF 型估計式，論文只簡述。[renson2025, p.5] | [[plug-in-and-one-step-estimators]] |\n| 收斂速率 | convergence rate | 估計式的偏差與變異數趨近於零的快慢。[renson2025, p.3] | [[rate-double-robustness]] |\n| 速率倍增穩健 | rate double robustness | 估計式的收斂速率等於兩個干擾函數收斂速率的乘積。[renson2025, p.4] | [[rate-double-robustness]] |\n| 倍增穩健一致性 | doubly robust consistency | 兩個干擾估計式只要有一個設定正確，估計式就一致。[renson2025, p.4] | [[rate-double-robustness]]、[[doubly-robust-learner]] |\n| 樣本分割 | sample splitting | 讓干擾函數與最後估計式使用不同樣本的做法，交叉擬合是其一種。[renson2025, p.4] | [[cross-fitting]] |\n| 倒推遞迴 | backward recursion | 從最後一個時間步往前，每步估處理效應並決定治療的動態規劃式方法。[bluemlein2022, p.6] | [[backward-recursion]] |\n| 偽結局 | pseudo-outcome | 假如病人在之後的時間步都被最佳治療，會有的潛在結局；用來取代只在最後一步才觀察到的結局。[bluemlein2022, p.6] | [[backward-recursion]] |\n| 異質處理效應 | heterogeneous treatment effect（HTE） | bluemlein2022 對 blip 函數的稱呼：在病史條件下，治療與不治療的潛在結局期望差。[bluemlein2022, p.5] | [[blip-function]]、[[treatment-effect-heterogeneity]] |\n| 因果樹 | causal tree | 以專為處理效應設計的分裂準則分群，並估計每片葉子處理效應的決策樹。[bluemlein2022, p.8] | [[causal-tree-and-forest]] |\n| 因果森林 | causal forest | 許多棵因果樹的集成，以局部鄰域的加權平均估計每位病人的處理效應。[bluemlein2022, p.9] | [[causal-tree-and-forest]] |\n| 誠實分割 | honest splitting | 把資料分成訓練集（決定分群）與估計集（估計葉內效應），兩者不重疊。[bluemlein2022, p.8] | [[causal-tree-and-forest]]、[[cross-fitting]] |\n| DTR 因果樹／森林 | DTR-CT／DTR-CF | bluemlein2022 提出的兩個方法：把因果樹或因果森林放進倒推遞迴。[bluemlein2022, p.6] | [[bluemlein2022]]、[[causal-tree-and-forest]] |\n| 逆傾向分數加權 | inverse propensity weighting | 以傾向分數的倒數加權結局，bluemlein2022 沿用 DWOLS 的做法。[bluemlein2022, p.7] | [[doubly-robust-learner]]、[[q-learning-dwols-g-estimation]] |\n| DWOLS | dynamic weighted ordinary least squares | 在 Q 學習上加逆傾向分數權重的線性方法。[bluemlein2022, p.23] | [[q-learning-dwols-g-estimation]] |\n| G 估計 | G-estimation | 把估計的傾向分數放進估計方程式的迴歸式方法。[bluemlein2022, p.23] | [[q-learning-dwols-g-estimation]] |\n| 可詮釋 | interpretable | 決策邏輯本身透明；論文的用詞中，DTR-CT 屬於這一類。[bluemlein2022, p.2] | [[interpretability]] |\n| 可說明 | explainable | 靠替代模型提供洞察；論文的用詞中，DTR-CF 屬於這一類。[bluemlein2022, p.2] | [[interpretability]] |\n| 後悔值 | regret | 估計的最佳決定相對真正最佳決定，造成的結局損失；不為負，相同時為零。[bluemlein2022, p.13] | [[regret-and-decision-accuracy]] |\n| 決策準確度 | decision accuracy | 估計的最佳決定與真正最佳決定相符的比例。[bluemlein2022, p.13] | [[regret-and-decision-accuracy]] |\n| 期望增益 | expected gain（reward） | 真實資料中，依估計的最佳 DTR 治療相對於實際治療的預期結局增加量。[bluemlein2022, p.16] | [[regret-and-decision-accuracy]] |\n| 序列可交換性 | sequential exchangeability | 以病史為條件，足以移除估計 HTE 時的干擾偏誤。[bluemlein2022, p.6] | [[identification-assumptions]] |\n| 治療後偏誤 | post-treatment bias | 把治療後才量到的共變數放進模型，會「解釋掉」治療效果而造成的偏誤。[bluemlein2022, p.6] | [[backward-recursion]] |\n| 急性呼吸衰竭 | acute respiratory failure（ARF） | 需要立即處置的急症；論文定義為在室內空氣下低血氧與／或高二氧化碳。[hong2021, p.1] [hong2021, p.2] | [[hong2021]] |\n| 機械通氣 | mechanical ventilation（MV） | 重症 ARF 常需要的侵入性通氣，能維持氣體交換但也可能造成肺損傷。[hong2021, p.1] | [[mechanical-power]] |\n| 機械功率 | mechanical power（MP） | 把平台壓、呼吸速率、PEEP 等機械參數合成一個數字，單位 Joules/min。[hong2021, p.1] | [[mechanical-power]] |\n| 靜態／動態機械功率 | MP_static／MP_dynamic | MP 的兩個版本；靜態版與存活的關聯較強，DTR 只最佳化靜態版。[hong2021, p.2] [hong2021, p.3] | [[mechanical-power]] |\n| ΔMP | ΔMP | 實際 MP 減最佳 MP；等於零代表實際用的就是最佳值。[hong2021, p.3] [hong2021, p.5] | [[mechanical-power]]、[[regret-and-decision-accuracy]] |\n| 有限混合模型 | finite mixture modeling（FMM） | 又稱潛在剖面分析，把病人依特徵自動分成幾類，每人屬於各類的機率不同。[hong2021, p.2] | [[finite-mixture-subphenotypes]] |\n| 潛在剖面分析 | latent profile analysis（LPA） | 有限混合模型的別名。[hong2021, p.2] | [[finite-mixture-subphenotypes]] |\n| 表型／亞型 | phenotype／subtype | 論文用來稱有限混合模型分出的疾病類別。[hong2021, p.1] [hong2021, p.2] | [[finite-mixture-subphenotypes]] |\n| 末次觀察值延續 | last observation carried forward（LOCF） | 以最後一次觀察到的值補缺失值；論文用於縱貫資料。[hong2021, p.2] | [[decision-points-and-history]] |\n| 強化學習 | reinforcement learning（RL） | 代理在環境中採取行動，以最大化累積獎勵來學習做決策。[desman2025, p.2] | [[reinforcement-learning-mdp]] |\n| 馬可夫決策過程 | Markov Decision Process（MDP） | 把 RL 問題寫成每個時間步的狀態、行動、獎勵與下一個狀態。[desman2025, p.9] | [[reinforcement-learning-mdp]] |\n| 狀態／行動／獎勵 | state／action／reward | 這篇中分別是：每小時的病人特徵／每小時的胰島素劑量／依血糖範圍計分的回饋。[desman2025, p.9] | [[reinforcement-learning-mdp]] |\n| 折扣因子 | discount factor | 決定遠期獎勵比近期少算多少；論文設為 0.67，約 3 小時的有效視野。[desman2025, p.9] | [[reinforcement-learning-mdp]] |\n| 策略 | policy | 代理依狀態選行動的做法，隨訓練改進；本 wiki 對照為「規則」。[desman2025, p.2] | [[reinforcement-learning-mdp]]、[[dynamic-treatment-regime]] |\n| 離線強化學習 | offline RL | 代理從固定的資料集學習，不再與環境互動。[desman2025, p.2] | [[offline-reinforcement-learning]] |\n| 保守 Q 學習 | conservative Q learning（CQL） | 離線 RL 演算法，對學到的策略正則化，減輕在資料覆蓋不足處的高估。[desman2025, p.8] | [[offline-reinforcement-learning]] |\n| 分布式強化學習 | distributional RL | 刻畫可能結果的整個分布，而不只是期望獎勵。[desman2025, p.2] | [[distributional-reinforcement-learning]] |\n| 隱含分位數網路 | Implicit Quantile Networks（IQN） | 訓練時從連續的分位數值取樣，彈性地學出完整的報酬分布。[desman2025, p.9] | [[distributional-reinforcement-learning]] |\n| 離線策略評估 | off-policy evaluation（OPE） | 從既有資料估計學到的策略的表現，不實際施行。[desman2025, p.9] | [[off-policy-evaluation]] |\n| 擬合 Q 評估 | fitted Q evaluation（FQE） | 論文採用的 OPE 方法。[desman2025, p.9] | [[off-policy-evaluation]] |\n| 血糖在範圍內時間 | time in range（TIR） | 血糖落在 70 至 180 mg/dL 的時間比例。[desman2025, p.2] | [[desman2025]] |\n| 平均絕對誤差 | mean absolute error（MAE） | 各組建議劑量與內分泌科醫師建議之差的絕對值平均；論文用它衡量與專家的接近程度。[desman2025, p.10] | [[desman2025]] |\n| 排列式 SHAP | Permutation SHAP | 以合作賽局理論為基礎、與模型無關的方法，估計各特徵對模型預測的貢獻。[desman2025, p.10] | [[interpretability]] |\n| 階梯式胰島素 | sliding scale insulin | 反應式、非個人化的劑量：同一個血糖給同一個劑量。[desman2025, p.2] | [[desman2025]] |\n| 醫師在迴路中 | physician-in-the-loop | 需要較高劑量的情況仍須由醫師參與。[desman2025, p.9] | [[offline-reinforcement-learning]] |\n"}, "index": {"title": "index", "type": "", "sources": "", "group": "top", "md": "# ODTR Wiki 目錄\n\n主題：最佳動態治療策略（Optimal Dynamic Treatment Regimes）。讀者：沒學過因果推論的同學。\n規則見 `AGENTS.md`；操作紀錄見 [[log]]。\n\n## 來源（sources）\n\n- [[williams2024]] — Williams 等人：從縱貫資料學習最佳動態治療規則（教學型論文，BUP-NX 劑量範例）。\n- [[renson2025]] — Renson 等人：從統計估計目標推導機器學習估計式（EIF、單步估計式、速率倍增穩健）。\n- [[bluemlein2022]] — Blümlein 等人：用因果樹與因果森林學最佳動態治療策略（DTR-CT／DTR-CF，倒推遞迴，模擬與 MIMIC-III 加護病房資料）。\n- [[hong2021]] — Hong 等人：以有限混合模型把急性呼吸衰竭分成三類，再用 DTR 估計個人化機械功率（MIMIC-IV 加護病房資料，臨床應用）。\n- [[desman2025]] — Desman 等人：以分布式離線強化學習建議心臟手術後第一天每小時的胰島素劑量（GLUCOSE；MIMIC-IV 開發、eICU-CRD 外部驗證、三階段人類評估）。\n\n## 概念（concepts）\n\n- [[dynamic-treatment-regime]] — 動態治療策略：靜態與動態規則。\n- [[decision-points-and-history]] — 決策時間點與病史：連續決策。\n- [[optimal-dynamic-treatment-rule]] — 最佳動態治療規則（ODTR）與規則的價值。\n- [[treatment-effect-heterogeneity]] — 平均效果與處理效應異質性。\n- [[blip-function]] — Blip 函數（條件平均處理效應）。\n- [[doubly-robust-learner]] — 倍增穩健學習器：從資料學出規則的方法。\n- [[identification-assumptions]] — 因果識別的前提假設。\n- [[statistical-estimand]] — 統計估計目標：想知道什麼數字，與估計式的差別。\n- [[nuisance-functions]] — 干擾函數：結局迴歸、傾向分數等輔助估計對象。\n- [[efficient-influence-function]] — 有效影響函數（EIF）：估計目標的「斜率」。\n- [[plug-in-and-one-step-estimators]] — 代入式與單步（AIPW）估計式。\n- [[rate-double-robustness]] — 速率倍增穩健：為什麼能配機器學習又有有效推論。\n- [[cross-fitting]] — 交叉擬合與樣本分割。\n- [[backward-recursion]] — 倒推遞迴與偽結局：從最後一個時間點往前估計。\n- [[q-learning-dwols-g-estimation]] — Q 學習、DWOLS 與 G 估計：古典的線性迴歸式方法。\n- [[causal-tree-and-forest]] — 因果樹與因果森林：誠實分割、用樹估計處理效應。\n- [[interpretability]] — 可解釋性：interpretable 與 explainable 的差別。\n- [[regret-and-decision-accuracy]] — 後悔值與決策準確度：模擬與真實資料怎麼評估學出的規則。\n- [[mechanical-power]] — 機械功率（MP）：呼吸器參數合成的一個數字，hong2021 的「劑量」。\n- [[finite-mixture-subphenotypes]] — 有限混合模型與表型：先不看標籤把病人自動分類。\n- [[reinforcement-learning-mdp]] — 強化學習與馬可夫決策過程：狀態、行動、獎勵、折扣因子（desman2025 的框架）。\n- [[offline-reinforcement-learning]] — 離線強化學習與保守 Q 學習（CQL）：只從固定資料學，並對資料之外的行動保守。\n- [[distributional-reinforcement-learning]] — 分布式強化學習：看結果的整個分布，不只看平均。\n- [[off-policy-evaluation]] — 離線策略評估（OPE）與擬合 Q 評估（FQE）：不上線也估計策略的表現。\n\n## 比較與綜合（syntheses）\n\n- [[overview-for-beginners]] — 如果你只讀一頁：五篇來源與主要概念，依教學順序串成的導覽。\n- [[method-comparison]] — 方法比較：估計式家族，「倍增穩健」的幾種意思，以及三篇在多時間點、可解釋性、評估方式上的對照；文末加入 hong2021 後的四篇對照，再加入 desman2025（強化學習路線）的對照。\n- [[dtr-clinical-applications]] — DTR 的臨床應用：三個情境（藥物劑量、ICU 開關式處置、連續劑量）並排，以及怎麼檢查規則；文末加上第四個情境（desman2025，術後胰島素劑量）。\n\n## 術語表\n\n- [[glossary]] — 中文／English／一句話定義／詳見頁面。\n"}, "log": {"title": "log", "type": "", "sources": "", "group": "top", "md": "# 操作紀錄（append-only）\n\n格式：日期 | 操作 | 動到的頁面 | lint 結果\n\n- 2026-11-15 | setup | 建立 AGENTS.md、index、log、tools/ | —\n- 2026-11-15 | ingest williams2024 | sources/williams2024, concepts x7, glossary, index | lint PASS after 2 round(s)\n- 2026-11-15 | ingest renson2025 | sources/renson2025, concepts x6 new (statistical-estimand, nuisance-functions, efficient-influence-function, plug-in-and-one-step-estimators, rate-double-robustness, cross-fitting) + 2 extended (doubly-robust-learner, identification-assumptions), syntheses/method-comparison, glossary, index | lint PASS after 1 run(s)\n- 2026-11-15 | ingest bluemlein2022 | sources/bluemlein2022, concepts x5 new (backward-recursion, q-learning-dwols-g-estimation, causal-tree-and-forest, interpretability, regret-and-decision-accuracy) + 10 extended (dynamic-treatment-regime, decision-points-and-history, optimal-dynamic-treatment-rule, treatment-effect-heterogeneity, blip-function, doubly-robust-learner, identification-assumptions, nuisance-functions, cross-fitting, rate-double-robustness), syntheses/method-comparison, sources/williams2024 + sources/renson2025 (relations section only), glossary, index | lint PASS after 1 run(s)\n- 2026-11-15 | ingest hong2021 | sources/hong2021, concepts x2 new (mechanical-power, finite-mixture-subphenotypes) + 8 extended (dynamic-treatment-regime, decision-points-and-history, optimal-dynamic-treatment-rule, treatment-effect-heterogeneity, blip-function, q-learning-dwols-g-estimation, identification-assumptions, regret-and-decision-accuracy), syntheses/dtr-clinical-applications (new) + method-comparison, sources/williams2024 + sources/renson2025 + sources/bluemlein2022 (relations section only), glossary, index | lint PASS after 1 run(s)\n- 2026-11-15 | ingest desman2025 | sources/desman2025, concepts x4 new (reinforcement-learning-mdp, offline-reinforcement-learning, distributional-reinforcement-learning, off-policy-evaluation) + 8 extended (dynamic-treatment-regime, decision-points-and-history, optimal-dynamic-treatment-rule, treatment-effec
