<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ODTR LLM Wiki</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { --bg:#fbfaf7; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc; --accent:#1f5f5b; --soft:#e8f0ef; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#161716; --panel:#1f201f; --ink:#ecebe6; --muted:#a3a29c; --line:#34352f; --accent:#7fc2bb; --soft:#22312f; } }
  :root[data-theme="dark"] { --bg:#161716; --panel:#1f201f; --ink:#ecebe6; --muted:#a3a29c; --line:#34352f; --accent:#7fc2bb; --soft:#22312f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; line-height:1.75; }
  .wrap { display:grid; grid-template-columns: 280px minmax(0,1fr); min-height:100vh; }
  nav { border-right:1px solid var(--line); padding:20px 16px; position:sticky; top:0; height:100vh; overflow:auto; background:var(--panel); }
  nav h1 { font-family:"Noto Serif TC",serif; font-size:20px; margin:0 0 4px; }
  nav .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  nav input { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; font-size:14px; }
  nav h2 { font-size:12px; letter-spacing:.08em; color:var(--muted); margin:18px 0 6px; text-transform:uppercase; }
  nav a { display:block; color:var(--ink); text-decoration:none; font-size:14px; padding:3px 6px; border-radius:4px; }
  nav a:hover { background:var(--soft); }
  nav a.on { background:var(--soft); color:var(--accent); font-weight:500; }
  main { padding:32px 48px 80px; max-width:920px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:6px; }
  main h1 { font-family:"Noto Serif TC",serif; font-size:30px; line-height:1.35; margin:0 0 18px; }
  main h2 { font-size:21px; margin:30px 0 8px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  main h3 { font-size:17px; margin:22px 0 6px; color:var(--accent); }
  main a { color:var(--accent); }
  table { border-collapse:collapse; width:100%; font-size:14px; display:block; overflow-x:auto; }
  th, td { border:1px solid var(--line); padding:6px 9px; vertical-align:top; text-align:left; }
  th { background:var(--soft); }
  code { background:var(--soft); padding:1px 5px; border-radius:4px; font-size:.9em; }
  .cite { font-size:12px; color:var(--muted); background:var(--soft); border-radius:4px; padding:0 5px; white-space:nowrap; }
  .menu { display:none; }
  @media (max-width: 760px) {
    .wrap { grid-template-columns: 1fr; }
    nav { position:static; height:auto; max-height:none; border-right:0; border-bottom:1px solid var(--line); display:none; }
    nav.open { display:block; }
    .menu { display:block; position:sticky; top:0; z-index:2; width:100%; padding:10px 16px; background:var(--panel); border:0; border-bottom:1px solid var(--line); color:var(--ink); font:inherit; text-align:left; }
    main { padding:20px 16px 60px; }
  }
</style>
</head>
<body>
<button class="menu" id="menu">☰ 目錄</button>
<div class="wrap">
  <nav id="nav">
    <h1>ODTR LLM Wiki</h1>
    <div class="sub">最佳動態治療策略 · 5 篇來源 · 給沒學過因果推論的同學</div>
    <input id="q" placeholder="搜尋頁面…" aria-label="搜尋頁面">
    <div id="list"></div>
  </nav>
  <main id="main"></main>
</div>
<script>
const PAGES = /*PAGES*/null;
const GROUPS = [["top","總覽"],["syntheses","比較與綜合"],["sources","來源"],["concepts","概念"]];
function linkify(md) {
  return md
    .replace(/\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g, (m, s) => PAGES[s.trim()] ? `[${PAGES[s.trim()].title}](#${s.trim()})` : m)
    .replace(/\[([a-z]+\d{4}),\s*(pp?\.\s*\d+(?:\s*[-–]\s*\d+)?)\]/g, '<span class="cite">$1 $2</span>');
}
function renderList(filter) {
  const box = document.getElementById('list');
  const cur = decodeURIComponent(location.hash.slice(1)) || 'index';
  let html = '';
  for (const [g, label] of GROUPS) {
    const items = Object.entries(PAGES).filter(([k, p]) => p.group === g &&
      (!filter || (k + p.title + p.md).toLowerCase().includes(filter.toLowerCase())));
    if (!items.length) continue;
    html += `<h2>${label}</h2>` + items.map(([k, p]) =>
      `<a href="#${k}" class="${k === cur ? 'on' : ''}">${p.title.replace(/</g, '&lt;')}</a>`).join('');
  }
  box.innerHTML = html;
}
function show() {
  const k = decodeURIComponent(location.hash.slice(1)) || 'index';
  const p = PAGES[k] || PAGES.index;
  const meta = p.type ? `<div class="meta">${p.type} · 來源：${p.sources.replace(/[\[\]]/g, '')}</div>` : '';
  const body = marked.parse(linkify(p.md));
  document.getElementById('main').innerHTML = meta + (/^\s*#\s/.test(p.md) ? '' : `<h1>${p.title}</h1>`) + body;
  document.title = p.title + ' · ODTR LLM Wiki';
  renderList(document.getElementById('q').value);
  window.scrollTo(0, 0);
  document.getElementById('nav').classList.remove('open');
}
document.getElementById('q').addEventListener('input', e => renderList(e.target.value));
document.getElementById('menu').addEventListener('click', () => document.getElementById('nav').classList.toggle('open'));
window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
